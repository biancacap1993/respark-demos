<meta charset="utf-8">
<title>ReSpark Consumer Weights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of the ReSpark Sales → Invoices tab and its Enter Consumer
   Weights mode; a pulsing hotspot + tooltip guides each step; step controls sit
   under the frame. The app mock keeps ReSpark's light theme (it stands in
   for a screenshot); the page around it follows the viewer's theme. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 22px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.crumbs { font-size: 12px; color: var(--a-text-3); display: flex; align-items: center; gap: 4px; }
.crumbs svg.lucide { width: 12px; height: 12px; }
.phead h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.phead .left { display: flex; flex-direction: column; gap: 4px; }
.phead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.icon { width: 32px; padding: 0; justify-content: center; }
.badge { display: inline-flex; align-items: center; height: 20px; padding-inline: 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.b-success { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.b-accent { background: hsla(252, 89%, 65%, 0.14); color: var(--a-accent-strong); }
.b-neutral { background: hsla(217, 55%, 16%, 0.07); color: var(--a-text-2); }


table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12.5px; padding: 0 12px; height: 38px; background: var(--a-muted-solid); border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; }
td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* sales page + consumer weights flow (ConsumerWeightsEntry swaps into the Invoices tab) */
.phead { padding: 14px 24px 0; border-bottom: 0; }
.tabs { display: flex; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--a-border-subtle); font-size: 13.5px; font-weight: 500; color: var(--a-text-3); }
.tabs span { padding: 10px 0 9px; border-bottom: 2px solid transparent; }
.tabs span.on { color: var(--a-fg); border-bottom-color: var(--a-primary); }
.ibody { flex: 1; min-height: 0; padding: 12px 24px 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.tbar { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.tbar .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.rb { height: 34px; }
.rb.gh { border-color: transparent; background: transparent; }
.inp { height: 34px; }
.fpill { height: 30px; border: 1px dashed var(--a-border); border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; padding-inline: 10px; font-size: 12.5px; color: var(--a-text-2); white-space: nowrap; }
.fpill b { font-weight: 600; color: var(--a-fg); }
.fpill svg.lucide { width: 13px; height: 13px; }
.steplbl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--a-text-3); white-space: nowrap; }
.steplbl .t { font-weight: 600; color: var(--a-fg); }
.steplbl .on { font-weight: 600; color: var(--a-fg); }
.steplbl svg.lucide { width: 14px; height: 14px; }
.cnt2 { font-size: 13px; color: var(--a-text-3); white-space: nowrap; }
.gwrap { border: 1px solid var(--a-border-subtle); border-radius: 8px; overflow: hidden; flex: 1; min-height: 0; position: relative; }
.grid { font-size: 12.5px; }
.grid th { height: 36px; font-size: 12px; color: var(--a-text-2); padding: 0 10px; }
.grid td { height: 40px; padding: 0 10px; }
.grid td.num, .grid th.num { text-align: right; }
.grid .lnk { color: var(--a-primary-hover); font-weight: 500; }
.chipst { display: inline-flex; align-items: center; height: 22px; padding-inline: 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; }
.s-open { background: hsla(217, 91%, 60%, 0.12); color: hsl(217 70% 40%); }
.s-paid { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.s-rec { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.cbx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--a-border); display: inline-grid; place-items: center; vertical-align: middle; }
.cbx.on { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.cbx.on svg.lucide { width: 12px; height: 12px; stroke-width: 3; }
.cbx.dis { background: var(--a-hover); border-color: var(--a-border-subtle); }
.grid tr.picked td { background: hsla(183, 100%, 33%, 0.06); }
.grid tr.locked td { color: var(--a-text-3); }
.grid tr.locked .chipst { opacity: .75; }
.grid tbody.pk tr { cursor: default; }
.ent { display: inline-flex; align-items: center; height: 20px; padding-inline: 7px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid hsla(183, 100%, 33%, 0.4); background: var(--a-primary-subtle); color: var(--a-primary-hover); }
.muted { color: var(--a-text-3); }
.ltip { position: absolute; z-index: 5; background: hsla(217, 30%, 22%, 0.95); color: #fff; font-size: 12px; line-height: 1.4; border-radius: 5px; padding: 6px 9px; max-width: 300px; animation: pop .18s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* enter grid */
.eg th { font-size: 11.5px; padding: 0 7px; white-space: normal; line-height: 1.2; height: 40px; }
.eg td { padding: 0 7px; height: 42px; }
.eg tr.inv td { background: var(--a-muted-solid); font-weight: 500; }
.eg tr.inv .idc { display: flex; align-items: center; gap: 6px; }
.eg tr.inv .idc svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.eg tr.inv .idc div { display: flex; flex-direction: column; line-height: 1.2; }
.eg tr.inv .idc div { min-width: 0; white-space: nowrap; }
.eg tr.inv .idc small, .eg tr.inv .idc b { overflow: hidden; text-overflow: ellipsis; }
.eg td.num { white-space: nowrap; }
.eg tr.inv .idc small { font-weight: 400; color: var(--a-text-3); font-size: 11px; }
.eg .obt { padding-left: 26px; display: flex; flex-direction: column; line-height: 1.2; }
.eg .obt small { font-size: 10.5px; color: var(--a-text-3); }
.eg tr.split td { background: hsla(183, 100%, 33%, 0.035); }
.ec { display: flex; align-items: center; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 4px; padding-inline: 6px; background: var(--a-surface); gap: 3px; white-space: nowrap; overflow: hidden; }
.ec.r { justify-content: flex-end; }
.ec .u { color: var(--a-text-3); }
.ec.ph { color: var(--a-text-3); }
.ec.act { border-color: var(--a-primary); box-shadow: 0 0 0 2px hsla(183, 100%, 33%, 0.18); }
.ec.chg { background: hsla(38, 92%, 50%, 0.09); }
.ec.sel svg.lucide { margin-left: auto; width: 13px; height: 13px; color: var(--a-icon-2); }
.mat2 { display: flex; flex-direction: column; line-height: 1.15; overflow: hidden; }
.sp { font-size: 11px; color: var(--a-text-3); margin-right: 4px; }
.ded { color: var(--a-error-strong); }
.ia { display: flex; gap: 2px; justify-content: flex-end; }
.ia span { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; color: var(--a-icon-2); }
.ia span svg.lucide { width: 15px; height: 15px; }
.uab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--a-border); background: var(--a-muted-solid); border-radius: 6px; padding: 7px 12px; }
.uab > b { font-size: 13px; font-weight: 500; }
.udf { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--a-text-2); }
.udf .ec { width: 112px; }
.udf .ec svg.lucide { margin-left: auto; width: 13px; height: 13px; color: var(--a-icon-2); }
.ebar { display: flex; align-items: center; gap: 14px; background: var(--a-dark); color: #fff; border-radius: 8px; padding: 8px 10px 8px 14px; font-size: 13px; }
.ebar .sum2 { display: flex; align-items: center; gap: 5px; }
.ebar .sum2 svg.lucide { width: 14px; height: 14px; opacity: .7; }
.ebar .sw { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.ebar .sw i.k { width: 26px; height: 15px; border-radius: 8px; background: rgba(255,255,255,.25); position: relative; font-style: normal; }
.ebar .sw i.k::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
.ebar .vl { text-decoration: underline; opacity: .85; }
.ebar .r { margin-left: auto; display: flex; gap: 8px; }
.ebar .rb { height: 32px; }
.ebar .rb.dng { background: transparent; color: hsl(348 90% 72%); border-color: hsla(348, 81%, 60%, 0.6); }
.pop { position: absolute; z-index: 6; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18); animation: pop .18s ease; }
.pop.still { animation: none; }
.mpk { width: 320px; padding: 6px; }
.mpk .s { display: flex; align-items: center; gap: 6px; height: 32px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); font-size: 12.5px; margin-bottom: 4px; }
.mpk .s svg.lucide { width: 14px; height: 14px; }
.mpk .gh { font-size: 11px; font-weight: 600; color: var(--a-text-3); padding: 8px 8px 4px; }
.mpk .o { padding: 7px 8px; border-radius: 5px; font-size: 13px; }
.mpk .o.hv { background: var(--a-hover); }
.dedp { width: 420px; padding: 12px; display: flex; flex-direction: column; gap: 9px; }

<script>
(() => {
  const W = 1440, H = 820;
  const MARK = '<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M152.38 13.33C171.29 13.33 186.67 28.71 186.67 47.62V152.38C186.67 171.29 171.29 186.67 152.38 186.67H47.62C28.71 186.67 13.33 171.29 13.33 152.38V47.62C13.33 28.71 28.71 13.33 47.62 13.33H152.38ZM152.38 0H47.62C21.32 0 0 21.32 0 47.62V152.38C0 178.68 21.32 200 47.62 200H152.38C178.68 200 200 178.68 200 152.38V47.62C200 21.32 178.68 0 152.38 0Z" fill="#00C9D4"/><path d="M93.39 62.1C89.98 59.66 84.7 58.7 80.99 58.69L26.11 58.74L44.28 71.71H82.53C83.21 71.71 83.79 71.96 84.24 72.29C85.21 72.98 85.5 74.27 84.5 75.67L72.84 92.1L84.25 100.24L96.2 83.46C101.27 76.35 101.05 67.54 93.42 62.1L93.4 62.08Z" fill="currentColor"/><path d="M49.21 102.91C53.53 102.91 58.53 105.26 61.64 107.48L107.62 140.38H84.65L52.58 117.49C52.03 117.05 51.38 116.94 50.8 116.94C49.57 116.94 48.56 117.84 48.56 119.62L48.53 140.38H34.11V119.16C34.11 110.16 39.55 102.91 49.19 102.91Z" fill="currentColor"/><path d="M166.27 115.45V103.76C166.27 96.91 164.14 91.42 159.86 87.3C155.58 83.18 149.91 81.1 142.82 81.1H133.49C128.74 81.1 124.57 82.06 120.95 83.97C117.32 85.88 114.54 88.56 112.55 92.02C110.56 95.49 109.58 99.5 109.58 104.01V119.65C109.58 123.94 110.56 127.7 112.55 130.98C114.54 134.26 117.3 136.82 120.92 138.62C124.55 140.39 128.72 141.3 133.46 141.3H142.32C149.41 141.3 155.11 139.5 159.47 135.92C163.83 132.34 166.02 127.59 166.02 121.67H152.85C152.85 124.15 151.9 126.15 149.99 127.68C148.08 129.18 145.57 129.95 142.46 129.95H133.49C130.3 129.95 127.76 128.99 125.85 127.14C123.94 125.26 122.99 122.77 122.99 119.66V115.46H166.27ZM122.72 105.4V104.34C122.72 100.76 123.7 97.84 125.69 95.63C127.65 93.42 130.24 92.3 133.43 92.3H142.89C145.94 92.3 148.37 93.36 150.25 95.47C152.13 97.57 153.06 100.36 153.06 103.77V105.41H122.71Z" fill="currentColor"/></svg>';
  document.getElementById('brand').innerHTML = MARK + '<span>ReSpark</span>';


  const ic = (n, extra = '') => `<i data-lucide="${n}" ${extra}></i>`;

  // Sample data (illustrative). Three open invoices from outbound tickets that
  // a mill has weighed and sent back on one freight bill.
  const money = v => (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const lb = v => v.toLocaleString('en-US') + ' lb';
  const PER = { gt: 2240, nt: 2000, lb: 1 };
  const LIST = [
    { inv: '10488', st: 'Open', cust: 'Lakeview Steel', tk: 1, obt: '3324', so: 'SO-1192', mill: '', mat: 'Shred', amt: 6984.10, iss: '10/23/26', due: '11/22/26' },
    { inv: '10482', st: 'Open', cust: 'Calumet Steel Works', tk: 1, obt: '3318', so: 'SO-1187', mill: '', mat: 'HMS 1&2', amt: 7104.20, iss: '10/21/26', due: '11/20/26', pick: true },
    { inv: '10479', st: 'Open', cust: 'Prairie Foundry Co.', tk: 1, obt: '3311', so: 'SO-1181', mill: '', mat: 'Shred', amt: 6912.75, iss: '10/20/26', due: '11/19/26', pick: true },
    { inv: '10475', st: 'Open', cust: 'Riverbend Mill', tk: 1, obt: '3302', so: 'SO-1176', mill: '', mat: '#1 Busheling', amt: 8960.40, iss: '10/19/26', due: '11/18/26', pick: true },
    { inv: '10471', st: 'Paid', cust: 'Calumet Steel Works', tk: 2, obt: '3296, 3297', so: 'SO-1170', mill: 'MT-55088, MT-55089', mat: 'Mixed', amt: 14210.60, iss: '10/16/26', due: '11/15/26', cw: 'Entered', id: 'lock-row' },
    { inv: '10466', st: 'Reconciled', cust: 'Riverbend Mill', tk: 1, obt: '3289', so: 'SO-1165', mill: 'MT-55071', mat: '#1 Busheling', amt: 9102.30, iss: '10/14/26', due: '11/13/26', cw: 'Entered' },
    { inv: '10463', st: 'Open', cust: 'Prairie Foundry Co.', tk: 1, obt: '3285', so: 'SO-1160', mill: '', mat: 'P&S Plate & Structural', amt: 7520.00, iss: '10/13/26', due: '11/12/26' },
    { inv: '10459', st: 'Paid', cust: 'Lakeview Steel', tk: 1, obt: '3279', so: 'SO-1154', mill: 'MT-55040', mat: 'Shred', amt: 7015.85, iss: '10/12/26', due: '11/11/26', cw: 'Entered' },
  ];
  const stc = st => `<span class="chipst ${st === 'Paid' ? 's-paid' : st === 'Reconciled' ? 's-rec' : 's-open'}">${st}</span>`;

  // ---------- steps ----------
  const LISTURL = '/app/sales/invoices', PICKURL = LISTURL + '?cw=pick', ENTERURL = LISTURL + '?cw=enter';
  const STEPS = [
    { view: 'list', cover: 'intro', url: LISTURL },
    { view: 'list', t: '#btn-cw', place: 'bottom', url: LISTURL,
      tip: 'In <b>Sales → Invoices</b>, click <b>Enter consumer weights</b>.' },
    { view: 'pick', picks: 3, t: '#picked', place: 'bottom', url: PICKURL,
      tip: 'Step 1 is <b>Pick Invoices</b>. Check every invoice on the mill’s freight bill. You can search by invoice, OBT or mill ticket number, and your picks stay checked as you search.' },
    { view: 'pick', picks: 3, lockTip: true, t: '#lock-row', place: 'top', url: PICKURL,
      tip: 'Paid, closed and void invoices are greyed out and can’t be picked. Hover one to see why.' },
    { view: 'pick', picks: 3, t: '#btn-enter', place: 'bottom', url: PICKURL,
      tip: 'Click <b>Enter weights for 3 invoices</b>.' },
    { view: 'enter', t: '#ln-10482', place: 'bottom', url: ENTERURL,
      tip: 'Step 2 is <b>Enter Weights</b>, one grid for every invoice you picked. Tab through <b>Mill Ticket #</b>, <b>Material</b>, <b>Consumer Gross</b>, <b>Consumer Tare</b>, <b>UM</b> and <b>Consumer Price</b>. <b>Consumer Net</b> and <b>Value</b> work themselves out.' },
    { view: 'enter', t: '#split-btn', place: 'left', url: ENTERURL,
      tip: 'The mill graded part of the load as something else? Click the split icon (<b>Split into another material</b>).' },
    { view: 'enter', split: 'picking', t: '#mpk', place: 'right', url: ENTERURL,
      tip: 'A split line appears under the original. Pick its material. Materials <b>On sales order</b> are listed first, then <b>Other materials</b>.' },
    { view: 'enter', split: 'done', ded: true, t: '#dedp', place: 'left', url: ENTERURL,
      tip: 'Open <b>Deductions</b> on a line and click <b>Add deduction</b>. Choose <b>Weight</b> or <b>Value</b>, a reason and an amount.' },
    { view: 'enter', split: 'done', dedDone: true, uab: true, t: '#uab', place: 'bottom', url: ENTERURL,
      tip: 'Use <b>Update All Invoices</b> to set <b>Load Received</b> and <b>Date Unloaded</b> once, then click <b>Apply to all 3 invoices</b>.' },
    { view: 'enter', split: 'done', dedDone: true, dates: true, t: '#btn-apply', place: 'top', url: ENTERURL,
      tip: 'The bar under the grid counts your changes. Click <b>Apply changes</b> to save every invoice at once.' },
    { view: 'list', toast: true, t: '#toast', place: 'left', url: LISTURL,
      tip: 'You’re back on the invoice list while the save runs. When it’s done, the invoices bill on consumer weights.' },
    { view: 'list', toast: true, cover: 'outro', url: LISTURL },
  ];

  // ---------- chrome ----------
  function sidebar(active) {
    const row = (i, l, extra = '', id = '') => `<div class="nrow${active === id && id ? ' active' : ''}"${id ? ` id="nav-${id}"` : ''}>${ic(i)}<span>${l}</span>${extra || ic('chevron-right', 'class="chev"')}</div>`;
    return `<aside class="side">
      <div class="top">${MARK}<div class="yard"><span>North Yard</span>${ic('chevrons-up-down')}</div></div>
      <div class="nav">
        ${row('inbox', 'Inbox', '<span class="pill">4</span>')}
        ${row('messages-square', 'ScrapChat', ' ')}
        <div class="cmd" style="margin:2px 0">${ic('search')}<span>Search &amp; actions</span><kbd>⌘K</kbd></div>
        <div class="nsep"></div>
        ${row('shopping-cart', 'Purchases')}${row('tag', 'Sales', '', 'sales')}${row('file-text', 'Contracts')}${row('boxes', 'Inventory')}${row('users', 'Customers')}${row('layers', 'Commodities')}${row('truck', 'Logistics')}

      </div>
      <div class="foot"><div class="av">JP</div><div class="who"><span>Jordan Pike</span><small>General Manager</small></div>
        <div class="ico"><span>${ic('settings')}</span><span>${ic('circle-help')}</span></div></div>
    </aside>`;
  }

  // Sales layout: title "Sales" + tabs (ConditionalSalesLayout / routes.tsx).
  const salesHead = () => `<div class="phead"><div class="left"><h1>Sales</h1></div></div>
    <div class="tabs"><span>Outbound Tickets</span><span class="on">Invoices</span><span>Bulk Invoice Payments</span><span>Credit Memos</span></div>`;

  function listView(s) {
    const rows = LIST.map(r => `<tr><td><span class="lnk">${r.inv}</span></td><td>${stc(r.st)}</td><td>${r.cust}</td><td class="num">${r.tk}</td><td>${r.obt}</td><td>${r.so}</td><td>${s.toast && r.pick ? `MT-${({ '10482': '55120', '10479': '55131', '10475': '55136' })[r.inv]}` : r.mill || '<span class="muted">–</span>'}</td><td>${r.mat}</td><td class="num">${money(s.toast && r.pick ? ({ '10482': 7301.16, '10479': 7087.95, '10475': 9070.89 })[r.inv] : r.amt)}</td><td>${r.iss}</td><td>${r.due}</td></tr>`).join('');

    return `<main class="main">${salesHead()}
      <div class="ibody">
        <div class="tbar"><div class="inp" style="width:300px">${ic('search')}<span>Search invoice, customer, order…</span></div>

          <div class="r"><span class="rb" id="btn-cw">${ic('scale')}Enter consumer weights</span><span class="rb">Record payment</span><span class="rb pri">${ic('plus')}Create Invoice</span></div></div>
        <div class="gwrap"><table class="grid"><colgroup><col style="width:84px"><col style="width:108px"><col style="width:170px"><col style="width:70px"><col style="width:100px"><col style="width:86px"><col style="width:150px"><col style="width:140px"><col style="width:110px"><col style="width:84px"><col style="width:84px"></colgroup>
          <thead><tr><th>Invoice #</th><th>Status</th><th>Customer</th><th class="num">Tickets</th><th>OBT #</th><th>SO #</th><th>Mill Ticket #</th><th>Materials</th><th class="num">Amount</th><th>Issued</th><th>Due</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      </div>${toast}</main>`;
  }

  const stepLabel = cur => `<div class="steplbl"><span class="t">Enter Consumer Weights</span><span class="${cur === 1 ? 'on' : ''}">1 · Pick Invoices</span>${ic('chevron-right')}<span class="${cur === 2 ? 'on' : ''}">2 · Enter Weights</span></div>`;

  function pickView(s) {
    const row = r => {
      const locked = r.st === 'Paid';
      const cls = locked ? 'locked' : r.pick ? 'picked' : '';
      const cb = locked ? '<span class="cbx dis"></span>' : r.pick ? `<span class="cbx on">${ic('check')}</span>` : '<span class="cbx"></span>';

    return `<main class="main">${salesHead()}
      <div class="ibody">
        <div class="tbar">${stepLabel(1)}

          <tbody class="pk">${row(LIST[0])}</tbody><tbody class="pk" id="picked">${LIST.slice(1, 4).map(row).join('')}</tbody><tbody class="pk">${LIST.slice(4).map(row).join('')}</tbody></table>${lockTip}</div>
      </div></main>`;
  }

  // Enter step: one grid; each invoice is a parent row (dates), its ticket
  // lines sit beneath it (ConsumerWeightsGrid / useConsumerWeightsColumns).
  function enterView(s) {
    const L = [
      { inv: '10482', cust: 'Calumet Steel Works', obt: '3318', mill: 'MT-55120', mat: 'HMS 1&2', g: s.split === 'done' ? 71820 : 84220, t: 31960, um: 'gt', p: 310 },
      { inv: '10479', cust: 'Prairie Foundry Co.', obt: '3311', mill: 'MT-55131', mat: 'Shred', g: 79880, t: 30140, um: 'nt', p: 285 },
      { inv: '10475', cust: 'Riverbend Mill', obt: '3302', mill: 'MT-55136', mat: '#1 Busheling', g: 82460, t: 31020, um: 'gt', p: 395 },
    ];
    const val = l => Math.round((l.g - l.t) / PER[l.um] * l.p * 100) / 100;
    const ded1 = s.dedDone ? -125 : 0;
    const SPLIT = { mat: 'P&S Plate & Structural', g: 12400, t: 0, um: 'gt', p: 345 };
    const dateCell = v => s.dates ? `<div class="ec chg">${v}</div>` : '<div class="ec ph">MM/DD/YY</div>';
    const lines = s.split === 'done' ? 4 : s.split ? 4 : 3;
    const actions = (id, extra = '') => `<div class="ia">${extra}<span${id ? ` id="${id}"` : ''}>${ic('split')}</span></div>`;
    const lineRow = (l, i) => {
      const v = val(l) + (i === 0 ? ded1 : 0);
      const ded = i === 0 && s.dedDone ? '<span class="ded">−$125.00 · 1</span>' : '<span class="muted">None</span>';
      const dedCell = i === 0 && s.ded
        ? `<td style="overflow:visible; position:relative"><div class="ec act">${ded}</div>${dedPop()}</td>`
        : `<td>${ded}</td>`;
      return `<tr id="ln-${l.inv}"><td><div class="obt"><small>OBT #</small><span>${l.obt}</span></div></td><td></td><td></td>
        <td><div class="ec">${l.mill}</div></td><td><div class="ec"><span>${l.mat}</span></div></td>
        <td><div class="ec r">${l.g.toLocaleString('en-US')}<span class="u">lb</span></div></td><td><div class="ec r">${l.t.toLocaleString('en-US')}<span class="u">lb</span></div></td>

        <td><div class="ec r${i === 0 && !s.split ? ' act' : ''}"><span class="u" style="margin-right:auto">$</span>${l.p.toFixed(2)}<span class="u">/${l.um}</span></div></td>
        ${dedCell}<td class="num">${money(v)}</td><td>${actions(i === 0 ? 'split-btn' : '', i === 0 && s.split ? `<span>${ic('undo-2')}</span>` : '')}</td></tr>`;
    };
    const splitRow = () => {
      if (!s.split) return '';
      const done = s.split === 'done';
      const matCell = done ? `<div class="ec"><span class="sp">↳ 2/2</span><span>${SPLIT.mat}</span></div>` : '<div class="ec act ph"><span class="sp">↳ 2/2</span>Select material</div>';
      return `<tr class="split"><td></td><td></td><td></td><td></td>
        <td style="overflow:visible; position:relative">${matCell}${done ? '' : matPop()}</td>
        <td><div class="ec r">${done ? SPLIT.g.toLocaleString('en-US') : '0'}<span class="u">lb</span></div></td><td><div class="ec r">0<span class="u">lb</span></div></td>
        <td class="num">${lb(done ? SPLIT.g : 0)}</td><td><div class="ec sel">gt${ic('chevron-down')}</div></td>
        <td><div class="ec r${done ? '' : ' ph'}"><span class="u" style="margin-right:auto">$</span>${done ? SPLIT.p.toFixed(2) : 'Pick a material'}${done ? '<span class="u">/gt</span>' : ''}</div></td>
        <td><span class="muted">None</span></td><td class="num">${done ? money(Math.round(SPLIT.g / 2240 * SPLIT.p * 100) / 100) : '<span class="muted">Needs a material</span>'}</td>
        <td><div class="ia"><span>${ic('circle-minus')}</span><span>${ic('split')}</span></div></td></tr>`;
    };
    const invRow = (l, i) => {
      const extra = i === 0 && s.split === 'done' ? Math.round(SPLIT.g / 2240 * SPLIT.p * 100) / 100 : 0;
      const net = (l.g - l.t) + (i === 0 && s.split === 'done' ? SPLIT.g : 0);
      const nlines = i === 0 && s.split ? 2 : 1;
      const v = i === 0 && s.split === 'picking' ? '<span class="muted">Waiting on prices</span>' : money(val(l) + extra + (i === 0 ? ded1 : 0));
      const dsum = i === 0 && s.dedDone ? '<span class="ded">−$125.00</span>' : '<span class="muted">None</span>';
      return `<tr class="inv"><td><div class="idc">${ic('chevron-down')}<div><b>${l.inv}</b><small>${l.cust}</small></div></div></td>
        <td>${dateCell('10/22/26')}</td><td>${dateCell('10/23/26')}</td><td></td><td>1 ticket · ${nlines} line${nlines > 1 ? 's' : ''}</td><td></td><td></td>
        <td class="num"><b>${lb(net)}</b></td><td></td><td></td><td>${dsum}</td><td class="num"><b>${v}</b></td><td></td></tr>`;
    };
    const body = L.map((l, i) => invRow(l, i) + lineRow(l, i) + (i === 0 ? splitRow() : '')).join('');
    const problems = s.split === 'picking' ? '<span style="color:var(--a-error); font-size:13px">1 split needs a material</span>' : '';
    const uab = s.uab ? `<div class="uab" id="uab"><b>Update All Invoices</b>
        <span class="udf">Load Received <span class="ec">10/22/26${ic('calendar')}</span></span>
        <span class="udf">Date Unloaded <span class="ec">10/23/26${ic('calendar')}</span></span>
        <span class="rb">Apply to all 3 invoices</span></div>`
      : `<div class="uab"><b>Update All Invoices</b><span class="udf">Load Received <span class="ec ph">MM/DD/YY${ic('calendar')}</span></span><span class="udf">Date Unloaded <span class="ec ph">MM/DD/YY${ic('calendar')}</span></span><span class="rb" style="opacity:.5">Apply to all 3 invoices</span></div>`;
    const changes = s.dates ? [7, '1 added, 6 updated'] : s.split ? [4, '1 added, 3 updated'] : [3, '3 updated'];
    const issue = s.split === 'picking' ? '<span class="badge" style="background:hsl(348 81% 48%); color:#fff; margin-left:4px">1 issue</span>' : '';
    const ebar = `<div class="ebar"><span class="sum2"><b>${changes[0]} changes</b>${ic('arrow-right')}<span>${changes[1]}</span>${issue}</span>
        <span class="sw"><i class="k"></i>Hide unchanged rows</span><span class="vl">View changes</span>
        <div class="r"><span class="rb dng">Undo All</span><span class="rb pri" id="btn-apply">${ic('check')}Apply changes</span></div></div>`;
    return `<main class="main">${salesHead()}
      <div class="ibody">
        <div class="tbar"><span class="rb gh">${ic('arrow-left')}Back to invoices</span>${stepLabel(2)}<span class="cnt2">3 invoices · ${lines} lines</span><div class="r">${problems}</div></div>
        ${uab}
        <div class="gwrap"><table class="grid eg"><colgroup><col style="width:146px"><col style="width:80px"><col style="width:80px"><col style="width:92px"><col style="width:124px"><col style="width:88px"><col style="width:84px"><col style="width:88px"><col style="width:50px"><col style="width:96px"><col style="width:92px"><col style="width:82px"><col style="width:52px"></colgroup>
          <thead><tr><th>Invoice / OBT #</th><th>Load Received</th><th>Date Unloaded</th><th>Mill Ticket #</th><th>Material</th><th class="num">Consumer Gross</th><th class="num">Consumer Tare</th><th class="num">Consumer Net</th><th>UM</th><th class="num">Consumer Price</th><th>Deductions</th><th class="num">Value</th><th></th></tr></thead>
          <tbody>${body}</tbody></table></div>
        ${ebar}
      </div></main>`;
  }

  function matPop() {
    return `<div class="pop mpk" id="mpk" style="left:4px; top:38px"><div class="s">${ic('search')}<span>Search materials</span></div>
      <div class="gh">On sales order</div><div class="o">HMS 1&amp;2</div><div class="o hv">P&amp;S Plate &amp; Structural</div>
      <div class="gh">Other materials</div><div class="o">#1 Busheling</div><div class="o">Shred</div></div>`;
  }
  function dedPop() {
    return `<div class="pop dedp" id="dedp" style="right:4px; top:38px"><span class="tt2">Deductions · HMS 1&amp;2</span>
      <div class="dr"><div class="ec sel">Value${ic('chevron-down')}</div><div class="ec">Contamination</div><div class="ec r">125.00<span class="u">$</span></div><div class="ia"><span>${ic('trash-2')}</span></div></div>
      <span class="add">${ic('plus')}Add deduction</span>
      <div class="tot2"><span>Total</span><b>−$125.00</b></div></div>`;
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('scale')}ReSpark Sales · Rolling out</div>
        <h2>Consumer Weights Entry</h2>
        <p>Key the consumer weights from a mill’s freight bill for many invoices in one sitting, on one tab-through screen with only the fields that matter.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}One freight bill, one sitting</div>
      <h2>Key consumer weights for every invoice at once</h2>
      <p>Pick the invoices, tab through weights and prices, split a material, add deductions and set the dates on all of them together. Only Open and Reconciled invoices from outbound tickets can be picked, and you can save up to 200 invoices at a time. Uploading settlements from a file isn’t included.</p>
      <div class="cta"><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button></div>
    </div></div>`;
  }

  function renderApp(s) {
    const view = s.view === 'pick' ? pickView(s) : s.view === 'enter' ? enterView(s) : listView(s);
    return `<div class="app">${sidebar('sales')}${view}${s.cover ? cover(s.cover) : ''}</div>`;
  }
  function anchorMenus() {}


  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Key a mill’s consumer weights for many invoices in one sitting.'
      : '<span class="n">Done</span>Pick invoices, tab through weights, split, deduct, set dates, apply. Replay any step with the bars above.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
