<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch Agent Test Drive</title>
<meta name="description" content="Try ReSpark's Dispatch Agent: customer emails become dispatch tickets you approve, on fictional sample data.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../demo-shell/demo-shell.css?v=5">
<style>
/* Dispatch Agent test drive. A standalone recreation of Load Board > Dispatch Agent
   (frontend/client/.../load-board/DispatchAgent, inbox view) on fictional sample emails.
   No app code and no network calls. */
:root { --hl-what: 0, 201, 212; --hl-where: 22, 163, 74; --hl-when: 217, 119, 6; --hl-note: 124, 58, 237; }

/* Load Board tabs + page header */
.lb-tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--divider); overflow-x: auto; scrollbar-width: none; flex: none; }
.lb-tabs::-webkit-scrollbar { display: none; }
.lb-tab { border: 0; background: none; height: 46px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.lb-tab:hover { color: var(--text); }
.lb-tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.lb-tab .n[hidden] { display: none; }
.lb-tab .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.da-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--divider); flex: none; flex-wrap: wrap; }
.da-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.conn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: rgba(22, 163, 74, .1); color: #15803d; }
:root[data-theme="dark"] .conn { color: #4ade80; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
.da-head .sp { flex: 1; }
.ibtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; }
.ibtn:hover { background: var(--action-hover); color: var(--text); }
.ibtn[disabled] { opacity: .45; cursor: default; }
.sync { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-12); background: var(--paper); font-size: 13px; font-weight: 600; color: var(--text-2); }
.sync:hover { border-color: var(--primary); color: var(--primary); }
.sync.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync .hint { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--error); box-shadow: 0 0 0 3px rgba(220, 38, 38, .2); }

/* Inbox split view */
.views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.inbox { flex: 1; min-height: 0; display: flex; }
.list { width: 40%; min-width: 300px; max-width: 420px; border-right: 1px solid var(--divider); overflow-y: auto; display: flex; flex-direction: column; }
.list ul { list-style: none; margin: 0; padding: 0; }
.item { display: flex; flex-direction: column; align-items: stretch; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--divider); border-left: 3px solid var(--info); background: transparent; }
.item:hover { background: var(--action-hover); }
.item[aria-current="true"] { background: var(--selected); }
.item.urgent { border-left-color: var(--error); } .item.high { border-left-color: var(--warning); }
.item.done { opacity: .62; }
.item .subj { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.item .from { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .time { color: var(--text-2); font-size: 12px; flex: none; }
.item .prev { color: var(--text-2); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.item .meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.item .meta .conf { margin-left: auto; font-size: 12px; font-weight: 600; }
.mchip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.mchip.new { height: 20px; background: var(--error); color: #fff; font-size: 10.5px; letter-spacing: .02em; }
.mchip.outline { border-color: var(--primary); color: var(--primary); }
.mchip.soft { background: var(--action-hover); color: var(--text-2); }
.mchip.ok { background: #dcfce7; color: #166534; } .mchip.no { background: #fee2e2; color: #b91c1c; } .mchip.mod { background: #fef3c7; color: #92400e; } .mchip.auto { background: #f1f5f9; color: #475569; }
.mchip.exact { background: rgba(2, 132, 199, .12); color: #0369a1; } .mchip.similar { background: rgba(217, 119, 6, .14); color: #92400e; } .mchip.learned { background: rgba(22, 163, 74, .12); color: #166534; }
.mchip.ai { height: 18px; padding: 0 6px; font-size: 10px; background: rgba(124, 58, 237, .12); color: #6d28d9; }
:root[data-theme="dark"] .mchip.ok, :root[data-theme="dark"] .mchip.learned { background: rgba(74, 222, 128, .15); color: #86efac; }
:root[data-theme="dark"] .mchip.no { background: rgba(248, 113, 113, .15); color: #fca5a5; }
:root[data-theme="dark"] .mchip.mod, :root[data-theme="dark"] .mchip.similar { background: rgba(251, 191, 36, .15); color: #fcd34d; }
:root[data-theme="dark"] .mchip.exact { background: rgba(56, 189, 248, .15); color: #7dd3fc; }
:root[data-theme="dark"] .mchip.auto { background: rgba(255, 255, 255, .08); color: var(--text-2); }
:root[data-theme="dark"] .mchip.ai { background: rgba(196, 181, 253, .15); color: #c4b5fd; }
.c-hi { color: #15803d; } .c-mid { color: #b45309; } .c-lo { color: #dc2626; }
:root[data-theme="dark"] .c-hi { color: #4ade80; } :root[data-theme="dark"] .c-mid { color: #fbbf24; } :root[data-theme="dark"] .c-lo { color: #f87171; }
.aside-toggle { margin-top: auto; border: 0; border-top: 1px solid var(--divider); background: var(--section); padding: 10px 16px; text-align: left; font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.aside-toggle:hover { color: var(--text); }
.aside-list { background: var(--section); padding: 0 16px 12px; font-size: 12.5px; }
.aside-list[hidden] { display: none; }
.aside-list div { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--divider); }
.aside-list span { flex: 1; min-width: 0; }
.aside-list b { display: block; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkbtn { border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.linkbtn:hover { background: var(--action-hover); }

.detail { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.empty-pane { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--text-2); }
.empty-pane svg { width: 44px; height: 44px; color: var(--text-disabled); stroke-width: 1.5; margin-bottom: 8px; }
.empty-pane h2 { margin: 0 0 4px; font-size: 16px; color: var(--text); }
.empty-pane p { margin: 0 0 18px; max-width: 340px; }
.empty-pane .callout { max-width: 400px; text-align: left; }
.d-head { position: sticky; top: 0; z-index: 3; background: var(--default); border-bottom: 1px solid var(--divider); padding: 14px 20px; display: flex; gap: 12px; align-items: flex-start; }
.d-head .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--info); flex: none; }
.d-head .bar.urgent { background: var(--error); } .d-head .bar.high { background: var(--warning); }
.d-head h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
.d-head .by { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.d-head .back { display: none; }
.d-body { padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.panel { border: 1px solid var(--divider); border-radius: 8px; background: var(--paper); padding: 14px 16px; }
.panel-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.panel-h .sp { flex: 1; }
.tbtn { border: 1px solid var(--line-12); background: none; border-radius: 6px; height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.tbtn:hover { border-color: var(--primary); color: var(--primary); }
.email { font-size: 14px; line-height: 1.6; }
.email + .email { border-top: 1px dashed var(--divider); margin-top: 12px; padding-top: 12px; }
.email .eh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.email .av { width: 30px; height: 30px; border-radius: 50%; background: var(--section); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.email .av.me { background: var(--primary); color: var(--on-primary); }
.email .eh b { display: block; font-size: 13px; } .email .eh span { color: var(--text-2); font-size: 12px; }
.email .eh .t { margin-left: auto; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.email .body { white-space: pre-wrap; }
mark.hl { background: transparent; color: inherit; border-radius: 3px; padding: 0 1px; transition: background-color .35s, box-shadow .35s; }
mark.hl.on { box-shadow: inset 0 -2px 0 rgba(var(--c), .9); background: rgba(var(--c), .16); }
mark.hl.flash { background: rgba(var(--c), .38); }
mark.what { --c: var(--hl-what); } mark.where { --c: var(--hl-where); } mark.when { --c: var(--hl-when); } mark.note { --c: var(--hl-note); }

.recs-h { display: flex; align-items: center; gap: 8px; }
.recs-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.reading { border: 2px dashed rgba(0, 122, 135, .35); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.reading .stp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.reading .stp svg { color: var(--text-disabled); }
.reading .stp.done svg { color: var(--success); }
.shimmer { width: fit-content; background-image: linear-gradient(90deg, rgba(68, 81, 102, .55) 35%, var(--text) 50%, rgba(68, 81, 102, .55) 65%); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: wave 2.2s linear infinite; }
@keyframes wave { from { background-position: 200% center; } to { background-position: -200% center; } }

/* ActionCardItem */
.card { border: 2px solid var(--primary); border-radius: 12px; background: rgba(0, 122, 135, .03); padding: 16px; transition: opacity .4s, transform .4s; }
.card.leaving { opacity: 0; transform: translateX(24px); }
.card.enter { animation: cardIn .35s ease-out; }
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--primary); }
.card-top h4 { margin: 0; flex: 1; font-size: 14px; font-weight: 700; color: var(--primary); line-height: 1.35; }
.card .desc { color: var(--text-2); font-size: 14px; margin: 0; }
.card hr { border: 0; border-top: 1px solid var(--divider); margin: 14px 0; }
.will { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--primary); margin-bottom: 10px; }
.tgrid-h { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.f { min-width: 0; padding-left: 8px; border-left: 3px solid transparent; transition: background-color .3s; border-radius: 0 4px 4px 0; }
.f.what { border-left-color: rgb(var(--hl-what)); } .f.where { border-left-color: rgb(var(--hl-where)); } .f.when { border-left-color: rgb(var(--hl-when)); } .f.note { border-left-color: rgb(var(--hl-note)); }
.f.field-in { animation: fpop .5s ease-out; }
@keyframes fpop { from { background: rgba(0, 201, 212, .18); } to { background: transparent; } }
.f .l { font-size: 12px; color: var(--text-2); display: block; }
.f .v { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.f .v.it { font-style: italic; font-weight: 400; }
.f .v .q { font-size: 12px; color: var(--text-2); font-weight: 400; }
.f .miss { color: var(--error); display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.f .auto { color: var(--info); }
.f .sub { display: block; font-size: 12px; color: var(--text-2); }
.f.wide { grid-column: 1 / -1; }
.chg { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.chg dt { color: var(--text-2); font-size: 13px; } .chg dd { margin: 0; font-weight: 500; }
.chg .old { text-decoration: line-through; color: var(--text-2); font-weight: 400; margin-right: 6px; }
.chg .new { background: rgba(var(--hl-when), .16); box-shadow: inset 0 -2px 0 rgba(var(--hl-when), .9); padding: 0 2px; border-radius: 3px; }
.acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.acts .sp { flex: 1; }
.mb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--line-12); background: transparent; color: var(--text); white-space: nowrap; }
.mb:hover:not(:disabled) { background: var(--action-hover); }
.mb.success { background: var(--success); border-color: var(--success); color: #fff; }
.mb.success:hover:not(:disabled) { background: var(--success-strong); }
.mb.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.mb.primary:hover:not(:disabled) { background: var(--primary-dark); }
.mb.o-primary { border-color: var(--primary); color: var(--primary); }
.mb.o-error { border-color: rgba(220, 38, 38, .5); color: var(--error); }
.mb.o-error:hover:not(:disabled) { background: rgba(220, 38, 38, .06); }
.mb:disabled { opacity: .45; cursor: not-allowed; }
:root[data-theme="dark"] .mb.success { color: #0E1A2F; }
.why { font-size: 12.5px; color: var(--text-2); margin-top: 8px; display: flex; gap: 6px; align-items: flex-start; }
.why svg { color: var(--warning); margin-top: 1px; }
.factors { margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--section); }
.factors[hidden] { display: none; }
.factors h5 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.fac { margin-bottom: 8px; } .fac:last-child { margin-bottom: 0; }
.fac .r { display: flex; justify-content: space-between; font-size: 13px; }
.fac .trk { height: 4px; border-radius: 2px; background: rgba(14, 26, 47, .08); margin-top: 3px; overflow: hidden; }
.fac .trk i { display: block; height: 100%; border-radius: 2px; background: var(--success); }
.fac.neg .trk i { background: var(--error); } .fac.neu .trk i { background: var(--text-disabled); }
.ring { position: relative; width: 40px; height: 40px; flex: none; }
.ring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text); }
.done-pane { display: flex; flex-direction: column; gap: 12px; }
.done-msg { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 10px; background: rgba(22, 163, 74, .08); color: #166534; font-weight: 600; }
:root[data-theme="dark"] .done-msg { color: #86efac; }
.waiting { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--section); color: var(--text-2); font-size: 13px; }

/* Dispatch Tickets tab */
.tickets { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; }
.tickets[hidden], .inbox[hidden] { display: none; }
.tickets table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
.tickets th { text-align: left; font-weight: 600; color: var(--text-2); padding: 10px 12px; border-bottom: 1px solid var(--divider); white-space: nowrap; background: var(--section); position: sticky; top: 0; }
.tickets td { padding: 10px 12px; border-bottom: 1px solid var(--divider); white-space: nowrap; }
.tickets tr.fresh td { background: rgba(0, 201, 212, .07); }
.tickets tr.fresh td:first-child { box-shadow: inset 3px 0 0 var(--primary-light); }
.tickets .lead { color: var(--text-2); margin: 0 0 12px; font-size: 13px; }

/* Dialogs (Modify, Reject, reply) */
dialog { border: 0; padding: 0; border-radius: 12px; background: var(--paper); color: var(--text); box-shadow: 0 24px 64px rgba(0, 0, 0, .3); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); }
dialog::backdrop { background: rgba(14, 26, 47, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 32px); }
.dlg-h { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--divider); }
.dlg-h h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.dlg-b { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--divider); }
.sec-h { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); margin: 4px 0 -4px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld label { font-size: 12.5px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1px solid var(--line-12); border-radius: 6px; padding: 8px 10px; background: var(--default); font-size: 14px; }
.fld textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 122, 135, .15); }
.fld.err input { border-color: var(--error); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line-12); border-radius: 8px; background: none; font-size: 14px; }
.opt:hover { border-color: var(--primary); background: var(--action-hover); }
.opt small { display: block; color: var(--text-2); font-size: 12.5px; }
.sugg { border-radius: 8px; background: rgba(124, 58, 237, .06); border: 1px solid rgba(124, 58, 237, .2); padding: 12px 14px; font-size: 13px; color: var(--text-2); }
.sugg b { color: var(--violet); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.summ { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; padding: 12px 14px; border-radius: 8px; background: var(--section); }
.summ dt { color: var(--text-2); } .summ dd { margin: 0; font-weight: 500; }

/* Action History drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); background: var(--paper); box-shadow: -12px 0 40px rgba(0, 0, 0, .18); z-index: 70; transform: translateX(105%); transition: transform .25s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--divider); }
.drawer-h h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.drawer-b { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.hist { border: 1px solid var(--divider); border-radius: 10px; padding: 12px; font-size: 13px; }
.hist .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hist .top b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .top time { color: var(--text-2); font-size: 12px; }
.hist .lbl2 { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--text-2); margin: 8px 0 2px; }
.hist p { margin: 0; color: var(--text-2); }
.scrim { position: fixed; inset: 0; background: rgba(14, 26, 47, .35); z-index: 65; }
.scrim[hidden] { display: none; }

@media (max-width: 760px) {
  .list { width: 100%; max-width: none; min-width: 0; border-right: 0; }
  .inbox.show-detail .list { display: none; }
  .inbox:not(.show-detail) .detail { display: none; }
  .d-head .back { display: inline-flex; margin: -4px 0 0 -8px; }
  .d-head { padding: 12px 14px; } .d-body { padding: 14px 14px 24px; }
  .tgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; }
  .da-head { padding: 10px 14px; } .da-head h1 { font-size: 18px; }
  .sync .lbl { display: none; }
  .row2 { grid-template-columns: 1fr; }
}

/* The "agent reading" moment: highlight what it extracts, then build the card(s). */
async function analyze(t) {
  const gen = ++st.gen;
  renderDetail({ reading: true });
  const recs = $('recs');
  const steps = ['Classifying email', t.recs.length > 1 ? `Found ${t.recs.length} separate requests` : 'Extracting ticket details', 'Matching customer and location'];
  recs.innerHTML = `<div class="reading" role="status"><div class="stp"><span class="shimmer">Dispatch Agent is reading this email…</span></div>${steps.map((s, i) => `<div class="stp" data-s="${i}">${icon('checkCircle', 's16')}<span>${s}</span></div>`).join('')}</div>`;
  const marks = [...$('detail').querySelectorAll('mark.hl')];
  await sleep(500);
  for (let i = 0; i < steps.length; i++) {
    if (gen !== st.gen) return;
    if (i === 1) for (const m of marks) { m.classList.add('on', 'flash'); await sleep(170); m.classList.remove('flash'); if (gen !== st.gen) return; }
    else await sleep(550);
    recs.querySelector(`[data-s="${i}"]`)?.classList.add('done');
  }
  await sleep(300);
  if (gen !== st.gen) return;
  t.analyzed = true;
  recs.innerHTML = pendingRecs(t).map(r => cardHtml(r, t)).join('');
  recs.querySelectorAll('.card').forEach(c => c.classList.add('enter'));
  if (!REDUCED) for (const f of recs.querySelectorAll('.f')) { f.classList.add('field-in'); await sleep(55); }
}

function openThread(id, { fromSync } = {}) {
  st.selected = id;
  const t = T(id);
  const first = t.isNew;
  t.isNew = false;
  $('inboxView').classList.add('show-detail');
  renderList();
  S.setContext({ thread: id });
  track('thread_opened', { first_open: first });
  if (!t.analyzed) analyze(t); else renderDetail();
  $('detail').scrollTop = 0;
  if (!fromSync) $('detail').focus?.();
}

$('detail').addEventListener('mouseover', e => {

$('detail').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T(st.selected);
  const card = b.closest('.card'), r = card && t.recs.find(x => x.id === card.dataset.rec);
  if (act === 'back') { $('inboxView').classList.remove('show-detail'); st.selected = null; renderList(); return; }
  if (act === 'thread') { st.showThread[t.id] = !st.showThread[t.id]; renderDetail(); return; }
  if (act === 'reprocess') { if (!pendingRecs(t).length) { toast('All actions for this thread are already done.'); return; } track('reprocess_clicked'); analyze(t).then(() => toast('Email reprocessed successfully')); return; }

  if (act === 'approve') approve(t, r, {});
  if (act === 'confirm') replyDialog(t, r, 'confirm');

async function approve(t, r, { modified, confirmSent }) {
  const card = $('detail').querySelector(`.card[data-rec="${r.id}"]`);
  card?.querySelectorAll('button').forEach(b => b.disabled = true);
  const btn = card?.querySelector('[data-act="approve"]'); if (btn && !modified && !confirmSent) btn.innerHTML = 'Approving...';
  await sleep(450);
  card?.classList.add('leaving');
  await sleep(400);
  r.status = 'approved';
  let ticketNo = null;
  if (r.type === 'create') {
    ticketNo = 'DT-' + st.nextNo++;
    const k = r.ticket;
    st.tickets.unshift({ no: ticketNo, type: k.ticketType, customer: k.customer[0], location: Array.isArray(k.location) ? k.location[0] : k.location, container: k.container ? k.container[0].replace(' roll-off', '') : '—', date: k.scheduleDate === 'auto-today' ? 0 : k.scheduleDate, time: k.timeWindow, status: 'Unassigned', fresh: true });
  } else {
    const ex = st.tickets.find(x => x.no === r.update.ticketNo); if (ex) { ex.date = MON_AFTER; ex.fresh = true; ex.updated = true; }
    ticketNo = r.update.ticketNo;
  }
  st.history.unshift({ thread: t.id, rec: r.id, kind: modified ? 'Modified' : 'Approved', title: title(r, t), ticketNo, email: plain(t.messages.at(-1).body), at: new Date(), confirmSent });
  track('draft_approved', { kind: r.type === 'update' ? 'ticket_update' : 'ticket', rec: r.id, modified: !!modified, confirmation: !!confirmSent });
  toast(`Successfully approved recommendation: ${title(r, t)}`);
  renderList(); renderDetail();
}
function reject(t, r, reason) {
  r.status = 'rejected';
  st.history.unshift({ thread: t.id, rec: r.id, kind: 'Rejected', title: title(r, t), reason, email: plain(t.messages.at(-1).body), at: new Date() });
  track('draft_rejected', { rec: r.id, reason });
  toast('Recommendation rejected. The agent will remember this.');
  renderList(); renderDetail();
}

async function customerReplies(t) {

  const n = st.tickets.filter(x => x.fresh).length;
  $('ticketsView').innerHTML = `<p class="lead">${n ? `<b>${n} ${n === 1 ? 'ticket' : 'tickets'}</b> came from the Dispatch Agent in this session (highlighted). ` : 'Approve a recommendation in the Dispatch Agent tab and the ticket shows up here. '}Sample data.</p>
    <table><thead><tr><th scope="col">Ticket</th><th scope="col">Type</th><th scope="col">Customer</th><th scope="col">Location</th><th scope="col">Container</th><th scope="col">Scheduled</th><th scope="col">Status</th><th scope="col">Source</th></tr></thead>
    <tbody>${st.tickets.map(x => `<tr class="${x.fresh ? 'fresh' : ''}"><td><b>${x.no}</b></td><td>${esc(x.type)}</td><td>${esc(x.customer)}</td><td>${esc(x.location)}</td><td>${esc(x.container)}</td><td>${fmt(x.date)}${x.time ? ` · ${esc(x.time)}` : ''}</td>
      <td><span class="mchip ${x.status === 'Completed' ? 'soft' : x.status === 'Scheduled' ? 'exact' : 'similar'}">${x.updated ? 'Rescheduled' : x.status}</span></td><td>${x.fresh ? `<span class="mchip ai">AI</span> From email` : 'Manual'}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------------- action history drawer ---------------- */
function openDrawer() {
  const body = $('drawerBody');
  body.innerHTML = st.history.length ? st.history.map((h, i) => `<div class="hist"><div class="top"><span class="mchip ${h.kind === 'Approved' ? 'ok' : h.kind === 'Modified' ? 'mod' : 'no'}">${h.kind}</span><b title="${esc(h.title)}">${esc(h.title)}</b><time>${h.at.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</time></div>
    <div class="lbl2">SOURCE EMAIL</div><p>"${esc(h.email.replace(/\s+/g, ' ').slice(0, 110))}…"</p>
    ${h.ticketNo ? `<div class="lbl2">${h.kind === 'Rejected' ? '' : 'CREATED TICKET'}</div><p><b>${h.ticketNo}</b>${h.confirmSent ? ' · confirmation drafted' : ''}</p>` : `<div class="lbl2">REASON</div><p>${h.reason === 'already_created' ? "I've already created this ticket" : 'Not dispatch related'}</p>`}
    <div style="margin-top:8px"><button type="button" class="mb" data-undo="${i}">${icon('undo', 's16')}${h.kind === 'Rejected' ? 'Restore to Queue' : h.ticketNo === 'DT-20417' ? 'Undo Action' : 'Undo &amp; Void Ticket'}</button></div></div>`).join('')
    : '<p style="color:var(--text-2);margin:8px 0">No actions taken yet. AI recommendations will appear here once approved.</p>';
  $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').hidden = false;
  $('drawerClose').focus();
  track('history_opened', { items: st.history.length });
}
function closeDrawer() { $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').hidden = true; $('histBtn').focus(); }
$('histBtn').addEventListener('click', openDrawer);
$('drawerClose').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer(); });
$('drawerBody').addEventListener('click', e => {
  const b = e.target.closest('[data-undo]'); if (!b) return;
  const h = st.history[+b.dataset.undo], t = T(h.thread), r = t && t.recs.find(x => x.id === h.rec);
  if (!r) return;
  r.status = 'pending';
  if (h.ticketNo && r.type === 'create') st.tickets = st.tickets.filter(x => x.no !== h.ticketNo);
  if (r.type === 'update') { const ex = st.tickets.find(x => x.no === r.update.ticketNo); if (ex) { ex.date = FRI; ex.fresh = false; ex.updated = false; } }
  st.history.splice(+b.dataset.undo, 1);
  track('undo', { rec: r.id, kind: h.kind });
  toast('Action undone successfully. Recommendation restored to queue.');
  renderList(); if (st.selected === t.id) renderDetail();
  openDrawer();
});

/* ---------------- reset + boot ---------------- */
function reset() {
  if (dlg.open) dlg.close();
  if ($('drawer').classList.contains('open')) closeDrawer();
  st = freshState();
  $('syncHint').hidden = false; $('syncLbl').textContent = 'Synced 2m ago';
  $('asideList').hidden = true; $('asideToggle').setAttribute('aria-expanded', 'false');
  $('inboxView').classList.remove('show-detail');
  S.setContext({});
  showTab('agent');
  renderList(); emptyPane();
}
$('detail').tabIndex = -1;
reset();
if (S.DEBUG) window.__demo = { open: openThread, state: () => st };
})();
</script>
</body>
</html>
