<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparky Test Drive</title>
<meta name="description" content="Try Sparky, ReSpark's AI assistant for scrap yards, on a fictional sample yard.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../demo-shell/demo-shell.css?v=5">
<style>
/* Sparky test drive. A standalone recreation of the Sparky chat (frontend/client
   components/layouts/chat/*) running on a fictional sample yard. No app code,
   no network calls: answers are computed in-page from generated sample data.
   Tokens mirror themes/application.js (light) so it reads as the real product. */
:root {
  --page: #f3f5f8;
  --default: #ffffff;
  --paper: #ffffff;
  --text: #0E1A2F;
  --text-2: #445166;
  --text-3: #5F6A7E;
  --text-disabled: #98A0AE;
  --divider: rgba(14, 26, 47, 0.10);
  --primary: #007A87;
  --primary-dark: #005A66;
  --primary-light: #00C9D4;
  --on-primary: #ffffff;
  --violet: #7c3aed;
  --hover: #F5F6F8;
  --action-hover: rgba(0, 144, 160, 0.06);
  --warning: #C2410C;
  --success: #0d9488;
  --bubble: #ffffff;
  --bubble-line: rgba(0, 0, 0, 0.05);
  --line-12: rgba(0, 0, 0, 0.12);
  --th: #f5f5f5;
  --pre: rgba(0, 0, 0, 0.04);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  --window-shadow: 0 24px 48px -16px rgba(14, 26, 47, 0.18), 0 2px 6px rgba(14, 26, 47, 0.06);
  --chart-grid: #e1e0d9;
  --chart-axis: #c3c2b7;
  --chart-muted: #898781;
  --callout: #EDFDFF;
  --callout-line: rgba(0, 122, 135, 0.35);
  --font: "Inter", "Roboto", "Helvetica", "Arial", sans-serif;
  --mono: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --page: #0a1322;
  --default: #0E1A2F;
  --paper: #152036;
  --text: #EDF1F7;
  --text-2: #B5BAC4;
  --text-3: #A4ABB8;
  --text-disabled: #6D7584;
  --divider: rgba(255, 255, 255, 0.10);
  --primary: #00C9D4;
  --primary-dark: #0090A0;
  --primary-light: #AEEFF6;
  --on-primary: #0E1A2F;
  --violet: #c4b5fd;
  --hover: #1E2D48;
  --action-hover: rgba(0, 201, 212, 0.10);
  --warning: #FBBF24;
  --success: #4ade80;
  --bubble: rgba(255, 255, 255, 0.07);
  --bubble-line: rgba(255, 255, 255, 0.06);
  --line-12: rgba(255, 255, 255, 0.12);
  --th: #2a3448;
  --pre: rgba(255, 255, 255, 0.06);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  --window-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.6);
  --chart-grid: #2c3446;
  --chart-axis: #3b4458;
  --chart-muted: #8f97a6;
  --callout: rgba(0, 201, 212, 0.08);
  --callout-line: rgba(0, 201, 212, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
html.embed body { background: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s16 { width: 16px; height: 16px; }
svg.i.s18 { width: 18px; height: 18px; }

/* ---------- demo shell (shared by every agent test drive) ---------- */
.demo { height: 100dvh; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 12px; max-width: 1180px; margin: 0 auto; }
html.embed .demo { padding: 0; gap: 8px; max-width: none; }
.demo-bar { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.demo-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.demo-brand img { width: 28px; height: 28px; border-radius: 30%; flex: none; }
.demo-brand .t { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.demo-brand .t span { color: var(--text-2); font-weight: 500; }
.badge-wrap { position: relative; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px dashed var(--callout-line);
  background: var(--callout); color: var(--primary-dark); font-size: 12px; font-weight: 600; white-space: nowrap; }
:root[data-theme="dark"] .badge { color: var(--primary); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary-light); }
.pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: min(300px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: var(--window-shadow); padding: 12px 14px; font-size: 13px; color: var(--text-2); }
.pop b { color: var(--text); }
.pop[hidden] { display: none; }
.demo-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line-12); background: var(--paper); color: var(--text); text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.cta { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.cta:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--on-primary); }
.demo-note { margin: 0; text-align: center; font-size: 12px; color: var(--text-3); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50; max-width: min(440px, calc(100vw - 32px));
  background: #12233e; color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, .45); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.callout { display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--callout-line); background: var(--callout); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--text); }
.callout svg { color: var(--primary); margin-top: 1px; }
.callout .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 2px; }
:root[data-theme="dark"] .callout .lbl { color: var(--primary); }

/* ---------- Sparky window (ChatComponentBackend) ---------- */
.sparky { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--default); border: 1px solid var(--divider); border-radius: 16px; box-shadow: var(--window-shadow); overflow: hidden; }
.sp-head { display: flex; align-items: center; gap: 8px; padding: 6px 16px; min-height: 44px; border-bottom: 1px solid var(--divider); }
.sp-head h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.sp-head .yard { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.thread { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.thread::-webkit-scrollbar { width: 8px; } .thread::-webkit-scrollbar-thumb { background: rgba(14, 26, 47, .2); border-radius: 4px; }
.msgs { list-style: none; margin: 0 auto; padding: 16px 24px; max-width: 860px; }
@media (max-width: 600px) { .msgs { padding: 16px; } }

/* EmptyState.tsx */
.empty { position: absolute; inset: 0; overflow-y: auto; background: var(--default); padding: 32px 24px; }
.empty[hidden] { display: none; }
.empty-in { width: 100%; max-width: 960px; margin: 0 auto; }
.hello { margin: 0 0 4px; font-size: 2.125rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.hello span { background: linear-gradient(135deg, #00C9D4 0%, #0090A0 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
.hello-sub { margin: 0 0 24px; color: var(--text-2); font-size: 14px; }
.shelf { container-type: inline-size; }
.shelf + .shelf { margin-top: 24px; }
.shelf-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.shelf-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
.count { min-width: 21px; padding: 1px 6px; border-radius: 12px; background: var(--action-hover); color: var(--text-2); font-size: 11px; line-height: 1.6; text-align: center; }
.shelf-head .link { margin-left: auto; border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.shelf-head .link:hover { background: var(--action-hover); }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@container (min-width: 380px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (min-width: 760px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cards.ci { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px; text-align: left; border-radius: 12px; border: 1px solid var(--divider); background: var(--paper);
  font-weight: 600; line-height: 1.35; font-size: 14px; transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms; }
.card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 0, 0, .08); border-color: var(--primary); background: var(--hover); }
.card .ic { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); background: rgba(0, 122, 135, .1); }
.card.ci .ic { color: var(--violet); background: rgba(124, 58, 237, .1); }
.card.more { justify-content: center; color: var(--violet); font-weight: 700; }
@media (max-width: 600px) { .empty { padding: 24px 16px; } .hello { font-size: 1.75rem; } }

/* Messages (AssistantMessage.tsx / UserMessage.tsx) */
.msg { display: flex; margin-bottom: 12px; animation: enter 200ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.msg .avatar { width: 30px; height: 30px; border-radius: 30%; margin: 4px 12px 0 0; flex: none; }
.bubble { min-width: 0; font-size: 14px; line-height: 1.6; word-break: break-word; }
.bubble.user { max-width: 75%; padding: 10px 16px; border-radius: 18px 18px 6px 18px; background: var(--primary); color: var(--on-primary); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); white-space: pre-wrap; }
.a-wrap { flex: 1; min-width: 0; display: flex; }
.bubble.asst { max-width: 90%; padding: 12px 16px; border-radius: 18px 18px 18px 6px; background: var(--bubble); border: 1px solid var(--bubble-line); box-shadow: var(--shadow); }
.bubble.asst.wide { width: 90%; }
@media (max-width: 600px) { .bubble.asst.wide { width: 100%; max-width: 100%; } }
.bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: 0 0 10px; padding-left: 20px; } .bubble li { margin: 2px 0; }
.bubble h3 { margin: 14px 0 6px; font-size: 14px; font-weight: 700; }
.bubble .content > :first-child { margin-top: 0; }
.bubble .content > :last-child { margin-bottom: 0; }
.shimmer { width: fit-content; background-image: linear-gradient(90deg, rgba(68, 81, 102, .55) 35%, var(--text) 50%, rgba(68, 81, 102, .55) 65%); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: wave 2.2s linear infinite; }
@keyframes wave { from { background-position: 200% center; } to { background-position: -200% center; } }
.status { display: flex; align-items: center; min-height: 22px; }

/* ChainOfThought.tsx */
.cot { margin-bottom: 8px; }
.cot-btn { display: inline-flex; align-items: center; gap: 2px; padding: 2px 0; border: 0; background: none; color: var(--text-2); border-radius: 4px; font-size: 14px; }
.cot-btn:hover { color: var(--text); }
.cot-btn svg { transition: transform .15s; }
.cot-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
.cot-steps { margin: 2px 0 0 4px; padding-left: 10px; border-left: 2px solid var(--divider); }
.cot-steps[hidden] { display: none; }
.step { padding: 4px 0; font-size: 12px; }
.step .row { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 500; }
.step .row svg { color: var(--text-disabled); }
.step .det { display: block; color: var(--text-disabled); margin: 2px 0 0 22px; }

/* Tables (MarkdownText.tsx TableWithExport) */
.tbl { position: relative; margin: 14px 0; }
.tbl .exp { position: absolute; top: -10px; right: -6px; z-index: 3; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
  border: 1px solid var(--divider); background: var(--paper); color: var(--text-2); }
.tbl .exp:hover { color: var(--primary); }
.tbl .scroll { overflow: auto; max-height: 500px; }
.tbl table { border-collapse: collapse; min-width: max-content; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 2; background: var(--th); font-weight: 700; border: 1px solid var(--line-12); padding: 8px 12px; text-align: left; white-space: nowrap; }
.tbl td { border: 1px solid var(--line-12); padding: 6px 12px; text-align: left; max-width: 220px; min-width: 70px; vertical-align: top; line-height: 1.4; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.total td { font-weight: 700; }
.neg { color: #b42318; } .pos { color: #027a48; }
:root[data-theme="dark"] .neg { color: #fca5a5; } :root[data-theme="dark"] .pos { color: #86efac; }
.pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; background: var(--action-hover); color: var(--text-2); }
.pill.warn { background: rgba(194, 65, 12, .1); color: #9A3412; }
.pill.ok { background: rgba(13, 148, 136, .12); color: #0f766e; }
:root[data-theme="dark"] .pill.warn { color: #fdba74; } :root[data-theme="dark"] .pill.ok { color: #5eead4; }

/* Charts (SparkyChart.tsx) */
.chart { position: relative; margin: 12px 0; padding: 12px 12px 4px; border: 1px solid var(--divider); border-radius: 8px; width: 100%; min-width: min(420px, 75vw); }
@media (max-width: 600px) { .chart { min-width: 0; } }
.chart .ct { font-size: 13px; font-weight: 600; line-height: 1.3; }
.chart .cs { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.chart .plot { position: relative; margin-top: 8px; }
.chart svg { display: block; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; padding: 6px 0 4px; font-size: 12px; color: var(--chart-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--paper); border: 1px solid var(--divider); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  padding: 8px 12px; font-size: 12px; max-width: 240px; white-space: nowrap; }
.tip b { display: block; font-weight: 600; margin-bottom: 2px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.tip div strong { color: var(--text); font-weight: 600; }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.skel { margin: 12px 0; padding: 12px; border: 1px solid var(--divider); border-radius: 8px; }
.skel .bar { height: 180px; border-radius: 8px; background: linear-gradient(90deg, var(--hover) 25%, var(--action-hover) 50%, var(--hover) 75%); background-size: 200% 100%; animation: wave 1.6s linear infinite; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.anim .hb { transform-box: fill-box; transform-origin: left center; animation: grow .6s cubic-bezier(.2, .7, .2, 1) both; }
.anim .vb { transform-box: fill-box; transform-origin: center bottom; animation: growY .6s cubic-bezier(.2, .7, .2, 1) both; }
.anim .ln { stroke-dasharray: 1; animation: draw 1s ease-out both; }
.anim .fd { animation: fade .6s ease-out both; }

/* Drafts (demo: outreach drafts with a human decision) */
.draft { margin: 12px 0; border: 1px solid var(--divider); border-radius: 12px; background: var(--paper); overflow: hidden; }
.draft-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--divider); }
.draft-head .who { font-size: 13px; font-weight: 600; }
.draft-head .who span { color: var(--text-2); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; background: var(--action-hover); color: var(--primary-dark); }
:root[data-theme="dark"] .chip { color: var(--primary); }
.chip.ok { background: rgba(13, 148, 136, .14); color: #0f766e; } .chip.no { background: rgba(14, 26, 47, .07); color: var(--text-2); }
.chip.warn { background: var(--warning); color: #fff; }
:root[data-theme="dark"] .chip.warn { color: #0E1A2F; }
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--divider); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.draft-body { padding: 12px 14px; }
.draft-body .subj { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.draft-body .subj b { color: var(--text); }
.draft-body .txt { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
.draft-body label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 4px; }
.draft-body input, .draft-body textarea { width: 100%; border: 1px solid var(--line-12); border-radius: 8px; padding: 8px 10px; background: var(--default); font-size: 13.5px; line-height: 1.55; }
.draft-body input { margin-bottom: 10px; }
.draft-body textarea { min-height: 180px; resize: vertical; }
.draft-body input:focus, .draft-body textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 122, 135, .15); }
.draft-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; }
.draft .callout { margin: 0 14px 12px; }
.mbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--line-12); background: transparent; color: var(--text); }
.mbtn:hover { background: var(--action-hover); }
.mbtn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.mbtn.primary:hover { background: var(--primary-dark); }
.mbtn.text { border-color: transparent; color: var(--text-2); }
.mbtn:disabled { opacity: .45; cursor: default; }

/* WriteApprovalCard.tsx */
.approval-slot { padding: 8px 24px 0; max-width: 908px; width: 100%; margin: 0 auto; }
.approval-slot:empty { display: none; }
.approval-inline { display: block; }
.approval-inline .approval { margin-left: 42px; }
@media (max-width: 600px) { .approval-inline .approval { margin-left: 0; padding: 14px; } .approval .acts { flex-wrap: wrap; } }
.approval { border: 1px solid var(--warning); border-radius: 12px; background: var(--paper); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.approval .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 500; }
.approval .rows { display: flex; flex-direction: column; gap: 6px; max-height: 45vh; overflow-y: auto; }
.approval .kv { display: flex; gap: 12px; font-size: 13px; } .approval .kv span:first-child { width: 110px; flex: none; color: var(--text-2); }
.approval table { border-collapse: collapse; font-size: 13px; width: 100%; }
.approval th, .approval td { padding: 4px 8px; text-align: left; } .approval th { font-weight: 600; }
.approval .n { text-align: right; font-variant-numeric: tabular-nums; }
.approval .acts { display: flex; align-items: center; gap: 8px; }
.approval .acts .sp { flex: 1; }
.approval pre { margin: 0; padding: 12px; border-radius: 8px; background: var(--action-hover); font-family: var(--mono); font-size: 12px; overflow-x: auto; max-height: 240px; }
.approval pre[hidden] { display: none; }

function drawLine(plot, spec, w, colors, anim) {
  const h = 260, padL = 52, padR = 12, padB = 26, top = 10;
  const svg = el('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, role: 'img', 'aria-label': spec.title }, plot);
  if (anim) svg.classList.add('anim');
  const n = spec.data.length;
  const { max, step } = niceMax(Math.max(...spec.data.flatMap(d => spec.series.map(s => d[s.key] || 0))));
  const sx = i => padL + (w - padL - padR) * (n === 1 ? .5 : i / (n - 1));
  const sy = v => h - padB - (h - padB - top) * v / max;
  for (let v = 0; v <= max + 1e-9; v += step) {
    el('line', { x1: padL, x2: w - padR, y1: sy(v), y2: sy(v), stroke: 'var(--chart-grid)' }, svg);
    axisText(svg, padL - 6, sy(v), fmtVal(v, spec.format));
  }
  const every = Math.ceil(n / Math.max(2, Math.floor((w - padL) / 64)));
  spec.data.forEach((d, i) => { if ((n - 1 - i) % every === 0) axisText(svg, sx(i), h - padB + 13, d.label, 'middle'); });
  el('line', { x1: padL, x2: w - padR, y1: h - padB, y2: h - padB, stroke: 'var(--chart-axis)' }, svg);
  spec.series.forEach((s, j) => {
    const dpath = spec.data.map((d, i) => `${i ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(d[s.key] || 0).toFixed(1)}`).join('');
    const p = el('path', { d: dpath, fill: 'none', stroke: colors[j], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1, class: 'ln' }, svg);
    p.style.animationDelay = j * 120 + 'ms';
    const last = spec.data[n - 1][s.key] || 0;
    el('circle', { cx: sx(n - 1), cy: sy(last), r: 3, fill: colors[j], class: 'fd' }, svg);
  });
  const guide = el('line', { x1: 0, x2: 0, y1: top, y2: h - padB, stroke: 'var(--chart-axis)', 'stroke-dasharray': '3 3', visibility: 'hidden' }, svg);
  const dots = spec.series.map((s, j) => el('circle', { r: 4, fill: colors[j], stroke: 'var(--paper)', 'stroke-width': 2, visibility: 'hidden' }, svg));
  const hit = el('rect', { x: padL, y: top, width: w - padL - padR, height: h - top - padB, fill: 'transparent' }, svg);
  const ix = interactive(svg, plot, w, n, i => ({ x: sx(i), y: Math.min(...spec.series.map(s => sy(spec.data[i][s.key] || 0))) }),
    i => `<b>${esc(spec.data[i].tip || spec.data[i].label)}</b>` + spec.series.map((s, j) => tipRow(colors[j], s.label, fmtVal(spec.data[i][s.key], spec.format, true))).join(''));
  svg.addEventListener('hl', e => {
    const i = e.detail, vis = i < 0 ? 'hidden' : 'visible';
    guide.setAttribute('visibility', vis); dots.forEach(d => d.setAttribute('visibility', vis));
    if (i < 0) return;
    guide.setAttribute('x1', sx(i)); guide.setAttribute('x2', sx(i));
    dots.forEach((d, j) => { d.setAttribute('cx', sx(i)); d.setAttribute('cy', sy(spec.data[i][spec.series[j].key] || 0)); });
  });
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); ix.showAt(Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left - padL) / ((w - padL - padR) / Math.max(1, n - 1)))))); });
  hit.addEventListener('pointerleave', ix.hide);
}
function drawDonut(plot, spec, w, colors, anim) {
  const size = Math.min(220, w - 16), h = size + 8, cx = w / 2, cy = h / 2, R0 = size / 2, R1 = R0 * .6;
  const svg = el('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, role: 'img', 'aria-label': spec.title }, plot);
  if (anim) svg.classList.add('anim');
  const total = sum(spec.data, d => d.v);
  let a0 = -Math.PI / 2;
  const arcs = spec.data.map((d, i) => {
    const a1 = a0 + 2 * Math.PI * d.v / total, large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
    const path = el('path', { d: `M${p(R0, a0)}A${R0},${R0} 0 ${large} 1 ${p(R0, a1)}L${p(R1, a1)}A${R1},${R1} 0 ${large} 0 ${p(R1, a0)}Z`, fill: colors[i % colors.length], stroke: 'var(--paper)', 'stroke-width': 2, class: 'fd' }, svg);
    path.style.animationDelay = i * 70 + 'ms';
    const mid = (a0 + a1) / 2; a0 = a1;
    path.addEventListener('pointermove', () => ix.showAt(i));
    return { path, mid };
  });
  const c = el('text', { x: cx, y: cy - 7, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: 'var(--text)' }, svg); c.textContent = spec.centerValue || '';
  const c2 = el('text', { x: cx, y: cy + 13, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--chart-muted)' }, svg); c2.textContent = spec.centerLabel || '';
  const ix = interactive(svg, plot, w, spec.data.length, i => ({ x: cx + R0 * .8 * Math.cos(arcs[i].mid), y: cy + R0 * .8 * Math.sin(arcs[i].mid) }),
    i => `<b>${esc(spec.data[i].label)}</b>` + tipRow(colors[i % colors.length], spec.valueLabel || 'Value', fmtVal(spec.data[i].v, spec.format, true) + ` (${pct(spec.data[i].v / total)})`));
  svg.addEventListener('hl', e => arcs.forEach((a, i) => a.path.style.opacity = e.detail < 0 || e.detail === i ? 1 : .45));
  svg.addEventListener('pointerleave', ix.hide);
}

    blocks: [P_("That one's outside this test drive. I'm running on a sample yard with a set of prepared questions. In ReSpark I answer questions like that from your own yard's data. Here are a few you can try right now:")],
    suggestions: sugs,
  };
}

/* ---------------- intent matching ---------------- */
const ALIASES = ACCOUNTS.flatMap(a => {
  const out = [a.name.toLowerCase(), a.short.toLowerCase()];
  if (a.role === 'retail') out.push(a.name.split(' ')[1].toLowerCase());
  return out.filter(s => s.length >= 4).map(s => [s.replace(/[^a-z0-9 ]/g, ''), a.id]);
}).sort((x, y) => y[0].length - x[0].length);
function findAccounts(text) {
  const t = ' ' + text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const found = [];
  for (const [alias, id] of ALIASES) if (t.includes(' ' + alias + ' ') && !found.includes(id)) found.push(id);
  return found;
}
function route(text) {
  const t = text.toLowerCase();
  const ids = findAccounts(text);
  const has = re => re.test(t);
  if (state.pending && ids.length) { const k = state.pending; state.pending = null; return k === 'tickets' ? ansCustomerTickets(ids[0]) : ansLastVisit(ids[0]); }
  state.pending = null;
  const tone = has(/shorter|short\b/) ? 'short' : has(/casual|friendlier|informal/) ? 'casual' : null;
  if (has(/draft|outreach|e-?mail|reach out|write (to|a)|text message|follow.?up note/)) {
    if (has(/\ball\b/)) return ansDrafts(reactivateList().map(r => r.a.id));
    if (ids.length) return ansDrafts(ids, tone);
  }
  if (tone && ids.length) return ansDrafts(ids, tone);
  if (has(/purchase order|\bpo\b|create .*order/)) return ansCreatePo(ids.find(id => ACC[id].role === 'supplier') || 'tallgrass');
  if (has(/contract|open (pos?|orders?)|sales order|commitment/)) return ansContracts();
  if (ids.length) {
    if (has(/ticket/)) return ansCustomerTickets(ids[0]);
    if (has(/last (time|visit)|when (did|was)|last here|last came/)) return ansLastVisit(ids[0]);
    return ansAccount(ids[0]);
  }
  if (has(/no.?show|largest supplier|biggest supplier|top supplier.*(stop|miss|gone|quiet)/)) return ansNoshow();
  if (has(/reactivat|win.?back|stopped (coming|visiting|showing)|lapsed|dormant|inactive|gone quiet|lost (customers|suppliers|accounts)/)) return ansReactivate();
  if (has(/wallet|cross.?sell|material mix of|narrow|bring more/)) return ansWallet();
  if (has(/unhealthy|health|declin|churn|at risk|fading/)) return ansUnhealthy();
  if (has(/concentrat|hhi|depend|reliant|bench/)) return has(/buyer|sell|sales|outbound|consumer|mill|customer/) && !has(/supplier/) ? ansBuyers() : ansConcentration();
  if (has(/buyer|who (do|does) .*sell|outbound|sell side/)) return ansBuyers();
  if (has(/retail|reclassif|walk.?in|acting like commercial/)) return ansRetail();
  if (has(/grow|trending up|increas|upward|expanding/)) return ansGrowing();
  if (has(/in (the )?yard|truck in yard|on site|right now|currently/)) return ansYardNow();
  if (has(/incomplete|unfinished|stuck/)) return ansIncomplete();
  if (has(/paid/)) return ansPaidLastWeek();
  if (has(/find .*ticket|tickets for|customer tickets|look ?up .*customer/)) return ansAskCustomer('tickets');
  if (has(/last (time|visit)|when .*(came|visit|here)/)) return ansAskCustomer('visit');
  if (has(/margin|spread|profit/)) return ansMargin();
  if (has(/price|pricing|paying|price list|rate/)) return ansPrices(['copper', 'brass', 'aluminum', 'ferrous', 'steel'].map(f => t.includes(f) ? (f === 'steel' ? 'Ferrous' : f[0].toUpperCase() + f.slice(1)) : null).find(Boolean));
  if (has(/top (\d+ )?(suppliers|accounts|customers)|biggest (suppliers|accounts)|largest (accounts|customers)|best (suppliers|customers)|rank/)) return ansTopSuppliers();
  if (has(/mix|breakdown|by (material|commodity)|commodit/)) return ansMix();
  if (has(/volume|tonnage|how much .*(buy|bought|purchas)|trend|purchases/)) return ansVolume();
  if (has(/how('s| is) (the )?yard|summary|snapshot|this week|overview|today/)) return ansSnapshot();
  if (has(/what can you|help|who are you|what do you do|hello|^hi\b|^hey\b/)) return ansHelp();
  return ansFallback();
}

/* ======================================================================
   Chat runtime: streaming, chain of thought, suggestions, composer
   ====================================================================== */
const state = { streaming: false, skip: false, pending: null, lastSuggestions: [], started: false, gen: 0 };
let currentPromptId = null;
const sleep = ms => state.skip || REDUCED ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const thread = $('thread'), msgs = $('msgs');
const scrollDown = () => { thread.scrollTop = thread.scrollHeight; };
const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 140;

// Prepared questions offered behind "More questions"; ones not asked yet come first.
const MORE = ['How is the yard doing this week?', 'Show me no-shows among my largest suppliers', 'Show me my growing accounts', 'What is our supplier concentration risk?',
  'How concentrated are my buyers?', 'Show me wallet share opportunities', 'Show me unhealthy relationships', 'Who are my top suppliers?', 'What are my margins by material?',
  'What is my material mix?', 'Show me my open contracts', 'What are my current copper prices?', 'What tickets are in the yard now?', 'I need help creating a new purchase order'];
const asked = new Set();
function setSuggestions(list, withMore = true) {
  state.lastSuggestions = list;
  $('sugs').innerHTML = list.map(s => `<button type="button" class="sug" title="${esc(s)}">${esc(s)}</button>`).join('') +
    (withMore && list.length ? '<button type="button" class="sug more" data-more="1">More questions</button>' : '');
}
$('sugs').addEventListener('click', e => {
  const b = e.target.closest('.sug'); if (!b || state.streaming) return;
  if (b.dataset.more) {
    const fresh = MORE.filter(q => !asked.has(q) && !state.lastSuggestions.includes(q));
    setSuggestions((fresh.length ? fresh : MORE).slice(0, 6));
    track('more_questions_clicked', { prompt_id: currentPromptId });
    $('sugs').querySelector('.sug')?.focus();
    return;
  }
  send(b.textContent, 'suggestion');
});

function addUser(text) {
  const li = document.createElement('li'); li.className = 'msg user';
  li.innerHTML = `<div class="bubble user"><span class="sr-only">You said: </span>${esc(text)}</div>`;
  msgs.appendChild(li); scrollDown();
}
function addAssistant() {
  const li = document.createElement('li'); li.className = 'msg asst';
  li.innerHTML = `<img class="avatar" src="${AVATAR}" alt="Sparky"><div class="a-wrap"><div class="bubble asst"><div class="cot" hidden></div><div class="status"><span class="shimmer">Thinking</span></div><div class="content"></div></div></div>`;
  msgs.appendChild(li); scrollDown();
  return li.querySelector('.bubble');
}
function renderCot(cot, steps, running, activeLabel) {
  if (!steps.length) { cot.hidden = true; return; }
  cot.hidden = false;
  const expanded = cot.querySelector('.cot-btn')?.getAttribute('aria-expanded') === 'true';
  const header = running ? `<span class="shimmer">${esc(activeLabel)}</span>` : `<span>Reasoning · ${steps.length} ${steps.length === 1 ? 'step' : 'steps'}</span>`;
  cot.innerHTML = `<button type="button" class="cot-btn" aria-expanded="${expanded}">${header}${icon('chevR', 's16')}</button>
    <div class="cot-steps" ${expanded ? '' : 'hidden'}>${steps.map(s => `<div class="step"><div class="row">${s.state === 'done' ? icon('checkCircle', 's16') : '<svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" stroke-dasharray="20 12"/></svg>'}${esc(s.state === 'done' ? s.done : s.run)}</div>${s.state === 'done' && s.detail ? `<span class="det">${esc(s.detail)}</span>` : ''}</div>`).join('')}</div>`;
  cot.querySelector('.cot-btn').addEventListener('click', e => {
    const b = e.currentTarget, open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', open); cot.querySelector('.cot-steps').hidden = !open;
  });
}
async function streamText(el, html, src) {
  if (state.skip || REDUCED) { el.innerHTML = html; return; }
  const words = src.split(/(\s+)/);
  for (let i = 0; i < words.length; i += 6) {
    if (state.skip) break;
    el.innerHTML = md(words.slice(0, i + 6).join(''));
    if (nearBottom()) scrollDown();
    await sleep(28);
  }
  el.innerHTML = html;
}
async function renderBlock(content, b, bubble) {
  if (b.t === 'p' || b.t === 'filters') {
    const p = document.createElement('p'); content.appendChild(p);
    const src = b.t === 'filters' ? `**Filters applied:** ${b.text}` : b.text;
    await streamText(p, md(src), src);
  } else if (b.t === 'h') {
    const h = document.createElement('h3'); h.textContent = b.text; content.appendChild(h);
  } else if (b.t === 'ul') {
    const ul = document.createElement('ul'); content.appendChild(ul);
    for (const it of b.items) { const li = document.createElement('li'); ul.appendChild(li); await streamText(li, md(it), it); }
  } else if (b.t === 'table') {
    bubble.classList.add('wide'); content.appendChild(tableBlock(b)); await sleep(160);
  } else if (b.t === 'chart') {
    bubble.classList.add('wide');
    const sk = document.createElement('div'); sk.className = 'skel'; sk.innerHTML = '<div class="cs">Building chart…</div><div class="bar" style="margin-top:8px"></div>';
    content.appendChild(sk); if (nearBottom()) scrollDown();
    await sleep(650);
    sk.replaceWith(chartBlock(b.spec)); await sleep(250);
  } else if (b.t === 'draft') {
    bubble.classList.add('wide'); content.appendChild(draftBlock(b.draft)); await sleep(200);
  } else if (b.t === 'callout') {
    const c = document.createElement('div'); c.className = 'callout'; c.style.marginBottom = '10px';
    c.innerHTML = `${icon('info', 's18')}<div><span class="lbl">Test drive</span>${md(b.text)}</div>`; content.appendChild(c);
  }
  if (nearBottom()) scrollDown();
}
async function play(ans) {
  const gen = ++state.gen;
  const bubble = addAssistant();
  const cot = bubble.querySelector('.cot'), status = bubble.querySelector('.status'), content = bubble.querySelector('.content');
  await sleep(450 + Math.random() * 300);
  const steps = ans.steps.map(s => ({ ...s, state: 'run' }));
  if (steps.length) status.remove();
  for (let i = 0; i < steps.length; i++) {
    renderCot(cot, steps.slice(0, i + 1), true, steps[i].run); scrollDown();
    await sleep(750 + Math.random() * 450);
    steps[i].state = 'done';
  }
  renderCot(cot, steps, false);
  if (status.isConnected) status.remove();
  for (const b of ans.blocks) { if (gen !== state.gen) return; await renderBlock(content, b, bubble); }
  if (gen !== state.gen) return;
  if (ans.approval) {
    // Desktop: above the composer like the app. Phones: inline in the thread so the conversation keeps its height.
    $('approvalSlot').innerHTML = '';
    const card = approvalCard(ans.approval);
    if (matchMedia('(max-width: 600px)').matches) { const li = document.createElement('li'); li.className = 'msg approval-inline'; li.appendChild(card); msgs.appendChild(li); scrollDown(); }
    else $('approvalSlot').appendChild(card);
  }
  setSuggestions(ans.suggestions || []);
  track(ans.id === 'fallback' ? 'fallback_shown' : 'answer_shown', { prompt_id: ans.id });
}

async function respond(ans, { echo, id, source }) {
  if (state.streaming) return;
  hideEmpty();
  if (echo) addUser(echo);
  currentPromptId = ans.id; S.setContext({ prompt_id: ans.id });
  if (source) track('prompt_sent', { prompt_id: ans.id, source });
  setStreaming(true);
  await play(ans);
  setStreaming(false);
}
function send(text, source = 'typed') {
  text = text.trim(); if (!text || state.streaming) return;
  $('approvalSlot').innerHTML = ''; msgs.querySelectorAll('.approval-inline').forEach(n => n.remove());
  asked.add(text);
  const ans = route(text);
  respond(ans, { echo: text, source });
}
function hideEmpty() { $('empty').hidden = true; }
function setStreaming(on) {
  state.streaming = on; state.skip = false;
  thread.setAttribute('aria-busy', on);
  $('sugs').classList.toggle('busy', on);
  if (on) $('sugs').innerHTML = '';
  const b = $('sendBtn');
  b.classList.toggle('stop', on);
  b.innerHTML = on ? STOP_SVG : SEND_SVG;
  b.setAttribute('aria-label', on ? 'Skip to the full answer' : 'Send message');
  b.title = on ? 'Skip to the full answer' : '';
  $('lockMsg').textContent = on ? 'Sparky is answering…' : 'Pick a question above. In ReSpark, you can ask Sparky anything.';
  updateSend();
}
function updateSend() { $('sendBtn').disabled = !state.streaming; }

/* ---------------- empty state (EmptyState.tsx) ---------------- */
const QUICK = [
  ['receipt', "This week's incomplete tickets", "Can you show me this week's incomplete tickets?"],
  ['truck', 'Tickets in the yard now', 'What tickets are currently in truck in yard status?'],
  ['search', 'Find customer tickets', 'Can you help me find tickets for a specific customer?'],
  ['history', 'Last customer visit', 'Can you help me find the last time a customer was here?'],
  ['dollar', 'Paid tickets last week', 'Show me all paid tickets from last week'],
  ['cart', 'Create purchase order', 'I need help creating a new purchase order'],
];
const COMMERCIAL = [
  ['trendDown', 'Accounts to reactivate', 'Show me accounts I need to reactivate - commercial suppliers who have stopped visiting'],
  ['briefcase', 'No-show largest suppliers', 'Show me no-shows among my largest suppliers - high-value accounts that need follow-up'],
  ['trendUp', 'Growing accounts', 'Show me my growing accounts - which commercial suppliers are trending upward in tonnage?'],
  ['pie', 'Wallet share opportunities', 'Show me wallet share opportunities - which suppliers have a narrow material mix and could bring more?'],
  ['heart', 'Unhealthy relationships', 'Show me unhealthy relationships - which commercial accounts have declining health scores?'],
  ['bank', 'Concentration risk', "What's our supplier concentration risk? Show me the HHI analysis and bench strength"],
  ['swap', 'Retail to commercial', 'Find retail customers who are acting like commercial accounts - who should we reclassify?'],
];
let showAllCI = false;
function renderEmpty() {
  $('qaCount').textContent = QUICK.length; $('ciCount').textContent = COMMERCIAL.length;
  $('qaCards').innerHTML = QUICK.map(([ic, label, q]) => `<button type="button" class="card" data-q="${esc(q)}"><span class="ic">${icon(ic)}</span><span>${esc(label)}</span></button>`).join('');
  const vis = showAllCI ? COMMERCIAL : COMMERCIAL.slice(0, 3);
  $('ciCards').innerHTML = vis.map(([ic, label, q]) => `<button type="button" class="card ci" data-q="${esc(q)}"><span class="ic">${icon(ic)}</span><span>${esc(label)}</span></button>`).join('') +
    (showAllCI ? '' : `<button type="button" class="card ci more" data-more="1">+ ${COMMERCIAL.length - vis.length} more</button>`);
  $('ciToggle').textContent = showAllCI ? 'Show less' : 'View all';
  $('ciToggle').setAttribute('aria-expanded', showAllCI);
}
$('empty').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (c.dataset.more) { showAllCI = true; renderEmpty(); $('ciCards').children[3]?.focus(); return; }
  send(c.dataset.q, c.classList.contains('ci') ? 'commercial_chip' : 'quick_action_chip');
});
$('ciToggle').addEventListener('click', () => { showAllCI = !showAllCI; renderEmpty(); });

/* ---------------- composer: locked in the test drive, visitors pick questions ---------------- */
$('sendBtn').addEventListener('click', () => { if (state.streaming) state.skip = true; });

/* ---------------- reset (the shell's Reset demo button calls this) ---------------- */
function resetChat() {
  state.gen++; state.skip = true; state.pending = null;
  msgs.innerHTML = ''; $('approvalSlot').innerHTML = ''; setSuggestions([]);
  setStreaming(false); asked.clear();
  showAllCI = false; renderEmpty(); $('empty').hidden = false; $('empty').scrollTop = 0;
  currentPromptId = null; S.setContext({});
}

renderEmpty();
updateSend();
if (DEBUG) window.__demo = { ask: t => send(t, 'debug') };
if (params.get('q')) { const q = params.get('q').slice(0, 200); setTimeout(() => send(q, 'deep_link'), 300); }
})();
</script>
