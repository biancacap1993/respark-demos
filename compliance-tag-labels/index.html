<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of ReSpark (Inventory Settings, Material Properties and
   Finished Goods screens) for finished goods compliance language; a pulsing hotspot + tooltip guides each step; step controls sit
   under the frame. The app mock keeps ReSpark's light theme (it stands in
   for a screenshot); the page around it follows the viewer's theme. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nrow.active .pill { color: #fff; background: rgba(255, 255, 255, 0.18); }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.rb { font: inherit; font-size: 13px; font-weight: 600; height: 34px; padding-inline: 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.dis { color: var(--a-text-3); border-color: var(--a-border-subtle); }
.rb.err { color: var(--a-error-strong); border-color: hsla(348, 81%, 48%, 0.5); }
.rb svg.lucide { width: 16px; height: 16px; }
.link { color: var(--a-primary-hover); font-weight: 500; }

/* page header (ContentLayout, breadcrumb + title rows) */
.phd { display: flex; flex-direction: column; gap: 10px; padding: 20px 24px 14px; border-bottom: 1px solid var(--a-border-subtle); flex-shrink: 0; }
.crow { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--a-text-2); height: 38px; }
.crow > svg.lucide { width: 20px; height: 20px; color: var(--a-fg); }
.crow .sep { color: var(--a-text-3); }
.crow .leaf { color: var(--a-fg); }
.spill { margin-left: 16px; display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--a-hover); }
.spill span { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--a-text-2); }
.trow { display: flex; align-items: center; gap: 8px; }
.trow h1 { font-size: 22px; font-weight: 500; margin: 0; flex: 1; letter-spacing: -0.01em; }
.ntabs { display: flex; border-bottom: 1px solid var(--a-border-subtle); flex-shrink: 0; }
.ntabs span { flex: 1; text-align: center; padding: 18px 12px 16px; font-size: 13.5px; font-weight: 600; color: var(--a-text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ntabs span.on { color: var(--a-primary-hover); border-bottom-color: var(--a-primary); }

/* tables (ResparkGrid look) */
table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--a-text-2); padding: 0 12px; height: 38px; background: var(--a-muted-solid); border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td { padding: 0 12px; height: 46px; border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
td.more { text-align: center; color: var(--a-text-3); padding: 0; }
.cbx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid hsla(217, 55%, 16%, 0.35); display: inline-grid; place-items: center; vertical-align: middle; color: #fff; }
.cbx.on { background: var(--a-primary); border-color: var(--a-primary); }
.cbx svg.lucide { width: 12px !important; height: 12px !important; stroke-width: 3 !important; }
.badge { display: inline-flex; align-items: center; height: 22px; padding-inline: 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.b-success { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.mchip { display: inline-flex; align-items: center; height: 22px; padding-inline: 8px; border-radius: 999px; background: hsla(217, 55%, 16%, 0.08); font-size: 12px; white-space: nowrap; }

/* settings shell: app bar + settings menu */
.sapp { flex-direction: column; }
.abar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--a-border-subtle); background: var(--a-surface); }
.abar .x { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--a-text-2); }
.abar .x svg.lucide { width: 20px; height: 20px; }
.abar .ttl { font-size: 15px; }
.abar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.scope { display: inline-flex; align-items: center; border: 1px solid var(--a-border-subtle); border-radius: 6px; background: var(--a-surface); margin-right: 14px; }
.scope span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid transparent; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--a-text-2); }
.scope span.on { border-color: var(--a-primary); background: var(--a-primary-subtle); color: var(--a-primary-hover); }
.scope span svg.lucide:last-child:not(:first-child) { width: 14px; height: 14px; }
.abar .ib2 { width: 38px; height: 38px; display: grid; place-items: center; color: var(--a-text-2); }
.abar .ib2 svg.lucide { width: 20px; height: 20px; }
.uchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; border: 1px solid var(--a-border); border-radius: 999px; font-size: 13px; margin-left: 6px; }
.srow { flex: 1; min-height: 0; display: flex; }
.smenu { width: 272px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); padding: 28px 16px 0 22px; display: flex; flex-direction: column; }
.smenu .gh { font-size: 12px; letter-spacing: 1px; padding-bottom: 6px; }
.smenu .gi { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 8px; font-size: 14.5px; color: var(--a-text-2); }
.smenu .gi.on { background: var(--a-primary-subtle); color: var(--a-fg); font-weight: 600; }
.smenu .gi svg.lucide { width: 18px; height: 18px; color: var(--a-text-3); }
.smenu .gap { height: 16px; flex-shrink: 0; }
.smain { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.shd { display: flex; align-items: center; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--a-border-subtle); flex-shrink: 0; }
.shd h1 { font-size: 22px; font-weight: 500; margin: 0; flex: 1; letter-spacing: -0.01em; }
.scont { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 28px; padding: 0 24px 20px; }
.ssec { flex-shrink: 0; }
.ssec h3 { margin: 0; font-size: 16px; font-weight: 600; }
.ssec p { margin: 2px 0 0; font-size: 13.5px; color: var(--a-text-2); }
.addb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--a-primary-hover); font-weight: 600; font-size: 13px; margin-top: 8px; }
.sgrid { margin-top: 8px; border: 1px solid var(--a-border-subtle); border-radius: 8px; overflow: hidden; }
.sgrid td { height: 48px; }
.sgrid td.ed { padding: 0 6px; }
.cin { border: 1.5px solid var(--a-primary); border-radius: 6px; height: 34px; display: flex; align-items: center; padding: 0 9px; background: var(--a-surface); box-shadow: 0 0 0 3px hsla(183, 100%, 33%, 0.14); overflow: hidden; white-space: nowrap; }
.cin i.caret { display: inline-block; width: 1.5px; height: 16px; background: var(--a-fg); margin-left: 1px; flex-shrink: 0; }
tr.dirty td.ed { background: hsla(183, 100%, 33%, 0.06); }
.ms { border: 1px solid var(--a-border); border-radius: 6px; height: 32px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--a-surface); }
.ms .ph { color: var(--a-text-3); }
.ms svg.lucide { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.ms.yardscol { width: 100%; }

/* material overview */
.mcols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 22px 24px; }
.mcol { display: flex; flex-direction: column; gap: 16px; }
.sfl h4 { font-size: 17px; font-weight: 500; color: var(--a-text-2); margin: 0 0 8px; }
.sfl .box { background: hsla(217, 55%, 16%, 0.035); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.sf small { display: block; font-size: 11.5px; color: var(--a-text-3); margin-bottom: 2px; }
.sf div { font-size: 14px; min-height: 19px; }
.sf.full { grid-column: 1 / -1; }

/* material wizard (FormModal drawer + WizardStepper) */
.scrim { position: absolute; inset: 0; background: rgba(10, 16, 28, 0.5); z-index: 5; animation: fade .2s ease; }
.scrim.still { animation: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.wiz { position: absolute; top: 0; right: 0; bottom: 0; width: 1400px; background: var(--a-surface); box-shadow: -12px 0 32px rgba(15, 23, 42, 0.18); display: flex; flex-direction: column; z-index: 6; animation: slide .25s ease; }
.wiz.still { animation: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.wh { display: flex; align-items: center; padding: 22px 24px 22px 32px; border-bottom: 1px solid var(--a-border-subtle); }
.wh h2 { margin: 0; font-size: 24px; font-weight: 400; flex: 1; }
.wh .x { width: 40px; height: 40px; display: grid; place-items: center; color: var(--a-text-2); }
.wh .x svg.lucide { width: 22px; height: 22px; }
.wb { flex: 1; min-height: 0; display: flex; }
.wsteps { width: 25%; flex-shrink: 0; padding: 32px 0 0 32px; border-right: 1px solid var(--a-border-subtle); }
.vstep { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--a-text-2); height: 26px; }
.vstep i.n { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: hsla(217, 55%, 16%, 0.38); color: #fff; display: grid; place-items: center; font-size: 12px; }
.vstep.on { color: var(--a-fg); font-weight: 600; }
.vstep.on i.n { background: var(--a-primary); }
.vline { margin-left: 11.5px; border-left: 1px solid hsla(217, 55%, 16%, 0.22); height: 24px; }

<script>
(() => {
  const W = 1440, H = 820;
  const MARK = '<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M152.38 13.33C171.29 13.33 186.67 28.71 186.67 47.62V152.38C186.67 171.29 171.29 186.67 152.38 186.67H47.62C28.71 186.67 13.33 171.29 13.33 152.38V47.62C13.33 28.71 28.71 13.33 47.62 13.33H152.38ZM152.38 0H47.62C21.32 0 0 21.32 0 47.62V152.38C0 178.68 21.32 200 47.62 200H152.38C178.68 200 200 178.68 200 152.38V47.62C200 21.32 178.68 0 152.38 0Z" fill="#00C9D4"/><path d="M93.39 62.1C89.98 59.66 84.7 58.7 80.99 58.69L26.11 58.74L44.28 71.71H82.53C83.21 71.71 83.79 71.96 84.24 72.29C85.21 72.98 85.5 74.27 84.5 75.67L72.84 92.1L84.25 100.24L96.2 83.46C101.27 76.35 101.05 67.54 93.42 62.1L93.4 62.08Z" fill="currentColor"/><path d="M49.21 102.91C53.53 102.91 58.53 105.26 61.64 107.48L107.62 140.38H84.65L52.58 117.49C52.03 117.05 51.38 116.94 50.8 116.94C49.57 116.94 48.56 117.84 48.56 119.62L48.53 140.38H34.11V119.16C34.11 110.16 39.55 102.91 49.19 102.91Z" fill="currentColor"/><path d="M166.27 115.45V103.76C166.27 96.91 164.14 91.42 159.86 87.3C155.58 83.18 149.91 81.1 142.82 81.1H133.49C128.74 81.1 124.57 82.06 120.95 83.97C117.32 85.88 114.54 88.56 112.55 92.02C110.56 95.49 109.58 99.5 109.58 104.01V119.65C109.58 123.94 110.56 127.7 112.55 130.98C114.54 134.26 117.3 136.82 120.92 138.62C124.55 140.39 128.72 141.3 133.46 141.3H142.32C149.41 141.3 155.11 139.5 159.47 135.92C163.83 132.34 166.02 127.59 166.02 121.67H152.85C152.85 124.15 151.9 126.15 149.99 127.68C148.08 129.18 145.57 129.95 142.46 129.95H133.49C130.3 129.95 127.76 128.99 125.85 127.14C123.94 125.26 122.99 122.77 122.99 119.66V115.46H166.27ZM122.72 105.4V104.34C122.72 100.76 123.7 97.84 125.69 95.63C127.65 93.42 130.24 92.3 133.43 92.3H142.89C145.94 92.3 148.37 93.36 150.25 95.47C152.13 97.57 153.06 100.36 153.06 103.77V105.41H122.71Z" fill="currentColor"/></svg>';

  const textOf = (c, s) => (c.k === 'pre' && s.edited ? PRE_NEW : c.text);
  const MAT = { name: 'Whole Hard Drives', commodity: 'Electronics', code: 'ES-HDD', cl: ['r2', 'pre'] };
  const FGS = [
    { tag: '100482', eff: '10/14/2026, 02:35 PM', mat: 'Whole Hard Drives', com: 'Electronics', type: 'Gaylord', wh: 'A-12', net: '1,240 lbs', po: '—' },
    { tag: '100479', eff: '10/14/2026, 11:02 AM', mat: 'Low Grade Boards', com: 'Electronics', type: 'Gaylord', wh: 'A-07', net: '980 lbs', po: 'PO-2291' },
    { tag: '100476', eff: '10/13/2026, 04:18 PM', mat: 'Power Supplies', com: 'Electronics', type: 'Pallet', wh: 'B-03', net: '1,460 lbs', po: '—' },
    { tag: '100471', eff: '10/13/2026, 09:47 AM', mat: 'Laptops - Complete', com: 'Electronics', type: 'Gaylord', wh: 'A-12', net: '720 lbs', po: 'PO-2287' },
    { tag: '100468', eff: '10/12/2026, 03:05 PM', mat: 'Insulated Copper Wire', com: 'Copper', type: 'Bale', wh: 'C-01', net: '2,110 lbs', po: '—' },
    { tag: '100463', eff: '10/12/2026, 10:21 AM', mat: 'Desktop CPUs', com: 'Electronics', type: 'Gaylord', wh: 'A-09', net: '1,015 lbs', po: '—' },

  const SETTINGS_URL = '/app/settings/inventory/finished-goods';
  const MAT_URL = '/app/commodities/7c1e…/Whole%20Hard%20Drives/4b9d…/overview';
  const FG_URL = '/app/inventory/finished-goods/list';

  // ---------- steps ----------
  const STEPS = [
    { view: 'settings', scope: 'org', cover: 'intro', url: SETTINGS_URL },
    { view: 'settings', scope: 'org', t: '#tab-fg', place: 'bottom', url: SETTINGS_URL,

    { view: 'settings', scope: 'yard', edited: true, cover: 'outro', url: SETTINGS_URL },

  function settings(s) {
    const yard = s.scope === 'yard';
    const yardCell = (rowYards, rowName, id) => {

    const clSec = sec('cl-sec', 'Finished Goods Compliance Language', 'Labels and the words that print on a finished good tag. Turn each one on per yard.', 'Add Compliance Language',
      `<th style="width:230px">Label</th><th>Print text</th>${yardHead('yard-col')}`, clRows);

    const canSave = s.edited && !yard;
    const save = canSave ? `<span class="rb pri" id="btn-save">${ic('save')}Save Changes</span>` : '<span class="rb dis">No Changes to Save</span>';
    const scope = `<div class="scope" id="scope"><span${yard ? '' : ' class="on"'}>${ic('building-2')}Organization</span><span${yard ? ' class="on"' : ''}>${ic('map-pin-house')}${yard ? 'North Yard' : 'Yard'}${ic('chevron-down')}</span></div>`;
    return `<div class="app sapp">
      <header class="abar"><span class="x">${ic('x')}</span><span class="ttl">Settings</span>
        <div class="right">${scope}<span class="ib2">${ic('settings')}</span><span class="ib2">${ic('message-square')}</span><span class="ib2">${ic('circle-help')}</span><span class="ib2">${ic('graduation-cap')}</span>
          <span class="uchip">${ic('user')}jordan@northyardmetals.com</span></div></header>
      <div class="srow">${settingsMenu(yard)}
        <main class="smain">
          <div class="shd"><h1>Inventory Settings</h1>${save}</div>
          <div class="ntabs"><span>General</span><span class="on" id="tab-fg">Finished Goods</span></div>
          <div class="scont">${fgSec}${whSec}${clSec}</div>
        </main>
      </div>
      ${s.cover ? cover(s.cover) : ''}
    </div>`;
  }

  // ---------- Material Properties overview (+ material wizard) ----------
  function material(s) {
    const f = (l, v, extra = '') => `<div class="sf${extra}"><small>${l}</small><div>${v}</div></div>`;
    const props = [
      f('Material Name', MAT.name), f('Commodity Name', MAT.commodity),
      f('Material Code', MAT.code), f('ISRI Code', ''),
      f('Tare Weight Required?', 'No'), f('Notes', ''),
      f('Print Settings', ''), f('Default Gross Weight', ''),
      f('Default Tare Weight', ''), f('Hedge-able Quantity', ''),
      f('Hedge-able Percent', ''),
    ].join('');
    const labels = MAT.cl.map(k => CL.find(c => c.k === k).label).join(', ');
    const page = `<main class="main">
        <div class="phd">${crumbs(['Details', '…', 'Overview'])}
          <div class="trow"><h1>${MAT.name}</h1><span class="rb pri" id="btn-edit">${ic('pencil')}Edit Properties</span></div></div>
        <div class="ntabs"><span class="on">Overview</span></div>
        <div class="mcols">
          <div class="mcol"><div class="sfl"><h4>Material Properties</h4><div class="box">${props}</div></div></div>
          <div class="mcol">
            <div class="sfl"><h4>Compliance</h4><div class="box">${f('Payment Hold Time', 'Is not applied')}${f('Inventory Hold Time', 'Is not applied')}<div class="sf full" id="mp-fgcl"><small>Finished Goods Compliance Language</small><div>${labels}</div></div></div></div>
            <div class="sfl"><h4>Auto-Regrade</h4><div class="box">${f('Enabled', 'No', ' full')}${f('Material', 'None', ' full')}</div></div>
            <div class="sfl"><h4>Backup Source Material</h4><div class="box">${f('Backup Source Material', 'None', ' full')}</div></div>
          </div>
        </div>
      </main>`;
    return `<div class="app">${sidebar('')}${page}${s.wiz ? wizard() : ''}${s.cover ? cover(s.cover) : ''}</div>`;
  }

  function wizard() {
    const prev = STEPS[step - 1];
    const still = prev && prev.wiz ? ' still' : '';
    const stepRow = (n, l, on) => `<div class="vstep${on ? ' on' : ''}"><i class="n">${n}</i><span>${l}</span></div>`;
    // Yard mode (North Yard): only labels active at this yard are offered.
    const options = CL.filter(c => !c.yards || c.yards.includes('North Yard'));
    const menu = `<div class="mmenu" id="cl-menu">${options.map(c => { const on = MAT.cl.includes(c.k); return `<div class="mi${on ? ' sel' : ''}"><span class="cbx${on ? ' on' : ''}">${on ? ic('check') : ''}</span><span>${c.label}</span></div>`; }).join('')}</div>`;
    return `<div class="scrim${still}"></div>
      <div class="wiz${still}">
        <div class="wh"><h2>${MAT.name}</h2><span class="x">${ic('x')}</span></div>
        <div class="wb">
          <div class="wsteps">${stepRow(1, 'General Properties')}<div class="vline"></div>${stepRow(2, 'Inventory')}<div class="vline"></div>${stepRow(3, 'Compliance', true)}</div>
          <div class="wcont">
            <h5>Compliance</h5>
            <div class="hrow"><h6>Bypass Compliance Restrictions</h6><span class="msw"><i></i>Enabled</span></div>
            <p class="tx2" style="max-width:50%">When enabled this will override <b>required payment fields</b>, <b>FE/NF cost thresholds</b>, <b>daily value of commodity limits</b>, and exclude inbound tickets containing only opted out materials from compliance reporting.</p>
            <div class="hrow"><h6>Inventory Hold Exempt</h6><span class="msw"><i></i>Enabled</span></div>
            <p class="tx2">Exempt this material from the inventory hold configured in settings.</p>
            <div class="hrow"><h6>Payment Hold</h6><span class="msw"><i></i>Override for this yard</span></div>
            <p class="tx2">Please note that payment holds will only apply to retail customers.</p>
            <p class="tx2">Inherits the organization default: <strong>No payment hold</strong>. Turn on “Override for this yard” to set a different hold (or no hold) for this yard only.</p>
            <div class="fgsec">
              <h6>Finished Goods Compliance Language</h6>
              <p class="tx2">Select the labels that belong to this material. A finished good tag prints the wording for each selected label that is active at that yard.</p>
              <div class="msel open"><span class="lab">Labels</span>${MAT.cl.map(k => `<span class="chp">${CL.find(c => c.k === k).label}</span>`).join('')}${ic('chevron-up')}</div>
              ${menu}
            </div>
          </div>
        </div>
        <div class="wfoot"><div><span class="rb pri">Save Changes</span><span class="rb">Cancel</span></div><div><span class="rb err">Archive</span></div></div>
      </div>`;
  }

  // ---------- Finished Goods list (+ Bale Tags print dialog) ----------
  function finishedGoods(s) {
    const menuOpen = !s.print;
    const rows = FGS.map((f, i) => `<tr${i === 0 && menuOpen ? ' class="hov"' : ''}>
        <td style="text-align:center"><span class="cbx"></span></td>
        <td class="fg">${f.tag}</td>
        <td><span class="badge b-success">Available</span></td>
        <td>${f.eff}</td>
        <td><div class="stk"><span>${f.mat}</span><small>${f.com}</small></div></td>
        <td>${f.type}</td><td>${f.wh}</td><td class="num">${f.net}</td><td>${f.po}</td>
        <td class="more"><span class="mb"${i === 0 ? ' id="row-more"' : ''}>${ic('ellipsis')}</span></td></tr>`).join('');
    const rmenu = menuOpen ? `<div class="rmenu" id="row-menu" style="top:84px"><div class="ri hv" id="mi-print">${ic('printer')}Print tag</div><div class="ri dst">${ic('trash-2')}Void</div></div>` : '';
    const acts = `<span class="rb">${ic('pencil')}Regrade Material</span><span class="rb">${ic('plus')}Finished Good</span><span class="rb">${ic('plus')}Packing List</span><span class="rb">${ic('plus')}Package</span><span class="rb pri">${ic('plus')}Add Adjustment</span>`;
    const page = `<main class="main">
        <div class="phd">${crumbs(['Finished Goods', 'List'])}
          <div class="trow"><h1>Finished Goods</h1>${acts}</div></div>
        <div class="ntabs"><span class="on">Finished Goods</span><span>Recost History</span></div>
        <div class="fgbody">
          <div class="sumbar"><div><small>Finished Goods (AVAILABLE)</small><b>42</b></div><div><small>Total Weight</small><b>48,220 lbs</b></div><div><small>Largest Material By Weight</small><b>Insulated Copper Wire</b></div></div>
          <div class="gtool"><div class="gsearch">${ic('search')}Search FG, PO, commodity, material, warehouse…</div><span class="fchip">Status: <b>Available</b>${ic('chevron-down')}</span></div>
          <div class="gcard">
            <table><thead><tr><th style="width:40px;text-align:center"><span class="cbx"></span></th><th style="width:96px">FG #</th><th style="width:118px">Status</th><th style="width:196px">Effective</th><th>Commodity / Material</th><th style="width:90px">Type</th><th style="width:104px">Warehouse</th><th class="num" style="width:116px">Net Weight</th><th style="width:104px">PO #</th><th style="width:48px"></th></tr></thead>
            <tbody>${rows}</tbody></table>
            ${rmenu}
          </div>
        </div>
      </main>`;
    return `<div class="app">${sidebar('fg')}${page}${s.print ? printDialog(s) : ''}${s.cover ? cover(s.cover) : ''}</div>`;
  }

  // A stand-in QR code (the real tag encodes the FG tag number).
  function qr() {
    const n = 25, cells = [];
    let seed = 100482;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const finder = (x, y) => [[x, y], [x + 18, y], [x, y + 18]];
    const inFinder = (x, y) => finder(0, 0).some(([fx, fy]) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (inFinder(x, y)) {
        const fx = x >= 18 ? 18 : 0, fy = y >= 18 ? 18 : 0, dx = x - fx, dy = y - fy;
        const ring = dx === 0 || dx === 6 || dy === 0 || dy === 6, core = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
        if (ring || core) cells.push(`M${x} ${y}h1v1h-1z`);
      } else if (rnd() > 0.52) cells.push(`M${x} ${y}h1v1h-1z`);
    }
    return `<svg class="qr" viewBox="-1 -1 27 27" aria-hidden="true"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><path d="${cells.join('')}" fill="#000"/></svg>`;
  }

  function printDialog(s) {
    const f = FGS[0];
    const lines = MAT.cl.map(k => textOf(CL.find(c => c.k === k), s)).join(', ');
    return `<div class="scrim"></div>
      <div class="pdlg" role="dialog" aria-label="Bale Tags">
        <div class="pt">Bale Tags</div>
        <div class="dv"></div>
        <div class="btag">
          <div class="tg">#${f.tag}</div>
          <div class="h6">Effective Date: 10/14/2026</div>
          <div class="h6 mn">${f.mat}</div>
          <div class="cl" id="tag-cl">${lines}</div>
          <div class="dv" style="margin-top:16px"></div>
          <div class="wts"><div><span>Gross:</span><span>1,305 lbs</span></div><div><span>Tare:</span><span>65 lbs</span></div><div><span>Net:</span><span>1,240 lbs</span></div></div>
          ${qr()}
        </div>
      </div>`;
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('tag')}Finished goods · Now live for everyone</div>
        <h2>Print your compliance wording on finished-good tags automatically</h2>
        <p>Set up your compliance wording once, pick which labels belong to each material, and every finished-good tag prints that wording for you.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}Compliance language on tags</div>
      <h2>The right compliance wording on every tag</h2>
      <p>Write each label’s print text once in Inventory Settings, pick the labels each material needs, and finished-good tags print that wording under the material name. Each yard can turn labels on or off for itself.</p>
      <div class="cta"><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button></div>
    </div></div>`;
  }

  function renderApp(s) {
    if (s.view === 'mat') return material(s);
    if (s.view === 'fg') return finishedGoods(s);
    return settings(s);
  }
  function anchorMenus() {}

  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Set up your compliance wording once and every finished-good tag prints it for you.'
      : '<span class="n">Done</span>Print text set once, labels picked per material, printed on every tag. Replay any step with the bars above.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
