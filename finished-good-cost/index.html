<meta charset="utf-8">
<title>ReSpark Finished Good Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of ReSpark Inventory → Finished Goods (list + Recost History
   sub-tabs) for finished good cost adjustments; a pulsing hotspot + tooltip
   guides each step; step controls sit under the frame. The app mock keeps
   ReSpark's light theme (it stands in for a screenshot); the page around it
   follows the viewer's theme. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }


/* main column: depth-3 header (breadcrumb row + title row), sub-tabs, content */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.thead { padding: 22px 24px 14px; border-bottom: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; gap: 8px; }
.crow { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--a-text-3); }
.crow > svg.lucide { width: 20px; height: 20px; color: var(--a-fg); margin-right: 2px; }
.crow .leaf { color: var(--a-fg); }
.crow .sep { color: var(--a-text-3); margin-inline: 2px; }
.qpill { display: inline-flex; gap: 2px; margin-left: 16px; background: var(--a-hover); border-radius: 10px; padding: 3px; }
.qpill span { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--a-text-2); }
.trow { display: flex; align-items: center; gap: 8px; min-height: 34px; }
.trow h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em; flex: 1; }
.trow .acts { display: flex; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--a-border-subtle); }
.tab { height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: var(--a-text-2); border-bottom: 2px solid transparent; }
.tab.on { color: var(--a-primary-hover); border-bottom-color: var(--a-primary); font-weight: 600; }
.ibody { flex: 1; min-height: 0; padding: 0 24px 18px; display: flex; flex-direction: column; position: relative; }

.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.sm { height: 30px; padding-inline: 10px; font-size: 12.5px; }
.rb.icon { width: 30px; padding: 0; justify-content: center; }
.rb.danger { color: var(--a-error-strong); border-color: hsla(348, 81%, 48%, 0.4); }
.rb.ghost { border-color: transparent; background: transparent; color: var(--a-text-3); }

/* InventorySummaryBar */
.sumbar { display: flex; border: 1px solid var(--a-border-subtle); border-radius: 6px; margin: 16px 0 8px; overflow: hidden; }
.sumbar > div { flex: 1; padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sumbar > div + div { border-left: 1px solid var(--a-border-subtle); }
.sumbar small { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--a-text-2); opacity: .85; }
.sumbar b { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }

/* ResparkGrid */
.grid { border: 1px solid var(--a-border-subtle); border-radius: 8px; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.gtool { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.inp { height: 32px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 9px; color: var(--a-text-3); font-size: 12.5px; background: var(--a-surface); white-space: nowrap; }
.inp svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.gtool .search { width: 330px; }
.gtool .flt { min-width: 150px; justify-content: space-between; color: var(--a-fg); }
.gtool .flt.ph { color: var(--a-text-3); }
.chipv { font-size: 11.5px; font-weight: 500; background: var(--a-hover); border-radius: 4px; padding: 1px 6px; }
table { width: 100%; font-size: 13px; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12.5px; padding: 0 12px; height: 38px; background: var(--a-muted-solid); border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; color: var(--a-text-2); }
td { padding: 0 12px; height: 50px; border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.num, th.num { text-align: right; }
.gt tr.on td { background: hsla(183, 100%, 33%, 0.07); }
.gt td.cbx, .gt th.cbx { padding: 0 0 0 14px; }
.link { color: var(--a-primary-hover); font-weight: 500; }
.stk { display: flex; flex-direction: column; line-height: 1.3; }
.stk small { color: var(--a-text-3); font-size: 11.5px; }
.more { color: var(--a-icon-2); }
.chip { display: inline-flex; align-items: center; height: 24px; padding-inline: 8px; border-radius: 4px; font-size: 12px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.c-success { border-color: hsla(162, 73%, 37%, 0.4); background: hsla(162, 73%, 37%, 0.10); color: var(--a-success-strong); }
.c-error { border-color: hsla(348, 81%, 48%, 0.4); background: hsla(348, 81%, 48%, 0.10); color: var(--a-error-strong); }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--a-border); display: inline-grid; place-items: center; vertical-align: middle; background: var(--a-surface); }
.cb.on { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.app .cb svg.lucide { width: 12px; height: 12px; stroke-width: 3; }

/* floating selection bar (inverted theme) */
.selbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; background: #1b2638; color: #fff; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 8px 11px; box-shadow: 0 10px 28px rgba(15, 23, 42, .28); z-index: 3; }
.selbar .cnt { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
.selbar .cnt b { background: var(--a-primary); border-radius: 6px; min-width: 30px; height: 30px; display: grid; place-items: center; font-weight: 600; }
.selbar .bacts { display: flex; align-items: center; gap: 7px; align-self: stretch; }
.selbar .rb { background: transparent; color: #fff; border-color: rgba(255,255,255,.22); }
.selbar .rb.danger { color: hsl(348 90% 72%); border-color: hsla(348, 90%, 72%, .45); }
.selbar .vr { width: 1px; align-self: stretch; background: rgba(255,255,255,.12); }

/* Drawer primitive: floats 30px in from the edges over a dim overlay */
.scrim { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.40); z-index: 5; }
.drawer { position: absolute; top: 30px; right: 30px; bottom: 30px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; box-shadow: -12px 0 40px rgba(15, 23, 42, 0.22); display: flex; flex-direction: column; z-index: 6; animation: slide .25s ease; }
.drawer.still { animation: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer .dh { display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.drawer .dh h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.drawer .dh svg.lucide { color: var(--a-text-2); }
.drawer .db { flex: 1; min-height: 0; padding: 20px; display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden; }
.drawer .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--a-border-subtle); background: hsla(217, 55%, 16%, 0.02); border-radius: 0 0 8px 8px; }
.drawer .df .rb { height: 36px; padding-inline: 14px; }

/* Adjust Cost drawer */
.hdr { display: flex; flex-direction: column; gap: 8px; }
.hgrid { display: grid; grid-template-columns: auto 190px 170px minmax(220px, 1fr); gap: 12px; align-items: start; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld label { font-size: 12px; font-weight: 500; }
.fld label i { font-style: normal; color: var(--a-error); margin-left: 2px; }
.in { height: 34px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 10px; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--a-surface); }
.in.ph { color: var(--a-text-3); }
.in svg.lucide { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--a-border); border-radius: 8px; padding: 1px; }
.seg span { height: 30px; display: inline-flex; align-items: center; padding-inline: 12px; font-size: 13px; font-weight: 600; color: var(--a-text-2); border-radius: 7px; border: 1px solid transparent; }
.seg span.on { background: var(--a-primary-subtle); color: var(--a-primary-hover); }
.strip { border-radius: 6px; background: var(--a-muted-solid); padding: 8px 12px; font-size: 13px; color: var(--a-text-2); }
.fsec { display: flex; flex-direction: column; gap: 12px; position: relative; flex: 1; min-height: 0; }
.fsec h4 { margin: 0; font-size: 14px; font-weight: 600; }
.fsec .cap { margin: 0; font-size: 13px; color: var(--a-text-2); }
.atbl { border: 1px solid var(--a-border-subtle); border-radius: 6px; overflow: hidden; }
.atbl table { font-size: 13px; }
.atbl th { height: 38px; font-weight: 500; color: var(--a-text-2); }
.atbl td { height: 48px; color: var(--a-text-2); }
.atbl td.t { color: var(--a-fg); }
.atbl td.tag { color: var(--a-fg); font-weight: 500; }
.atbl tr.tot td { background: var(--a-muted-solid); font-weight: 600; color: var(--a-fg); border-bottom: 0; }
.atbl .in { height: 30px; font-size: 12.5px; padding-inline: 8px; }
.atbl .in .pre { color: var(--a-text-3); }
.atbl .in .v { margin-left: auto; }
.atbl .in.sel { justify-content: space-between; }
.atbl .in.sel svg.lucide { margin-left: 0; }

<script>
(() => {
  const W = 1440, H = 820;
  const MARK = '<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M152.38 13.33C171.29 13.33 186.67 28.71 186.67 47.62V152.38C186.67 171.29 171.29 186.67 152.38 186.67H47.62C28.71 186.67 13.33 171.29 13.33 152.38V47.62C13.33 28.71 28.71 13.33 47.62 13.33H152.38ZM152.38 0H47.62C21.32 0 0 21.32 0 47.62V152.38C0 178.68 21.32 200 47.62 200H152.38C178.68 200 200 178.68 200 152.38V47.62C200 21.32 178.68 0 152.38 0Z" fill="#00C9D4"/><path d="M93.39 62.1C89.98 59.66 84.7 58.7 80.99 58.69L26.11 58.74L44.28 71.71H82.53C83.21 71.71 83.79 71.96 84.24 72.29C85.21 72.98 85.5 74.27 84.5 75.67L72.84 92.1L84.25 100.24L96.2 83.46C101.27 76.35 101.05 67.54 93.42 62.1L93.4 62.08Z" fill="currentColor"/><path d="M49.21 102.91C53.53 102.91 58.53 105.26 61.64 107.48L107.62 140.38H84.65L52.58 117.49C52.03 117.05 51.38 116.94 50.8 116.94C49.57 116.94 48.56 117.84 48.56 119.62L48.53 140.38H34.11V119.16C34.11 110.16 39.55 102.91 49.19 102.91Z" fill="currentColor"/><path d="M166.27 115.45V103.76C166.27 96.91 164.14 91.42 159.86 87.3C155.58 83.18 149.91 81.1 142.82 81.1H133.49C128.74 81.1 124.57 82.06 120.95 83.97C117.32 85.88 114.54 88.56 112.55 92.02C110.56 95.49 109.58 99.5 109.58 104.01V119.65C109.58 123.94 110.56 127.7 112.55 130.98C114.54 134.26 117.3 136.82 120.92 138.62C124.55 140.39 128.72 141.3 133.46 141.3H142.32C149.41 141.3 155.11 139.5 159.47 135.92C163.83 132.34 166.02 127.59 166.02 121.67H152.85C152.85 124.15 151.9 126.15 149.99 127.68C148.08 129.18 145.57 129.95 142.46 129.95H133.49C130.3 129.95 127.76 128.99 125.85 127.14C123.94 125.26 122.99 122.77 122.99 119.66V115.46H166.27ZM122.72 105.4V104.34C122.72 100.76 123.7 97.84 125.69 95.63C127.65 93.42 130.24 92.3 133.43 92.3H142.89C145.94 92.3 148.37 93.36 150.25 95.47C152.13 97.57 153.06 100.36 153.06 103.77V105.41H122.71Z" fill="currentColor"/></svg>';
  document.getElementById('brand').innerHTML = MARK + '<span>ReSpark</span>';

  const ic = (n, extra = '') => `<i data-lucide="${n}" ${extra}></i>`;

  // Sample data (illustrative). Add Cost at $0.0400/lbs layers baling and
  // freight cost found after the fact onto two Available tags.
  const usd = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const lbs = v => v.toLocaleString('en-US') + ' lbs';
  const RATE = 0.04;
  const FGS = [
    { tag: '10488', mat: '6063 Extrusion', com: 'Aluminum', eff: '10/09/2026, 03:12 PM', type: 'Bale', wh: 'Main', w: 2480, po: '5512' },
    { tag: '10471', mat: 'Aluminum Cans (UBC)', com: 'Aluminum', eff: '10/06/2026, 10:48 AM', type: 'Bale', wh: 'Main', w: 3100, cost: 1612.00, po: '5498', sel: true },
    { tag: '10466', mat: 'Painted Siding', com: 'Aluminum', eff: '10/05/2026, 01:30 PM', type: 'Bale', wh: 'Dock 2', w: 2240, cost: 1747.20, po: '—', sel: true },
    { tag: '10459', mat: 'Clean Aluminum Wheels', com: 'Aluminum', eff: '10/02/2026, 09:05 AM', type: 'Box', wh: 'Main', w: 1960, po: '5471' },
    { tag: '10452', mat: 'Old Sheet', com: 'Aluminum', eff: '09/30/2026, 04:41 PM', type: 'Bale', wh: 'Dock 2', w: 2850, po: '—' },
    { tag: '10447', mat: 'Insulated Copper Wire', com: 'Copper', eff: '09/29/2026, 11:20 AM', type: 'Box', wh: 'Main', w: 1480, po: '5463' },
  ];
  const SEL = FGS.filter(f => f.sel);
  const added = f => Math.round(RATE * f.w * 100) / 100;
  const NOTE = 'Baling labor and freight to processor';
  const HIST = [
    { n: '1045', reason: 'Set Value', rate: '$0.4800/lbs', tags: 4, eff: '09/30/2026', notes: 'Q3 market write-down', by: 'Morgan Lee' },
    { n: '1044', reason: 'Add Cost', rate: 'Multiple', tags: 6, eff: '09/18/2026', notes: 'Shredder burden, September', by: 'Morgan Lee' },
    { n: '1043', reason: 'Add Cost', rate: '$0.0250/lbs', tags: 3, eff: '09/09/2026', notes: 'Outside baling charge', by: 'Jordan Pike' },
    { n: '1042', reason: 'Set Value', rate: '$0.5100/lbs', tags: 2, eff: '08/29/2026', notes: '—', by: 'Morgan Lee' },
  ];
  const NEW_ADJ = { n: '1046', reason: 'Add Cost', rate: '$0.0400/lbs', tags: 2, eff: '10/16/2026', notes: NOTE, by: 'Jordan Pike', isNew: true };

  const LIST = '/app/inventory/finished-goods/list';
  const HISTORY = '/app/inventory/finished-goods/history';
  const DETAIL = HISTORY + '/7c1e5a92-4b0d-4f6e-9a3c-2d81f0b6e417';

  // ---------- steps ----------
  const STEPS = [
    { view: 'fg', cover: 'intro', url: LIST },
    { view: 'fg', picked: true, t: '#sel', place: 'bottom', url: LIST,
      tip: 'In <b>Inventory → Finished Goods</b>, tick the tags you want to recost. You can pick one or many.' },
    { view: 'fg', picked: true, t: '#btn-adj', place: 'top', url: LIST,
      tip: 'Click <b>Adjust Cost</b> in the selection bar.' },
    { view: 'fg', picked: true, drawer: 'adj', reason: 'set', t: '#reason', place: 'right', url: LIST,
      tip: '<b>Set Value</b> is selected by default and replaces each tag’s cost per UM. To layer extra cost on top instead, switch to <b>Add Cost</b>.' },
    { view: 'fg', picked: true, drawer: 'adj', reason: 'add', notes: true, t: '#hdr', place: 'bottom', url: LIST,
      tip: 'With <b>Add Cost</b> on, check the <b>Effective Date</b> and <b>Effective Time</b> (they start at now) and add <b>Notes</b> on why.' },
    { view: 'fg', picked: true, drawer: 'adj', reason: 'add', notes: true, bulk: true, t: '#bulk', place: 'top', url: LIST,
      tip: 'Type a <b>New rate</b>, pick the unit and click <b>Apply (2)</b> to fill every row at once.' },
    { view: 'fg', picked: true, drawer: 'adj', reason: 'add', notes: true, bulk: true, rates: true, t: '#atable', place: 'bottom', url: LIST,
      tip: 'Each tag has its own <b>New Rate</b> and <b>UM</b>, so you can change any row. <b>New Cost</b> previews the result before you save.' },
    { view: 'fg', picked: true, drawer: 'adj', reason: 'add', notes: true, bulk: true, rates: true, t: '#btn-save', place: 'top', url: LIST,
      tip: 'Click <b>Adjust Cost (2 Tags)</b> to save.' },
    { view: 'fg', toast: true, t: '#tab-hist', place: 'bottom', url: LIST,
      tip: 'You stay on the Finished Goods list. Every adjustment is kept on the <b>Recost History</b> tab.' },
    { view: 'hist', t: '#row-new', place: 'bottom', url: HISTORY,
      tip: 'Your adjustment is at the top, with its rate, tag count and notes. Click it to open it.' },
    { view: 'hist', drawer: 'detail', t: '#btn-void', place: 'top', url: DETAIL,
      tip: 'Review the rate, effective date and tags. If it was a mistake, click <b>Void</b>.' },
    { view: 'hist', drawer: 'detail', confirm: true, t: '#confirm', place: 'left', url: DETAIL,
      tip: 'Confirm with <b>Void</b>. The adjustment is removed from every tag it touched.' },
    { view: 'hist', drawer: 'detail', cover: 'outro', url: DETAIL },
  ];

  // ---------- chrome ----------
  function sidebar(active) {
    const row = (i, l, extra = '') => `<div class="nrow">${ic(i)}<span>${l}</span>${extra || ic('chevron-right', 'class="chev"')}</div>`;
    const sub = (id, l, isNew) => `<div class="nrow sub${active === id ? ' active' : ''}" id="nav-${id}"><span>${l}</span>${isNew ? '<span class="pill">New</span>' : ''}</div>`;
    return `<aside class="side">
      <div class="top">${MARK}<div class="yard"><span>North Yard</span>${ic('chevrons-up-down')}</div></div>
      <div class="nav">
        ${row('inbox', 'Inbox', '<span class="pill">4</span>')}
        ${row('messages-square', 'ScrapChat', ' ')}
        <div class="cmd" style="margin:2px 0">${ic('search')}<span>Search &amp; actions</span><kbd>⌘K</kbd></div>
        <div class="nsep"></div>
        ${row('shopping-cart', 'Purchases')}${row('tag', 'Sales')}${row('file-text', 'Contracts')}
        <div class="nrow">${ic('boxes')}<span>Inventory</span>${ic('chevron-down', 'class="chev"')}</div>
        ${sub('ov', 'Inventory Overview')}${sub('rg', 'Regrades')}${sub('bp', 'Batch Production')}${sub('fg', 'Finished Goods')}${sub('pl', 'Packing Lists')}${sub('adj', 'Adjustments')}${sub('pic', 'Physical Inventory Count', true)}${sub('pk', 'Packages')}${sub('ni', 'Negative Inventory')}
        ${row('users', 'Customers')}${row('layers', 'Commodities')}${row('truck', 'Logistics')}${row('clipboard-list', 'Load Board')}${row('warehouse', 'Assets')}${row('chart-column', 'Reports')}${row('landmark', 'Ledger')}
      </div>
      <div class="foot"><div class="av">JP</div><div class="who"><span>Jordan Pike</span><small>General Manager</small></div>
        <div class="ico"><span>${ic('settings')}</span><span>${ic('circle-help')}</span></div></div>
    </aside>`;
  }

  // Depth-3 inventory header: back arrow + breadcrumbs (maxItems 2) and the
  // search / scan-license pill, then the "Finished Goods" title row with the
  // shared inventory actions (hidden on Recost History). Sub-tabs below.
  const INV_ACTS = `<span class="rb">${ic('pencil')}Regrade Material</span><span class="rb">${ic('plus')}Finished Good</span><span class="rb">${ic('plus')}Packing List</span><span class="rb">${ic('plus')}Package</span><span class="rb pri">${ic('plus')}Add Adjustment</span>`;
  function header(tab, detail) {
    const crumbs = tab === 'list'
      ? `<span>Finished Goods</span><span class="sep">/</span><span class="leaf">List</span>`
      : detail
        ? `<span>Finished Goods</span><span class="sep">/</span><span>…</span><span class="sep">/</span><span class="leaf">Details</span>`
        : `<span>Finished Goods</span><span class="sep">/</span><span class="leaf">History</span>`;
    return `<div class="thead">
        <div class="crow">${ic('arrow-left')}${crumbs}<span class="qpill"><span>${ic('search')}</span><span>${ic('id-card')}</span></span></div>
        <div class="trow"><h1>Finished Goods</h1><div class="acts">${tab === 'list' ? INV_ACTS : ''}</div></div>
      </div>
      <div class="tabs"><span class="tab${tab === 'list' ? ' on' : ''}" id="tab-list">Finished Goods</span><span class="tab${tab === 'hist' ? ' on' : ''}" id="tab-hist">Recost History</span></div>`;
  }

  function finishedGoods(s) {
    const row = f => {
      const on = s.picked && f.sel;
      return `<tr${on ? ' class="on"' : ''}><td class="cbx"><span class="cb${on ? ' on' : ''}">${on ? ic('check') : ''}</span></td><td><span class="link">${f.tag}</span></td><td><span class="chip c-success">Available</span></td><td>${f.eff}</td><td><div class="stk"><span>${f.mat}</span><small>${f.com}</small></div></td><td>${f.type}</td><td>${f.wh}</td><td class="num">${lbs(f.w)}</td><td>${f.po}</td><td class="more">${ic('ellipsis')}</td></tr>`;
    };
    // Selected tags sit together in their own tbody so the step can point at them as one block.
    const top = FGS.slice(0, 1), picked = FGS.slice(1, 3), rest = FGS.slice(3);
    const bar = s.picked ? `<div class="selbar"><div class="cnt"><b>${SEL.length}</b>selected</div><div class="bacts">
        <span class="rb sm">${ic('printer')}Print Tags</span><span class="rb sm" id="btn-adj">${ic('circle-dollar-sign')}Adjust Cost</span><span class="rb sm danger">${ic('trash-2')}Void</span>

    return `<main class="main">${header('list')}

        <div class="sumbar"><div><small>Finished Goods (AVAILABLE)</small><b>128</b></div><div><small>Total Weight</small><b>286,420 lbs</b></div><div><small>Largest Material By Weight</small><b>Aluminum Cans (UBC)</b></div></div>
        <div class="grid"><div class="gtool"><div class="inp search">${ic('search')}Search FG, PO, commodity, material, warehouse…</div><div class="inp flt"><span class="chipv">Available</span>${ic('chevron-down')}</div></div>
          <table class="gt"><thead><tr><th class="cbx" style="width:44px"><span class="cb${s.picked ? '' : ''}"></span></th><th style="width:96px">FG #</th><th style="width:120px">Status</th><th style="width:180px">Effective</th><th style="width:200px">Commodity / Material</th><th style="width:80px">Type</th><th style="width:100px">Warehouse</th><th class="num" style="width:120px">Net Weight</th><th style="width:80px">PO #</th><th style="width:44px"></th></tr></thead>
          <tbody>${top.map(row).join('')}</tbody><tbody id="sel">${picked.map(row).join('')}</tbody><tbody>${rest.map(row).join('')}</tbody></table>
          ${bar}
        </div>
      </div></main>`;

  function history(s) {
    const list = [NEW_ADJ, ...HIST];
    const rows = list.map(c => `<tr${c.isNew ? ' id="row-new"' : ''}><td><span class="link">${c.n}</span></td><td>${c.reason}</td><td class="num">${c.rate}</td><td class="num">${c.tags}</td><td>${c.eff}</td><td style="color:var(--a-text-2)">${c.notes}</td><td><span class="chip c-success">Active</span></td><td>${c.by}</td></tr>`).join('');
    return `<main class="main">${header('hist', s.drawer === 'detail')}
      <div class="ibody" style="padding-top:16px">
        <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><span class="rb sm pri">${ic('plus')}Cost Adjustment</span></div>
        <div class="grid"><div class="gtool"><div class="inp flt ph">Status${ic('chevron-down')}</div></div>
          <table class="gt"><thead><tr><th style="width:90px">Adj #</th><th style="width:110px">Reason</th><th class="num" style="width:130px">Rate</th><th class="num" style="width:70px">Tags</th><th style="width:120px">Effective</th><th style="width:260px">Notes</th><th style="width:110px">Status</th><th>Created By</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      </div></main>`;
  }

  function drawer(s) {
    if (!s.drawer) return '';
    const prev = STEPS[step - 1];
    const still = prev && prev.drawer === s.drawer ? ' still' : '';
    const shell = (title, width, body, foot) => `<div class="scrim"></div><div class="drawer${still}" style="width:${width}px"><div class="dh"><h3>${title}</h3>${ic('x')}</div><div class="db">${body}</div><div class="df">${foot}</div></div>`;
    if (s.drawer === 'adj') {
      const add = s.reason === 'add';
      const desc = add
        ? 'Layers a $/UM burden on top of each tag’s existing cost. Allowed on shipped tags.'
        : 'Replaces each tag’s cost per UM with this rate. Shipped tags need a date before they shipped; the rate can’t be negative.';
      const lines = SEL.map(t => {
        const nc = s.rates ? usd(t.cost + added(t)) : '—';
        return `<tr><td><span class="cb"></span></td><td class="tag">#${t.tag}</td><td class="t">${t.mat}</td><td class="num">${lbs(t.w)}</td><td class="num">$${(t.cost / t.w).toFixed(4)}/lbs</td>
          <td><div class="in${s.rates ? '' : ' ph'}"><span class="pre">$</span><span class="v">${s.rates ? '0.0400' : '0.00'}</span></div></td>
          <td><div class="in sel">LBS${ic('chevron-down')}</div></td><td class="num t">${nc}</td><td>${ic('trash-2')}</td></tr>`;
      }).join('');
      const total = s.rates ? usd(SEL.reduce((a, t) => a + t.cost + added(t), 0)) : usd(0);
      return shell('Adjust Cost', 1240, `
        <div class="hdr" id="hdr">
          <div class="hgrid">
            <div class="fld"><label>Reason</label><div class="seg" id="reason"><span${add ? '' : ' class="on"'}>Set Value</span><span${add ? ' class="on"' : ''}>Add Cost</span></div></div>
            <div class="fld"><label>Effective Date<i>*</i></label><div class="in">10/16/2026${ic('calendar')}</div></div>
            <div class="fld"><label>Effective Time<i>*</i></label><div class="in">09:42 AM${ic('clock')}</div></div>
            <div class="fld"><label>Notes</label><div class="in${s.notes ? '' : ' ph'}">${s.notes ? NOTE : 'Why is this cost being adjusted?'}</div></div>
          </div>
          <div class="strip">${desc}</div>
        </div>
        <div class="fsec"><h4>Tags (${SEL.length})</h4>
          <p class="cap">New Cost is a preview — totals move if the weight is edited later.</p>
          <div class="atbl" id="atable"><table><thead><tr><th style="width:44px"><span class="cb"></span></th><th style="width:100px">Tag #</th><th>Material</th><th class="num" style="width:120px">Net Wt</th><th class="num" style="width:170px">Current Cost ($/UM)</th><th class="num" style="width:128px">New Rate</th><th style="width:96px">UM</th><th class="num" style="width:130px">New Cost</th><th style="width:44px"></th></tr></thead>
            <tbody>${lines}<tr class="tot"><td colspan="7">Total</td><td class="num">${total}</td><td></td></tr></tbody></table></div>
          <div class="bulk" id="bulk"><span class="pill2">All tags</span><div class="in rate${s.bulk ? '' : ' ph'}"><span class="pre">$</span><span class="v">${s.bulk ? '0.0400' : 'New rate'}</span></div><div class="in um">LBS${ic('chevron-down')}</div><span class="rb sm pri">Apply (${SEL.length})</span></div>
        </div>`,
        `<span class="rb">Cancel</span><span class="rb pri" id="btn-save">Adjust Cost (${SEL.length} Tags)</span>`);
    }
    if (s.drawer === 'detail') {
      const pop = s.confirm ? `<div class="pop" id="confirm"><div class="pt">${ic('circle-alert')}Void this cost adjustment?</div>
          <p>It is removed from every tag it touched. If the accounting period is locked, a reversal dated today is posted instead of deleting history.</p>
          <div class="pa"><span class="rb">Cancel</span><span class="rb danger">Void</span></div></div>` : '';
      return shell(`Cost Adjustment #${NEW_ADJ.n}`, 600, `
        <div class="dsec"><h4>Adjustment</h4><div class="dgrid">
          <div class="df2"><small>Adj #</small><span>${NEW_ADJ.n}</span></div>
          <div class="df2"><small>Status</small><span><span class="chip c-success">Active</span></span></div>
          <div class="df2"><small>Reason</small><span>Add Cost</span></div>
          <div class="df2"><small>Rate</small><span>${NEW_ADJ.rate}</span></div>
          <div class="df2"><small>Effective Date</small><span>10/16/2026</span></div>
          <div class="df2"><small>Created</small><span>10/16/2026, 09:44 AM by Jordan Pike</span></div>
        </div></div>
        <div class="dsec"><h4>Notes</h4><span style="font-size:13.5px">${NOTE}</span></div>
        <div class="dsec"><h4>Tags (${SEL.length})</h4><div class="tlist">${SEL.map(t => `<div><b>#${t.tag}</b><span>${t.w.toLocaleString('en-US')}</span><em>${NEW_ADJ.rate}</em></div>`).join('')}</div></div>`,
        `<span class="vwrap">${pop}<span class="rb danger" id="btn-void">${ic('trash-2')}Void</span></span><span class="rb">Close</span>`);
    }
    return '';
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('circle-dollar-sign')}Inventory · Now live for everyone</div>
        <h2>Fix a finished good’s cost without deleting the tag</h2>
        <p>Adjust the cost of one or many finished goods right from the Finished Goods list, then review every change on the <b>Recost History</b> tab.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}Finished good cost updates</div>
      <h2>Correct the cost, keep the tag</h2>
      <p>Use <b>Set Value</b> to replace a tag’s cost per UM, or <b>Add Cost</b> to layer cost on top. You see the new cost before you save, and every change is kept in <b>Recost History</b>, where it can be voided. Voided tags can’t be adjusted, and a <b>Set Value</b> on a shipped tag has to be dated before it shipped.</p>
      <div class="cta"><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button><a class="go sec" href="https://intercom.help/greenspark-software/en/articles/6387729-create-and-manage-finished-goods" target="_blank" rel="noopener">${ic('book-open')}Read the full guide</a></div>
    </div></div>`;
  }

  function renderApp(s) {
    const view = s.view === 'hist' ? history(s) : finishedGoods(s);
    const toast = s.toast ? `<div class="toast">${ic('circle-check')}Cost adjusted on ${SEL.length} tags</div>` : '';
    return `<div class="app">${sidebar('fg')}${view}${drawer(s)}${toast}${s.cover ? cover(s.cover) : ''}</div>`;
  }
  function anchorMenus() {}

  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Fix a finished good’s cost from the Finished Goods list without deleting the tag.'
      : '<span class="n">Done</span>Set Value or Add Cost, check the New Cost preview, and review or void it on the Recost History tab. Read the full guide in the help center.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
