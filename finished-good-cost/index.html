<meta charset="utf-8">
<title>ReSpark Finished Good Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of ReSpark Inventory (based on the Inventory Overview
   screen) for finished good cost adjustments; a pulsing hotspot + tooltip guides each step; step controls sit
   under the frame. The app mock keeps ReSpark's light theme (it stands in
   for a screenshot); the page around it follows the viewer's theme. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 22px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.crumbs { font-size: 12px; color: var(--a-text-3); display: flex; align-items: center; gap: 4px; }
.crumbs svg.lucide { width: 12px; height: 12px; }
.phead h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.phead .left { display: flex; flex-direction: column; gap: 4px; }
.phead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.icon { width: 32px; padding: 0; justify-content: center; }
.badge { display: inline-flex; align-items: center; height: 20px; padding-inline: 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.b-success { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.b-accent { background: hsla(252, 89%, 65%, 0.14); color: var(--a-accent-strong); }
.b-neutral { background: hsla(217, 55%, 16%, 0.07); color: var(--a-text-2); }

/* inventory pages */
.phead { padding: 14px 24px 12px; border-bottom: 0; align-items: flex-start; }
.ibody { flex: 1; min-height: 0; padding: 0 24px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--a-border-subtle); border-radius: 10px; }
.kpis > div { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpis > div + div { border-left: 1px solid var(--a-border-subtle); }
.kpis small { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--a-text-3); }
.kpis b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.kpis span { font-size: 12px; color: var(--a-text-3); }
.tcard { border: 1px solid var(--a-border-subtle); border-radius: 10px; overflow: hidden; flex: 1; min-height: 0; }
.tcard .tt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.tcard .tt .inp { width: 240px; }
.tcard .tt .cnt { margin-left: auto; font-size: 12px; color: var(--a-text-3); }
.inp { height: 32px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 9px; color: var(--a-text-3); font-size: 12.5px; background: var(--a-surface); white-space: nowrap; }
.inp svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12.5px; padding: 0 12px; height: 38px; background: var(--a-muted-solid); border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; }
td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itab td, .itab th { border-right: 0; }
.itab th { color: var(--a-text-2); }
.itab td.num, .itab th.num { text-align: right; }
.itab tr.new td { background: hsla(183, 100%, 33%, 0.07); }
.itab .mono { font-family: var(--mono); font-size: 12px; }
.b-teal { background: hsla(183, 100%, 33%, 0.12); color: var(--a-primary-hover); }

.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 470px; background: var(--a-surface); border-left: 1px solid var(--a-border); box-shadow: -12px 0 32px rgba(15, 23, 42, 0.12); display: flex; flex-direction: column; z-index: 6; animation: slide .25s ease; }
.drawer.still { animation: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.drawer .dh h3 { margin: 0; font-size: 16px; font-weight: 600; }
.drawer .dh .x { margin-left: auto; color: var(--a-text-3); }
.drawer .db { flex: 1; min-height: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.drawer .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--a-border-subtle); }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld label { font-size: 12px; font-weight: 500; color: var(--a-text-2); }
.fld .in { height: 34px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.fld .in.ph { color: var(--a-text-3); }
.fld .in.open { border-color: var(--a-primary); box-shadow: 0 0 0 3px hsla(183, 100%, 33%, 0.15); }
.fld .in .u { margin-left: auto; color: var(--a-text-3); }
.fld .in svg.lucide { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.fld .in.ro { background: var(--a-muted-solid); font-weight: 600; }
.fld .hint { font-size: 12px; color: var(--a-text-3); }
.fld .hint b { color: var(--a-primary-hover); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; background: hsla(183, 100%, 33%, 0.07); border: 1px solid hsla(183, 100%, 33%, 0.22); border-radius: 8px; padding: 10px 12px; color: var(--a-text-2); }
.note svg.lucide { width: 15px; height: 15px; color: var(--a-primary-hover); margin-top: 1px; }
.note b { color: var(--a-fg); }
.dd { position: absolute; left: 18px; right: 18px; top: 82px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; box-shadow: 0 6px 22px rgba(15, 23, 42, 0.16); padding: 4px; z-index: 5; animation: pop .18s ease; }
.dd .mh { font-size: 11px; color: var(--a-text-3); padding: 6px 9px 4px; }
.dd .o { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 5px; font-size: 13px; }
.dd .o span { margin-left: auto; font-size: 12px; color: var(--a-text-3); font-variant-numeric: tabular-nums; }
.dd .o.hv { background: var(--a-hover); }
@keyframes pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

.stepper { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--a-text-3); }
.stepper span { display: inline-flex; align-items: center; gap: 6px; }
.stepper i.n { font-style: normal; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--a-border); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.stepper .on { color: var(--a-fg); font-weight: 600; }
.stepper .on i.n { background: var(--a-dark); border-color: var(--a-dark); color: #fff; }
.stepper .done i.n { background: var(--a-primary-subtle); border-color: transparent; color: var(--a-primary-hover); }
.stepper .ln { flex: 1; height: 1px; background: var(--a-border-subtle); }
.choice { border: 1px solid var(--a-border); border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.choice .ci { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--a-hover); flex-shrink: 0; }
.choice .ci svg.lucide { width: 18px; height: 18px; }
.choice b { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.choice small { font-size: 12.5px; color: var(--a-text-3); line-height: 1.4; }
.choice.on { border-color: var(--a-primary); box-shadow: 0 0 0 3px hsla(183, 100%, 33%, 0.12); }
.choice.on .ci { background: var(--a-primary-subtle); color: var(--a-primary-hover); }
.pkl { border: 1px solid var(--a-border-subtle); border-radius: 8px; overflow: hidden; }
.pkl .pr { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; }
.pkl .pr + .pr { border-top: 1px solid var(--a-border-subtle); }
.pkl .pr .rd { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--a-border); flex-shrink: 0; }
.pkl .pr.on { background: hsla(183, 100%, 33%, 0.06); }
.pkl .pr.on .rd { border: 5px solid var(--a-primary); }
.pkl .pr .tx { display: flex; flex-direction: column; }
.pkl .pr .tx small { color: var(--a-text-3); font-size: 12px; }
.pkl .pr .w { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.pkl .pr .w small { display: block; color: var(--a-text-3); font-size: 12px; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--a-muted-solid); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--a-text-3); gap: 6px; }
.sum b { display: block; font-size: 14px; color: var(--a-fg); font-variant-numeric: tabular-nums; }
.alloc { width: 100%; font-size: 12.5px; }
.alloc th { height: 32px; font-size: 11.5px; color: var(--a-text-3); background: transparent; border-right: 0; padding: 0 6px; }
.alloc td { height: 40px; border-right: 0; padding: 0 6px; }
.alloc td.num, .alloc th.num { text-align: right; }
.alloc .cell { border: 1px solid var(--a-border); border-radius: 6px; height: 30px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 4px; }
.alloc .cell .u { color: var(--a-text-3); }
.alloc tr.waste td { color: var(--a-text-2); background: hsla(38, 92%, 50%, 0.07); }
.alloc tr.waste .tagw { font-size: 11px; font-weight: 600; color: hsl(32 80% 38%); background: hsla(38, 92%, 50%, 0.16); border-radius: 4px; padding: 1px 6px; }
.alloc tr.tot td { font-weight: 600; border-bottom: 0; }
.link { color: var(--a-primary-hover); font-weight: 500; }
.became .br { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13px; border: 1px solid var(--a-border-subtle); border-radius: 8px; }
.became .br + .br { margin-top: 6px; }
.became .br span:last-child { margin-left: auto; color: var(--a-text-3); font-variant-numeric: tabular-nums; }
.became .br svg.lucide { width: 15px; height: 15px; color: var(--a-icon-2); }
.sec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--a-text-3); }
.kv2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; font-size: 12.5px; }
.kv2 small { display: block; color: var(--a-text-3); font-size: 11.5px; }
.kv2 b { font-weight: 500; font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--a-fg); color: #fff; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; box-shadow: 0 10px 24px rgba(18,35,62,.3); animation: pop2 .3s ease; z-index: 7; }
.toast svg.lucide { color: hsl(162 73% 55%); }
@keyframes pop2 { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }

.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--a-border); display: inline-grid; place-items: center; vertical-align: middle; background: var(--a-surface); }
.cb.on { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.app .cb svg.lucide { width: 12px; height: 12px; stroke-width: 3; }
.selc { font-size: 12.5px; font-weight: 600; color: var(--a-primary-hover); margin-left: 6px; }
.rb.danger { color: var(--a-error-strong); border-color: hsla(348, 81%, 48%, 0.4); }
#reason .choice { padding: 12px; }

/* intro / outro */
.cover { position: absolute; inset: 0; background: rgba(248, 250, 252, 0.88); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 10; }
.cover .card { width: 700px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.cover .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-primary-hover); display: flex; align-items: center; gap: 8px; }
.cover h2 { margin: 0; font-size: 40px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 700; text-wrap: balance; }
.cover p { margin: 0; font-size: 17px; line-height: 1.55; color: var(--a-text-2); max-width: 620px; }
.cover .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.cover .chips code { font-family: var(--mono); font-size: 14px; padding: 5px 10px; border-radius: 6px; background: var(--a-surface); border: 1px solid var(--a-border); }
.cover .cta { display: flex; gap: 10px; margin-top: 8px; }
.cover .go { font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding-inline: 20px; border-radius: 8px; border: 0; background: var(--a-primary); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.cover .go.sec { background: var(--a-surface); color: var(--a-fg); border: 1px solid var(--a-border); }
.cover .go:hover { background: var(--a-primary-hover); }
.cover .go.sec:hover { background: var(--a-muted-solid); }
.cover .go svg.lucide { width: 18px; height: 18px; }
.cover .go:focus-visible { outline: 3px solid var(--a-primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <div class="head">
    <div class="brand" id="brand"></div>
    <div class="tag">Interactive demo · Web console</div>
  </div>

  <div class="frame">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url"><i data-lucide="lock"></i><span id="url">app.respark.com</span></div>
      <div style="width:42px"></div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="stage" id="stage">
      <div class="canvas" id="canvas"></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </div>

  <div class="caption" id="caption" aria-live="polite"></div>

  <div class="controls">
    <button class="btn" id="back" type="button"><i data-lucide="arrow-left"></i>Back</button>
    <div class="pips" id="pips" role="tablist" aria-label="Demo steps"></div>
    <span class="count" id="count"></span>
    <button class="btn primary" id="next" type="button">Next<i data-lucide="arrow-right"></i></button>
  </div>
  <div class="hint">Click the pulsing dot, or use <kbd>←</kbd> <kbd>→</kbd></div>
</div>

<script>
(() => {
  const W = 1440, H = 820;
  const MARK = '<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M152.38 13.33C171.29 13.33 186.67 28.71 186.67 47.62V152.38C186.67 171.29 171.29 186.67 152.38 186.67H47.62C28.71 186.67 13.33 171.29 13.33 152.38V47.62C13.33 28.71 28.71 13.33 47.62 13.33H152.38ZM152.38 0H47.62C21.32 0 0 21.32 0 47.62V152.38C0 178.68 21.32 200 47.62 200H152.38C178.68 200 200 178.68 200 152.38V47.62C200 21.32 178.68 0 152.38 0Z" fill="#00C9D4"/><path d="M93.39 62.1C89.98 59.66 84.7 58.7 80.99 58.69L26.11 58.74L44.28 71.71H82.53C83.21 71.71 83.79 71.96 84.24 72.29C85.21 72.98 85.5 74.27 84.5 75.67L72.84 92.1L84.25 100.24L96.2 83.46C101.27 76.35 101.05 67.54 93.42 62.1L93.4 62.08Z" fill="currentColor"/><path d="M49.21 102.91C53.53 102.91 58.53 105.26 61.64 107.48L107.62 140.38H84.65L52.58 117.49C52.03 117.05 51.38 116.94 50.8 116.94C49.57 116.94 48.56 117.84 48.56 119.62L48.53 140.38H34.11V119.16C34.11 110.16 39.55 102.91 49.19 102.91Z" fill="currentColor"/><path d="M166.27 115.45V103.76C166.27 96.91 164.14 91.42 159.86 87.3C155.58 83.18 149.91 81.1 142.82 81.1H133.49C128.74 81.1 124.57 82.06 120.95 83.97C117.32 85.88 114.54 88.56 112.55 92.02C110.56 95.49 109.58 99.5 109.58 104.01V119.65C109.58 123.94 110.56 127.7 112.55 130.98C114.54 134.26 117.3 136.82 120.92 138.62C124.55 140.39 128.72 141.3 133.46 141.3H142.32C149.41 141.3 155.11 139.5 159.47 135.92C163.83 132.34 166.02 127.59 166.02 121.67H152.85C152.85 124.15 151.9 126.15 149.99 127.68C148.08 129.18 145.57 129.95 142.46 129.95H133.49C130.3 129.95 127.76 128.99 125.85 127.14C123.94 125.26 122.99 122.77 122.99 119.66V115.46H166.27ZM122.72 105.4V104.34C122.72 100.76 123.7 97.84 125.69 95.63C127.65 93.42 130.24 92.3 133.43 92.3H142.89C145.94 92.3 148.37 93.36 150.25 95.47C152.13 97.57 153.06 100.36 153.06 103.77V105.41H122.71Z" fill="currentColor"/></svg>';
  document.getElementById('brand').innerHTML = MARK + '<span>ReSpark</span>';

  const ic = (n, extra = '') => `<i data-lucide="${n}" ${extra}></i>`;

  // Sample data (illustrative). Add Cost at $0.04/lb layers baling and
  // freight cost found after the fact onto two in-stock tags.
  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const lb = v => v.toLocaleString('en-US') + ' lb';
  const RATE = 0.04;
  const FGS = [
    { id: 'FG-2204', mat: '6063 Extrusion', w: 2480, cost: 2628.80, st: 'In stock' },
    { id: 'FG-2201', mat: 'Aluminum Cans (UBC)', w: 3100, cost: 1612.00, st: 'In stock', sel: true },
    { id: 'FG-2195', mat: 'Painted Siding', w: 2240, cost: 1747.20, st: 'In stock', sel: true },
    { id: 'FG-2198', mat: 'Clean Aluminum Wheels', w: 1960, cost: 1999.20, st: 'In stock' },
    { id: 'FG-2192', mat: 'Old Sheet', w: 2850, cost: 1738.50, st: 'In stock' },
    { id: 'FG-2190', mat: 'Litho Plates', w: 1480, cost: 1391.20, st: 'Shipped' },
  ];
  const SEL = FGS.filter(f => f.sel);
  const added = f => Math.round(RATE * f.w * 100) / 100;
  const CAS = [
    { type: 'Set Value', rate: '$0.4800 / lb', tags: 4, date: 'Sep 30, 2026', delta: -312.40, by: 'Jordan Pike', st: 'Active' },
    { type: 'Add Cost', rate: '$0.0250 / lb', tags: 6, date: 'Sep 18, 2026', delta: 291.75, by: 'Morgan Lee', st: 'Active' },
    { type: 'Add Cost', rate: '$0.0300 / lb', tags: 2, date: 'Sep 9, 2026', delta: 128.40, by: 'Jordan Pike', st: 'Voided' },
    { type: 'Set Value', rate: '$0.5100 / lb', tags: 3, date: 'Aug 29, 2026', delta: -186.60, by: 'Morgan Lee', st: 'Active' },
  ];
  const NEW_CA = { type: 'Add Cost', rate: '$0.0400 / lb', tags: 2, date: 'Oct 13, 2026', delta: SEL.reduce((a, f) => a + added(f), 0), by: 'Jordan Pike', st: 'Active' };
  const signed = v => (v < 0 ? '−' : '+') + money(Math.abs(v));

  // ---------- steps ----------
  const STEPS = [
    { view: 'fg', cover: 'intro', url: '/app/inventory/finished-goods' },
    { view: 'ov', t: '#nav-fg', place: 'right', url: '/app/inventory/overview',
      tip: 'Go to <b>Inventory → Finished Goods</b>.' },
    { view: 'fg', picked: true, t: '#sel', place: 'bottom', url: '/app/inventory/finished-goods',
      tip: 'Select the tags you want to fix. You can pick one or many at once.' },
    { view: 'fg', picked: true, t: '#btn-adj', place: 'bottom', url: '/app/inventory/finished-goods',
      tip: 'Click <b>Adjust Cost</b>.' },
    { view: 'fg', picked: true, drawer: 'adj', t: '#reason', place: 'left', url: '/app/inventory/finished-goods',
      tip: 'Pick <b>Add Cost</b> to layer on processing or burden cost you found after the fact, or <b>Set Value</b> to write the tags down to a specific number.' },
    { view: 'fg', picked: true, drawer: 'adj', filled: true, t: '#inputs', place: 'left', url: '/app/inventory/finished-goods',
      tip: 'Enter the rate per pound, an effective date in an open period, and a note explaining the change.' },
    { view: 'fg', picked: true, drawer: 'adj', filled: true, t: '#preview', place: 'left', url: '/app/inventory/finished-goods',
      tip: 'Check the resulting cost for each tag. It’s calculated live, before you save anything.' },
    { view: 'fg', picked: true, drawer: 'adj', filled: true, t: '#btn-save', place: 'top', url: '/app/inventory/finished-goods',
      tip: 'Save the adjustment. The tags keep their ties to packing lists, contracts and BOLs.' },
    { view: 'ca', saved: true, t: '#row-new', place: 'bottom', url: '/app/inventory/cost-adjustments',
      tip: 'Every adjustment is listed under <b>Inventory → Cost Adjustments</b>, so you have a full history.' },
    { view: 'ca', saved: true, drawer: 'cad', t: '#btn-void', place: 'top', url: '/app/inventory/cost-adjustments',
      tip: 'Open one to review it. If it was a mistake, click <b>Void</b> to reverse it.' },
    { view: 'ca', saved: true, drawer: 'cad', cover: 'outro', url: '/app/inventory/cost-adjustments' },
  ];

  // ---------- chrome ----------
  function sidebar(active) {
    const row = (i, l, extra = '') => `<div class="nrow">${ic(i)}<span>${l}</span>${extra || ic('chevron-right', 'class="chev"')}</div>`;
    const sub = (id, l) => `<div class="nrow sub${active === id ? ' active' : ''}" id="nav-${id}"><span>${l}</span></div>`;
    return `<aside class="side">
      <div class="top">${MARK}<div class="yard"><span>North Yard</span>${ic('chevrons-up-down')}</div></div>
      <div class="nav">
        ${row('inbox', 'Inbox', '<span class="pill">4</span>')}
        ${row('messages-square', 'ScrapChat', ' ')}
        <div class="cmd" style="margin:2px 0">${ic('search')}<span>Search &amp; actions</span><kbd>⌘K</kbd></div>
        <div class="nsep"></div>
        ${row('shopping-cart', 'Purchases')}${row('tag', 'Sales')}${row('file-text', 'Contracts')}
        <div class="nrow">${ic('boxes')}<span>Inventory</span>${ic('chevron-down', 'class="chev"')}</div>
        ${sub('ov', 'Inventory Overview')}${sub('hl', 'Holding Lots')}${sub('pk', 'Packages')}${sub('rg', 'Regrades')}${sub('fg', 'Finished Goods')}${sub('adj', 'Adjustments')}${sub('ca', 'Cost Adjustments')}${sub('pic', 'Physical Inventory Count')}
        ${row('users', 'Customers')}${row('layers', 'Commodities')}${row('truck', 'Logistics')}${row('clipboard-list', 'Load Board')}${row('warehouse', 'Assets')}${row('chart-column', 'Reports')}${row('landmark', 'Ledger')}
      </div>
      <div class="foot"><div class="av">JP</div><div class="who"><span>Jordan Pike</span><small>General Manager</small></div>
        <div class="ico"><span>${ic('settings')}</span><span>${ic('circle-help')}</span></div></div>
    </aside>`;
  }

  const head = (crumbs, title, acts) => `<div class="phead"><div class="left"><div class="crumbs">${crumbs.map(c => `<span>${c}</span>`).join(ic('chevron-right'))}</div><h1>${title}</h1></div><div class="acts">${acts}</div></div>`;

  function overview() {
    const rows = [['Aluminum Cans (UBC)', 'AL-UBC', 48220, 21600, 64800], ['6063 Extrusion', 'AL-6063', 22480, 9840, 31200], ['Old Sheet', 'AL-OSH', 61940, 0, 18400],
      ['Cast Aluminum', 'AL-CST', 39310, 12200, 0], ['Painted Siding', 'AL-SID', 14870, 4100, 8600], ['Clean Aluminum Wheels', 'AL-WHL', 9630, 6040, 12480], ['Litho Plates', 'AL-LTH', 6210, 0, 4960]];
    return `<main class="main">${head(['Inventory', 'Inventory Overview'], 'Inventory Overview', `<span class="rb">${ic('plus')}Finished Good</span><span class="rb">${ic('plus')}Package</span><span class="rb pri">${ic('plus')}Add Adjustment</span>`)}
      <div class="ibody">
        <div class="kpis"><div><small>WIP inventory</small><b>$194,166</b><span>300,770 lb</span></div><div><small>FG inventory</small><b>$102,092</b><span>140,440 lb</span></div><div><small>Total inventory</small><b>$296,258</b><span>441,210 lb</span></div><div><small>Expected inventory</small><b>$38,940</b><span>52,300 lb</span></div></div>
        <div class="tcard"><div class="tt"><div class="inp">${ic('search')}Search</div><span class="cnt">10 materials</span></div>
          <table class="itab"><thead><tr><th style="width:26%">Material</th><th>Material Code</th><th class="num">Loose WIP (lb)</th><th class="num">Packaged WIP (lb)</th><th class="num">Finished Goods (lb)</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td><span class="link">${r[0]}</span></td><td>${r[1]}</td><td class="num">${r[2].toLocaleString()}</td><td class="num">${r[3].toLocaleString()}</td><td class="num">${r[4].toLocaleString()}</td></tr>`).join('')}</tbody></table></div>
      </div></main>`;
  }

  function finishedGoods(s) {
    const row = f => {
      const on = s.picked && f.sel;
      return `<tr${on ? ' class="new"' : ''}><td><span class="cb${on ? ' on' : ''}">${on ? ic('check') : ''}</span></td><td class="mono">${f.id}</td><td>${f.mat}</td><td class="num">${lb(f.w)}</td><td class="num">${money(f.cost)}</td><td><span class="badge ${f.st === 'Shipped' ? 'b-neutral' : 'b-success'}">${f.st}</span></td></tr>`;
    };
    // Selected tags sit together in their own tbody so the step can point at them as one block.
    const top = FGS.slice(0, 1), picked = FGS.slice(1, 3), rest = FGS.slice(3);
    const bar = s.picked
      ? `<span class="selc">${SEL.length} selected</span><span class="rb" id="btn-adj">${ic('dollar-sign')}Adjust Cost</span>`
      : '';
    return `<main class="main">${head(['Inventory', 'Finished Goods'], 'Finished Goods', `<span class="rb pri">${ic('plus')}Finished Good</span>`)}
      <div class="ibody">
        <div class="tcard"><div class="tt"><div class="inp">${ic('search')}Search finished goods</div>${bar}<span class="cnt">${FGS.length} finished goods</span></div>
          <table class="itab"><thead><tr><th style="width:44px"><span class="cb"></span></th><th style="width:12%">Tag</th><th style="width:28%">Material</th><th class="num">Weight</th><th class="num">Cost</th><th>Status</th></tr></thead>
          <tbody>${top.map(row).join('')}</tbody><tbody id="sel">${picked.map(row).join('')}</tbody><tbody>${rest.map(row).join('')}</tbody></table></div>
      </div>${drawer(s)}</main>`;
  }

  function costAdjustments(s) {
    const list = s.saved ? [NEW_CA, ...CAS] : CAS;
    const rows = list.map(c => `<tr${c === NEW_CA ? ' class="new" id="row-new"' : ''}><td>${c.date}</td><td><span class="badge ${c.type === 'Add Cost' ? 'b-teal' : 'b-accent'}">${c.type}</span></td><td class="num">${c.rate}</td><td class="num">${c.tags}</td><td class="num">${signed(c.delta)}</td><td>${c.by}</td><td><span class="badge ${c.st === 'Voided' ? 'b-neutral' : 'b-success'}">${c.st}</span></td></tr>`).join('');
    return `<main class="main">${head(['Inventory', 'Cost Adjustments'], 'Cost Adjustments', '')}
      <div class="ibody">
        <div class="tcard"><div class="tt"><div class="inp">${ic('search')}Search cost adjustments</div><span class="cnt">${list.length} adjustments</span></div>
          <table class="itab"><thead><tr><th style="width:14%">Effective date</th><th style="width:13%">Type</th><th class="num">Rate</th><th class="num" style="width:8%">Tags</th><th class="num">Cost change</th><th>Created by</th><th style="width:11%">Status</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${s.saved && !s.drawer ? `<div class="toast">${ic('circle-check')}Cost adjustment saved for 2 tags</div>` : ''}
      </div>${drawer(s)}</main>`;
  }

  function drawer(s) {
    if (!s.drawer) return '';
    const prev = STEPS[step - 1];
    const still = prev && prev.drawer && prev.view === s.view ? ' still' : '';
    const shell = (title, body, foot) => `<div class="drawer${still}"><div class="dh"><h3>${title}</h3><span class="x">${ic('x')}</span></div><div class="db">${body}</div>${foot ? `<div class="df">${foot}</div>` : ''}</div>`;
    if (s.drawer === 'adj') {
      const f = s.filled;
      const lines = SEL.map(t => `<tr><td><span class="mono">${t.id}</span></td><td class="num">${lb(t.w)}</td><td class="num">${money(t.cost)}</td><td class="num"><b>${money(f ? t.cost + added(t) : t.cost)}</b></td></tr>`).join('');
      const cur = SEL.reduce((a, t) => a + t.cost, 0), res = SEL.reduce((a, t) => a + t.cost + (f ? added(t) : 0), 0);
      return shell('Adjust Cost', `
        <div class="sec">Reason</div>
        <div class="row2" id="reason">
          <div class="choice on"><span class="ci">${ic('plus')}</span><div><b>Add Cost</b><small>Add an amount on top of the current cost.</small></div></div>
          <div class="choice"><span class="ci">${ic('target')}</span><div><b>Set Value</b><small>Set the tag’s total cost to a target.</small></div></div>
        </div>
        <div id="inputs" style="display:flex;flex-direction:column;gap:12px">
          <div class="row2">
            <div class="fld"><label>Rate</label><div class="in${f ? '' : ' ph'}">${f ? '$0.0400' : '$0.0000'}<span class="u">/ lb</span></div></div>
            <div class="fld"><label>Effective date</label><div class="in${f ? '' : ' ph'}">${f ? 'Oct 13, 2026' : 'Select a date'}${ic('calendar')}</div></div>
          </div>
          <div class="fld"><label>Notes</label><div class="in${f ? '' : ' ph'}">${f ? 'Baling labor and freight to processor' : 'Why is this cost changing?'}</div></div>
        </div>
        <div id="preview">
          <table class="alloc"><thead><tr><th style="width:26%">Tag</th><th class="num">Weight</th><th class="num">Current cost</th><th class="num">Resulting cost</th></tr></thead><tbody>
            ${lines}
            <tr class="tot"><td>Total</td><td class="num">${lb(SEL.reduce((a, t) => a + t.w, 0))}</td><td class="num">${money(cur)}</td><td class="num">${money(res)}</td></tr>
          </tbody></table>
        </div>`,
        `<span class="rb">Cancel</span><span class="rb pri" id="btn-save">${ic('check')}Save</span>`);
    }
    if (s.drawer === 'cad') {
      return shell(`Add Cost <span class="badge b-success" style="vertical-align:2px;margin-left:6px">Active</span>`, `
        <div class="kv2"><div><small>Reason</small><b>Add Cost</b></div><div><small>Rate</small><b>$0.0400 / lb</b></div>
          <div><small>Effective date</small><b>Oct 13, 2026</b></div><div><small>Created by</small><b>Jordan Pike</b></div></div>
        <div class="kv2" style="grid-template-columns:1fr"><div><small>Notes</small><b>Baling labor and freight to processor</b></div></div>
        <div class="sec">Tags</div>
        <table class="alloc"><thead><tr><th style="width:26%">Tag</th><th>Material</th><th class="num">Cost change</th></tr></thead><tbody>
          ${SEL.map(t => `<tr><td><span class="link mono">${t.id}</span></td><td>${t.mat}</td><td class="num">${signed(added(t))}</td></tr>`).join('')}
          <tr class="tot"><td>Total</td><td></td><td class="num">${signed(NEW_CA.delta)}</td></tr>
        </tbody></table>`,
        `<span class="rb">Close</span><span class="rb danger" id="btn-void">${ic('ban')}Void</span>`);
    }
    return '';
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('dollar-sign')}Inventory · Now live for everyone</div>
        <h2>Fix a finished good’s cost without deleting the tag</h2>
        <p>Adjust the cost of one or many finished goods right from the Finished Goods list, and the tags keep their ties to packing lists, contracts and BOLs.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}Finished good cost updates</div>
      <h2>Correct the cost, keep the tag</h2>
      <p>Use <b>Add Cost</b> for cost you couldn’t know at the time, or <b>Set Value</b> to write a tag down. You see the result before you save, and every change can be reviewed or voided in <b>Cost Adjustments</b>. Voided tags can’t be adjusted, and a <b>Set Value</b> on a shipped tag has to be dated before it shipped.</p>
      <div class="cta"><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button><a class="go sec" href="https://intercom.help/greenspark-software/en/articles/6387729-create-and-manage-finished-goods" target="_blank" rel="noopener">${ic('book-open')}Read the full guide</a></div>
    </div></div>`;
  }

  function renderApp(s) {
    const view = s.view === 'ov' ? overview() : s.view === 'ca' ? costAdjustments(s) : finishedGoods(s);
    return `<div class="app">${sidebar(s.view)}${view}${s.cover ? cover(s.cover) : ''}</div>`;
  }
  function anchorMenus() {}

  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Fix a finished good’s cost from the Finished Goods list without deleting the tag.'
      : '<span class="n">Done</span>Add Cost or Set Value, check the result, and review or void it in Cost Adjustments. Read the full guide in the help center.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
