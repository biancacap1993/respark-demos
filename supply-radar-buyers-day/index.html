<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of ReSpark Supply Radar (Prospect Tracker: the Today tab and a
   prospect's check-in); a pulsing hotspot + tooltip guides each step; step controls sit
   under the frame. The app mock keeps ReSpark's light theme (it stands in
   for a screenshot); the page around it follows the viewer's theme.
   Screens follow greenspark-aws, branch feature/supply-radar-v2-12-local-e2e,
   frontend/client/src/modules/supply-radar/_components:
     RadarAccessPage; prospects/today/{RadarTodayPage, TodayHeader, TodaySummaryStrip,
     TodayTasksSection, TodayTaskRow, TodayTaskToolbar, TodayCard, TodayOpportunitySection,
     TodayOpportunityRow, TodayNearbySection}; prospects/{ProspectSections, ProspectHeader};
     prospects/prospect-header/{StageTrack, HeaderActions}; prospects/check-in/{CheckInButton,
     CheckInPage, CheckInLocationBanner, CheckInChoice}; prospects/activity-timeline/
     {ActivityTimeline, TimelineEntry}; plus _state/check-in-state.ts. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 22px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.crumbs { font-size: 12px; color: var(--a-text-3); display: flex; align-items: center; gap: 4px; }
.crumbs svg.lucide { width: 12px; height: 12px; }
.phead h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.phead .left { display: flex; flex-direction: column; gap: 4px; }
.phead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.icon { width: 32px; padding: 0; justify-content: center; }
.badge { display: inline-flex; align-items: center; height: 20px; padding-inline: 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.b-success { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.b-accent { background: hsla(252, 89%, 65%, 0.14); color: var(--a-accent-strong); }
.b-neutral { background: hsla(217, 55%, 16%, 0.07); color: var(--a-text-2); }


/* ================= Supply Radar (modules/supply-radar) ================= */
:root {
  --a-warning: hsl(38 92% 50%);
  --a-warning-strong: hsl(32 90% 36%);
  --a-info: hsl(210 80% 48%);
  --st-new: #64748b; --st-contacted: #d97706; --st-qualified: #15803d;
}
.nrow.grp { font-weight: 600; }
.nrow.grp .chev { transform: rotate(90deg); }

/* module header (RadarAccessPage: AppFrame.Header + RadarNav) */
.rhead { height: 56px; flex-shrink: 0; display: flex; align-items: stretch; gap: 32px; padding-inline: 20px; border-bottom: 1px solid var(--a-border-subtle); }
.rhead h1 { margin: 0; align-self: center; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.rtabs { display: flex; gap: 4px; }
.rtabs span { display: flex; align-items: center; padding-inline: 12px; font-weight: 500; color: var(--a-text-2); border-bottom: 2px solid transparent; }
.rtabs span.on { color: var(--a-primary-hover); border-bottom-color: var(--a-primary); }
.rhead .ra { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.rb.lg { height: 38px; font-size: 14px; padding-inline: 14px; font-weight: 600; }
.rb.ghost { border-color: transparent; background: transparent; }
.rb[disabled] { opacity: .5; }

/* Today (prospects/today/*) */
.today { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 0; }
.thead { display: flex; align-items: flex-end; gap: 12px; }
.thead .tl { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.thead h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.thead p { margin: 0; font-size: 14px; color: var(--a-text-2); }
.sel { height: 38px; min-width: 190px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 10px; font-size: 13px; background: var(--a-surface); }
.sel .pre { color: var(--a-text-3); }
.sel svg.lucide { margin-left: auto; color: var(--a-icon-2); width: 14px; height: 14px; }
.tcard { border: 1px solid var(--a-border); border-radius: 12px; background: var(--a-surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

.strip .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.gch { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding-inline: 9px; border-radius: 6px; font-weight: 500; font-size: 13px; background: var(--a-hover); }
.gch svg.lucide { width: 13px; height: 13px; color: var(--a-icon-2); }
.gch.err { background: hsla(348, 81%, 48%, 0.10); color: var(--a-error); }
.gch.err svg.lucide { color: var(--a-error); }
.prog { height: 8px; border-radius: 999px; background: var(--a-hover); margin-top: 8px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--a-primary); border-radius: 999px; }
.tcols { flex: 1; min-height: 0; display: flex; gap: 14px; align-items: flex-start; }
.tcols .lc { flex: 1; min-width: 0; }
.tcols .rc { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
.ch { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.ch .ic { height: 26px; display: flex; align-items: center; }
.ch .ic svg.lucide { width: 20px; height: 20px; }
.ch .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ch .tt .r { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.ch h4 { margin: 0; font-size: 16px; font-weight: 600; }
.ch h4.lg { font-size: 18px; }
.ch .tt p { margin: 0; font-size: 12.5px; color: var(--a-text-2); }
.cnt { display: inline-flex; align-items: center; height: 19px; padding-inline: 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: hsla(217, 55%, 16%, 0.07); color: var(--a-text-2); }
.cnt.err { background: hsla(348, 81%, 48%, 0.12); color: var(--a-error); }
.ulink { color: var(--a-primary-hover); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.ulink svg.lucide { width: 14px; height: 14px; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.srch { height: 32px; width: 210px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 9px; color: var(--a-text-3); font-size: 12.5px; }
.srch svg.lucide { width: 14px; height: 14px; }
.cb { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.cb i { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--a-border); display: inline-block; }
.cb i.on { background: var(--a-primary); border-color: var(--a-primary); }
.glabel { display: flex; align-items: center; gap: 8px; min-height: 30px; color: var(--a-primary-hover); font-weight: 600; font-size: 14px; }
.glabel.err { color: var(--a-error); }
.glabel svg.lucide { width: 15px; height: 15px; }
.rows > * + * { border-top: 1px solid var(--a-border-subtle); }
.trow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
.trow .cbx { margin-top: 9px; }
.tbox { width: 72px; flex-shrink: 0; border-radius: 6px; background: var(--a-muted-solid); padding: 9px 4px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--a-text-2); }
.tbox.late { background: hsla(348, 81%, 48%, 0.10); color: var(--a-error); }
.trow .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.trow .t1 { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; }
.trow .t1 svg.lucide { width: 15px; height: 15px; color: var(--a-text-3); }
.trow .t2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--a-text-2); flex-wrap: wrap; }
.plink { color: var(--a-primary-hover); font-weight: 500; }
.trow .t2 small { font-size: 11.5px; color: var(--a-text-3); }
.trow .acts { display: flex; align-items: center; gap: 4px; }
.chip { display: inline-flex; align-items: center; height: 21px; padding-inline: 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; }
.chip.new { background: hsla(215, 16%, 47%, 0.13); color: hsl(215 19% 35%); }
.chip.contacted { background: hsla(38, 92%, 50%, 0.16); color: var(--a-warning-strong); }

.bwarn { display: inline-flex; align-items: center; height: 20px; padding-inline: 7px; border-radius: 999px; font-size: 11px; font-weight: 500; background: hsla(38, 92%, 50%, 0.16); color: var(--a-warning-strong); }
.nowln { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--a-primary-hover); font-size: 12.5px; font-weight: 500; }

.orow { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 5px 0; }

.orow .bd span.s { font-size: 12.5px; color: var(--a-text-2); }
.orow .bd span.w { font-size: 12.5px; color: var(--a-warning-strong); }
.orow .mi { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rc .rows { border-top: 1px solid var(--a-border-subtle); }
.rc .tcard { padding: 10px 14px; gap: 6px; }

  ];
  const TIMED = [
    { id: 'visit', type: 'Visit', title: 'Walk the shop and count the bins', p: PROSPECT, st: 'New', box: '10:30 AM', meta: '6 t/mo · Aluminum' },
    { type: 'Email', title: 'Send pickup schedule', p: 'Coastal Demolition', st: 'Qualified', box: '1:00 PM', meta: '40 t/mo · Steel' },
    { type: 'Text', title: 'Text', p: 'Pine Street Auto Repair', st: 'Contacted', box: '3:30 PM', meta: '3 t/mo · Mixed metals' },
  ];
  const ANYTIME = [
    { type: 'Call', title: 'Call', p: 'Kessler Tool & Die', st: 'New', box: 'Any time', meta: '' },
  ];

  function taskRow(t) {
    const log = t.type === 'Other' ? 'activity' : t.type.toLowerCase();
    return `<div class="trow"><span class="cbx"></span>
      <span class="tbox${t.late ? ' late' : ''}">${t.box}</span>
      <div class="bd">
        <div class="t1">${ic(TYPE_ICON[t.type])}<span>${t.title}</span></div>
        <div class="t2"><span class="plink"${t.id === 'visit' ? ' id="visit-link"' : ''}>${t.p}</span><span>North Yard</span>${t.was ? `<small>${t.was}</small>` : ''}</div>
        <div class="t2">${chip(t.st)}${t.meta ? `<small>${t.meta}</small>` : ''}</div>
      </div>
      <div class="acts"><span class="rb out">Log ${log}</span>${t.late ? '<span class="rb out ghost">Reschedule</span>' : ''}<span class="rb icon ghost">${ic('ellipsis-vertical')}</span></div>
    </div>`;
  }

  function today() {
    const header = `<div class="rhead"><h1>Supply Radar</h1>
      <div class="rtabs"><span class="on">Today</span><span>Explore</span><span>Pipeline</span><span>Reports</span></div>
      <div class="ra"><span class="rb icon">${ic('settings')}</span><span class="rb icon">${ic('refresh-cw')}</span><span class="rb">${ic('plus')}Add prospect</span></div></div>`;
    const top = `<div class="thead"><div class="tl"><h2>Today’s priorities</h2><p>Tuesday, Nov 3 · North Yard</p></div>
      <div class="sel"><span class="pre">Assigned to:</span><span>Me</span>${ic('chevron-down')}</div>
      <span class="rb pri lg" id="plan-route">${ic('map-pin')}Plan route</span></div>`;
    const strip = `<section class="tcard strip" id="sum">
      <div><h3>Today</h3><div class="chips"><span class="gch">1 of 6 done${ic('chevron-right')}</span><span class="gch err">1 late${ic('chevron-right')}</span></div><div class="prog"><i style="width:17%"></i></div></div>
      <div><h3>Needs attention</h3><div class="chips"><span class="gch">2 no tasks planned${ic('chevron-right')}</span><span class="gch">2 stale or close${ic('chevron-right')}</span></div></div>
      <div><h3>This week</h3><div class="chips"><span class="gch">14 touches${ic('arrow-up')} from 9 last week${ic('chevron-right')}</span><span class="gch">Qualified 2${ic('chevron-right')}</span></div></div>
    </section>`;
    const glabel = (icon, l, n, err) => `<div class="glabel${err ? ' err' : ''}">${ic(icon)}<span>${l}</span><span class="cnt${err ? ' err' : ''}">${n}</span></div>`;
    const myday = `<section class="tcard" id="myday">
      <div class="ch"><div class="tt"><div class="r"><h4 class="lg">My Day</h4><span class="cnt">5</span></div></div>
        <div class="toolbar"><span class="srch">${ic('search')}Search tasks or prospects</span><span class="cb"><i></i>Show done</span><span class="rb out">${ic('sliders-horizontal')}Filters</span></div></div>
      <div>${glabel('clock', 'Carried over', 1, true)}<div class="rows">${CARRIED.map(taskRow).join('')}</div></div>
      <div>${glabel('calendar-clock', 'Today’s schedule', 3)}<div class="nowln"><span>Now 10:12 AM</span><i></i></div><div class="rows">${TIMED.map(taskRow).join('')}</div></div>
      <div>${glabel('sun', 'Anytime today', 1)}<div class="rows">${ANYTIME.map(taskRow).join('')}</div></div>
    </section>`;
    const orow = (name, detail, warn, action) => `<div class="orow"><div class="bd"><span class="plink">${name}</span><span class="${warn ? 'w' : 's'}">${detail}</span></div>${action}</div>`;
    const plan = `<span class="rb out">${ic('plus')}Plan task</span>`;
    const noNext = `<section class="tcard" id="nonext">
      <div class="ch"><span class="ic" style="color:var(--a-warning-strong)">${ic('triangle-alert')}</span><div class="tt"><div class="r"><h4>No tasks planned</h4><span class="cnt">2</span></div><p>Keep each prospect moving</p></div></div>
      <div class="rows">${orow('Summit Roofing Supply', 'Contacted', false, plan)}${orow('Oakridge HVAC', 'New', false, plan)}</div>
    </section>`;
    const near = `<section class="tcard" id="nearby">
      <div class="ch"><span class="ic" style="color:var(--a-primary)">${ic('map-pin')}</span><div class="tt"><div class="r"><h4>Near your route</h4></div><p>Prospects you haven’t visited</p></div><span class="ulink">Open map</span></div>
      <div class="rows">${orow('Millbrook Fabrication', 'New', false, '<span class="mi">0.4 mi</span>')}${orow('Eastgate Auto Salvage', 'Contacted', false, '<span class="mi">1.2 mi</span>')}${orow('Grant Street Electric', 'New', false, '<span class="mi">2.8 mi</span>')}</div>
    </section>`;
    const stale = `<section class="tcard" id="stale">
      <div class="ch"><span class="ic" style="color:var(--a-warning-strong)">${ic('clock')}</span><div class="tt"><div class="r"><h4>Going stale</h4><span class="cnt">2</span></div><p>At their stage limit or within two days</p></div></div>
      <div class="rows">${orow('Ridgeview Contractors', '13 days in Contacted · limit 14', true, plan)}${orow('Marlow Plumbing Supply', '21 days in Qualified · limit 21', true, plan)}</div>
      <span class="ulink">View pipeline${ic('arrow-right')}</span>
    </section>`;
    return `<main class="main">${header}<div class="today">${top}${strip}
      <div class="tcols"><div class="lc">${myday}</div><div class="rc">${noNext}${near}${stale}</div></div></div></main>`;
  }

  // ---------- prospect ----------
  function stageTrack(stage) {
    const steps = ['New', 'Contacted', 'Qualified', 'Won'];
    const color = { New: 'var(--st-new)', Contacted: 'var(--st-contacted)', Qualified: 'var(--st-qualified)', Won: 'var(--a-success)' };
    const cur = steps.indexOf(stage);
    return `<ol class="trk" id="stage-track" aria-label="Stage">${steps.map((s, i) => {
      const reached = i <= cur, isCur = i === cur;
      const ln = i > 0 ? `<span class="ln"${reached ? ` style="background:${color[s]}"` : ''}></span>` : '';
      return `<li>${ln}<span class="dot${reached ? ' fill' : ''}${isCur ? ' cur' : ''}"${reached ? ` style="background:${color[s]}"` : ''}>${i + 1}</span>
        <span class="lb${isCur ? ' cur' : ''}"${reached ? ` style="color:${color[s]}"` : ''}>${i === 3 ? 'Closed' : s}</span>${isCur ? `<span class="dy">${stage === 'New' ? '5 days' : '0 days'}</span>` : ''}</li>`;
    }).join('')}</ol>`;
  }

  function prospect(s) {
    const stage = s.saved ? 'Contacted' : 'New';
    const next = stage === 'New' ? 'Mark contacted' : 'Mark qualified';
    const head = `<header class="phd"><div class="r1">
        <span class="bk">${ic('arrow-left')}</span>
        <div class="nm"><div class="a"><h2>${PROSPECT}</h2><span class="badge b-neutral">Business</span><span class="badge b-neutral">Machine shop</span></div>
          <div class="meta"><span>${ic('map-pin')}Main shop, 1420 Foundry Rd</span><span>${ic('user-round')}Jordan Pike</span></div></div>
        ${stageTrack(stage)}
        <div style="display:flex;gap:8px;align-items:center"><span class="rb" id="checkin">${ic('map-pin')}Check in</span>
          <span class="splitb"><span class="rb pri">${next}</span><span class="rb pri">${ic('chevron-down')}</span></span>
          <span class="rb icon ghost">${ic('ellipsis')}</span></div>
      </div>
      <div class="ptabs"><span${s.saved ? '' : ' class="on"'}>Overview</span><span>Opportunities (1)</span><span>Locations (1)</span><span${s.saved ? ' class="on"' : ''}>Timeline</span></div></header>`;
    const overview = `<div class="ovw">
      <div class="col">
        <section class="ocard"><div class="hd"><h3>Contacts</h3><span class="ulink">${ic('plus')}Add</span></div>
          <div class="ctc"><b>Dana Ruiz <span class="badge b-accent">Primary Contact</span></b><small>Shop manager · (555) 014-2290</small></div></section>
        <section class="ocard"><div class="hd"><h3>Company details</h3><span class="ulink">Edit</span></div>
          <dl class="facts"><div><dt>Website</dt><dd>deltafab.example</dd></div><div><dt>Business type</dt><dd>Machine shop</dd></div>
          <div><dt>Main commodity</dt><dd>Aluminum</dd></div><div><dt>Estimated volume</dt><dd>6 t/mo</dd></div></dl></section>
      </div>
      <div class="col">
        <section class="ocard"><div class="hd"><h3 style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--a-primary-hover)">Next step</h3></div>
          <div class="nst"><span class="ci">${ic('map-pin')}</span><div><b>Walk the shop and count the bins</b><p>Visit · 10:30 · Due Tuesday, Nov 3 · owner: you</p></div></div>
          <div class="pbook"><small>Playbook</small><p>Visit the site. Count the bins and ask who hauls their scrap today.</p></div>
          <div><span class="rb">Reschedule</span></div></section>
      </div></div>`;
    const entry = (id, tone, icon, time, title, body) => `<li class="tle"${id ? ` id="${id}"` : ''}><span class="av2 ${tone}">${ic(icon)}</span>
      <div class="bd"><div class="mt"><span>${time}</span><span>·</span><span>Jordan Pike (Buyer)</span></div><h5>${title}</h5>${body}</div>
      <span class="det">Details${ic('chevron-right')}</span></li>`;
    const timeline = `<div class="tlw"><h3>Activity history · 4 entries</h3>
      <div><span class="seg"><span class="on">All</span><span>Activities</span><span>Changes</span><span>Tasks</span></span></div>
      <div class="tlbox"><h4 class="day">Nov 3, 2026</h4><ol>
        ${entry('', 'info', 'calendar-check', '11/3/2026, 10:58:40 AM', 'Task planned', '')}
        ${entry('', 'neutral', 'arrow-right-left', '11/3/2026, 10:58:39 AM', 'Stage changed', `<div class="chg">${chip('New')}<span>→</span>${chip('Contacted')}</div>`)}
        ${entry('tl-visit', 'primary', 'message-square', '11/3/2026, 10:58:39 AM', 'Visit', '<p>Met the contact. Dana walked me through the shop. About 6 tons a month of aluminum turnings and cut-offs, picked up once a month. Open to a second quote.</p>')}
      </ol><h4 class="day">Oct 29, 2026</h4><ol>
        ${entry('', 'neutral', 'target', '10/29/2026, 2:14:05 PM', 'Opportunity created', '')}
      </ol></div></div>`;
    return `<main class="main"><div class="prs">${head}${s.saved ? timeline : overview}</div></main>`;
  }

  // ---------- check-in dialog ----------
  function checkIn(s) {
    const k = s.ci;
    const choice = (l, on, id) => `<div class="choice${on ? ' on' : ''}"${id ? ` id="${id}"` : ''}><i></i>${l}</div>`;
    const outcomes = ['Met the contact', 'Left a price card', 'Nobody there', 'Not interested'];
    const nexts = ['Call in 1 week', 'Visit in 2 weeks', 'Pick a date', 'None'];
    const outcome = k >= 1 ? 'Met the contact' : null;
    const nextSel = k >= 2 ? 'Visit in 2 weeks' : 'None';
    const notes = k >= 3
      ? '<div class="ta">Dana walked me through the shop. About 6 tons a month of aluminum turnings and cut-offs, picked up once a month. Open to a second quote.</div>'
      : '<div class="ta ph">Add details from your visit</div>';
    return `<div class="scrim"><div class="dlg" role="dialog" aria-label="Check in">
      <div class="dh"><div class="tt"><h3>Check in</h3><p>Log how the visit went and plan the next step.</p></div><span class="x">${ic('x')}</span></div>
      <div class="db">
        <div class="cih"><div class="a"><h2>${PROSPECT}</h2>${chip('New')}</div><span>Main shop · 1420 Foundry Rd, Lakeport, TX</span><p>Check-in started at 10:38 AM</p></div>
        <div class="lban" id="ci-banner" role="status">${ic('map-pin-check')}<div><b>Location confirmed</b><span>0.1 mi from the pin</span></div></div>
        <section class="visit" aria-label="Visit">
          <div class="c">
            <div id="ci-outcome"><h4>How did it go?</h4><p class="sub">Select one outcome.</p>
              <div class="grid2">${outcomes.map(o => choice(o, o === outcome)).join('')}</div></div>
            <div class="notes" id="ci-notes"><div class="lr"><label>Notes <small>Optional</small></label><span class="dict">${ic('mic')}Dictate</span></div>${notes}</div>
          </div>
          <div class="c">
            <div id="ci-next"><h4>Next step</h4><div class="grid2">${nexts.map(o => choice(o, o === nextSel)).join('')}</div></div>
            <div class="mv"><span class="cb"><i></i>Move to Contacted</span><small>Current stage: New</small></div>
          </div>
        </section>
      </div>
      <div class="df"><span class="rb">Cancel</span><span class="rb pri" id="ci-save"${outcome ? '' : ' disabled'}>Save visit</span></div>
    </div></div>`;
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('radar')}Supply Radar · Prospect Tracker</div>
        <h2>Start the day on Today, then log the visit on site</h2>
        <p>See what’s due, what’s late and what’s going stale, find unvisited prospects near your route, and check in at a site to log the visit and plan the next step in one go.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}Supply Radar · Prospect Tracker</div>
      <h2>Your day and your visits, in one place</h2>
      <p>The Today tab gathers your tasks, deals that need a next step, deals going stale and prospects near your route. Check in at a site to confirm your location, record how it went, add notes or dictate them, and plan the next task. A first contact moves a New prospect to Contacted.</p>
      <div class="cta"><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button></div>
    </div></div>`;
  }

  function renderApp(s) {
    const body = s.view === 'today' ? today() : prospect(s);
    return `<div class="app">${sidebar()}${body}${s.view === 'checkin' ? checkIn(s) : ''}${s.cover ? cover(s.cover) : ''}</div>`;
  }
  function anchorMenus() {}

  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Start the day on the Today tab, then check in at a prospect to log the visit and plan the next step.'
      : '<span class="n">Done</span>Today gathers your tasks, deals with no task planned, deals going stale and prospects near your route. A check-in confirms your location, records the outcome and notes, and plans the next task.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
