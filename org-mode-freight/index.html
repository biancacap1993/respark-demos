<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReSpark Freight Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: an Arcade-style player. One framed browser window holds a scaled
   1440×820 mock of ReSpark (the Freight Lanes table, the Create Freight Trip
   drawer, a trip's Freight Info & Prices page, an outbound ticket's Freight
   Cost blade and a sales order's Freight Route section); a pulsing hotspot + tooltip guides each step; step controls
   sit under the frame. The app mock keeps ReSpark's light theme (it stands in
   for a screenshot); the page around it follows the viewer's theme. */
:root {
  --bg: #f3f5f8;
  --glow: rgba(0, 168, 176, 0.10);
  --fg: #12233e;
  --fg-muted: rgba(18, 35, 62, 0.62);
  --frame: #ffffff;
  --frame-bar: #eef1f5;
  --frame-line: rgba(18, 35, 62, 0.12);
  --ctl: #ffffff;
  --ctl-line: rgba(18, 35, 62, 0.16);
  --teal: #00a3a8;
  --teal-strong: #008a8f;
  --tip-bg: #12233e;
  --tip-fg: #ffffff;

  /* ReSpark app tokens (frontend/client/src/global.css, light mode) */
  --a-fg: hsl(217 55% 16%);
  --a-surface: #ffffff;
  --a-muted: hsla(217, 55%, 16%, 0.03);
  --a-muted-solid: #f8f9fa;
  --a-hover: hsla(217, 55%, 16%, 0.06);
  --a-border: hsla(217, 55%, 16%, 0.14);
  --a-border-subtle: hsla(217, 55%, 16%, 0.08);
  --a-text-2: hsla(217, 55%, 16%, 0.75);
  --a-text-3: hsla(217, 55%, 16%, 0.52);
  --a-icon-2: hsla(217, 55%, 16%, 0.42);
  --a-primary: hsl(183 100% 33%);
  --a-primary-hover: hsl(183 100% 27%);
  --a-primary-subtle: hsla(183, 100%, 33%, 0.10);
  --a-success: hsl(162 73% 37%);
  --a-success-strong: hsl(162 73% 30%);
  --a-error: hsl(348 81% 48%);
  --a-error-strong: hsl(348 81% 38%);
  --a-accent: hsl(252 89% 65%);
  --a-accent-strong: hsl(252 60% 50%);
  --a-accent-subtle: hsla(252, 89%, 65%, 0.10);
  --a-dark: hsl(217 45% 14%);
  --a-nav-selected: hsl(217 55% 16%);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
    --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
    --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
    --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1422; --glow: rgba(0, 201, 212, 0.10); --fg: #e8eef7; --fg-muted: rgba(232, 238, 247, 0.62);
  --frame: #17202f; --frame-bar: #1c2738; --frame-line: rgba(232, 238, 247, 0.12);
  --ctl: #17202f; --ctl-line: rgba(232, 238, 247, 0.18); --teal: #19c3cb; --teal-strong: #4fd6dc;
  --tip-bg: #00a3a8; --tip-fg: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  background-image: radial-gradient(60% 50% at 50% 38%, var(--glow), transparent 70%);
  min-height: 100vh; padding-inline: 16px; padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; color: var(--fg); }
.head .tag { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.frame { background: var(--frame); border: 1px solid var(--frame-line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(18, 35, 62, 0.28), 0 8px 18px -8px rgba(18, 35, 62, 0.18); }
.bar { height: 38px; background: var(--frame-bar); border-bottom: 1px solid var(--frame-line); display: flex; align-items: center; gap: 12px; padding-inline: 14px; position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--frame-line); display: block; }
.url { flex: 1; max-width: 460px; margin-inline: auto; height: 24px; border-radius: 6px; background: var(--frame); border: 1px solid var(--frame-line);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); padding-inline: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.url span { overflow: hidden; text-overflow: ellipsis; }
.url svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); transition: width .35s ease; }

.stage { position: relative; width: 100%; aspect-ratio: 1440 / 820; max-width: 100%; overflow: hidden; background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; transform-origin: 0 0; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.ring { position: absolute; border-radius: 6px; box-shadow: 0 0 0 2px var(--a-primary), 0 0 0 6px hsla(183, 100%, 33%, 0.18); transition: all .3s ease; pointer-events: none; }
.hot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: hsla(183, 100%, 33%, 0.28); border: 0; padding: 0; transition: left .3s ease, top .3s ease; }
.hot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--a-primary); box-shadow: 0 0 0 2px #fff; }
.hot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-primary); animation: pulse 1.6s ease-out infinite; }
.hot:focus-visible { outline: 3px solid var(--teal-strong); outline-offset: 3px; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.tip { position: absolute; max-width: 310px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 12px 28px -8px rgba(12, 20, 34, 0.45); pointer-events: auto; animation: tipIn .25s ease; }
.tip b { font-weight: 600; }
.tip code, .caption code { font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, 0.16); padding: 1px 5px; border-radius: 4px; }
.caption code { background: var(--frame-bar); }
.tip .n, .caption .n { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.caption { display: none; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
body.narrow .caption { display: block; }
body.narrow .tip { display: none; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--ctl-line);
  background: var(--ctl); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--ctl-line); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.count { font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; min-width: 0; }
.pips button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--ctl-line); cursor: pointer; }
.pips button.on { background: var(--teal); }
.pips button.done { background: color-mix(in srgb, var(--teal) 45%, transparent); }
.hint { font-size: 12px; color: var(--fg-muted); text-align: center; }
kbd { font: inherit; font-size: 11px; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 1px 5px; }

/* ================= ReSpark app mock (fixed light theme) ================= */
.app { width: 1440px; height: 820px; display: flex; font-family: var(--font); color: var(--a-fg); font-size: 13px; background: var(--a-surface); position: relative; overflow: hidden; }
.app table { color: inherit; } /* pages render without a doctype, where tables don't inherit text color; keeps the app mock readable in dark mode */
.app svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
.side { width: 236px; flex-shrink: 0; background: var(--a-muted-solid); border-right: 1px solid var(--a-border-subtle); display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; }
.side .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.side .top svg.mark { width: 28px; height: 28px; color: #12233e; }
.yard { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--a-border); border-radius: 6px; height: 30px; padding-inline: 8px; background: var(--a-surface); font-weight: 500; font-size: 12.5px; }
.yard svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.cmd { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid var(--a-border); border-radius: 6px; padding-inline: 8px; color: var(--a-text-3); background: var(--a-surface); font-size: 12.5px; }
.cmd kbd { margin-left: auto; font-size: 10.5px; border-color: var(--a-border); color: var(--a-text-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-weight: 500; color: hsla(217, 55%, 16%, 0.88); }
.nrow .chev { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.sub { padding-left: 30px; font-weight: 450; font-size: 12.5px; color: var(--a-text-2); }
.nrow.sub svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.nrow.active { background: var(--a-nav-selected); color: #fff; }
.nrow.active svg.lucide { color: #fff; }
.pill { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--a-text-2); background: var(--a-hover); padding: 1px 6px; border-radius: 999px; }
.nsep { height: 1px; background: var(--a-border-subtle); margin: 4px 6px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--a-border-subtle); }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--a-primary-subtle); color: var(--a-primary-hover); display: grid; place-items: center; font-weight: 600; font-size: 11px; }
.foot .who { display: flex; flex-direction: column; line-height: 1.25; }
.foot .who small { color: var(--a-text-3); font-size: 11px; }
.foot .ico { margin-left: auto; display: flex; gap: 4px; }
.foot .ico span { width: 28px; height: 28px; border: 1px solid var(--a-border-subtle); border-radius: 6px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 22px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.crumbs { font-size: 12px; color: var(--a-text-3); display: flex; align-items: center; gap: 4px; }
.crumbs svg.lucide { width: 12px; height: 12px; }
.phead h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.phead .left { display: flex; flex-direction: column; gap: 4px; }
.phead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }
.rb.pri { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.rb.icon { width: 32px; padding: 0; justify-content: center; }
.badge { display: inline-flex; align-items: center; height: 20px; padding-inline: 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.b-success { background: hsla(162, 73%, 37%, 0.14); color: var(--a-success-strong); }
.b-accent { background: hsla(252, 89%, 65%, 0.14); color: var(--a-accent-strong); }
.b-neutral { background: hsla(217, 55%, 16%, 0.07); color: var(--a-text-2); }

/* inventory pages */
.muted { color: var(--a-text-3); }
.link { color: var(--a-primary-hover); font-weight: 500; }
/* list-page header (ContentLayout, depth <= 2): title + actions on one row */
.lhead { display: flex; align-items: center; gap: 12px; padding: 18px 24px 6px; }
.lhead h1, .thead h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.lhead .acts, .thead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
/* deeper pages: back arrow + breadcrumbs, then title row, divider */
.thead { display: flex; flex-direction: column; gap: 8px; padding: 18px 24px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.thead .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--a-text-3); }
.thead .crumbs svg.lucide { width: 18px; height: 18px; color: var(--a-fg); }
.thead .crumbs .leaf { color: var(--a-fg); }
.thead .trow { display: flex; align-items: center; gap: 12px; }
.ntabs { display: flex; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--a-border-subtle); }
.ntabs span { font-size: 13px; font-weight: 500; color: var(--a-text-2); padding: 11px 0 10px; border-bottom: 2px solid transparent; }
.ntabs span.on { color: var(--a-primary-hover); border-bottom-color: var(--a-primary); }
.ibody { flex: 1; min-height: 0; padding: 0 24px 20px; display: flex; flex-direction: column; position: relative; }
.ibody.tabbed { padding-top: 4px; }

/* InventorySummaryBar */
.sbar { display: flex; border: 1px solid var(--a-border-subtle); border-radius: 6px; margin: 12px 0 8px; }
.sbar > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 16px; text-align: center; }
.sbar > i { width: 1px; height: 27px; align-self: center; background: var(--a-border-subtle); }
.sbar small { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--a-text-2); opacity: .85; }
.sbar b { font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.sbar span { font-size: 12px; color: var(--a-text-2); opacity: .8; }

/* ResparkGrid */
.gtb { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.inp { height: 36px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 10px; color: var(--a-text-3); font-size: 13px; background: var(--a-surface); white-space: nowrap; overflow: hidden; }
.inp svg.lucide { width: 16px; height: 16px; color: var(--a-text-2); }
.inp.sel { color: var(--a-fg); justify-content: space-between; }
.inp.sel svg.lucide { width: 14px; height: 14px; color: var(--a-icon-2); }
.segt { display: inline-flex; border: 1px solid var(--a-border-subtle); border-radius: 8px; padding: 2px; gap: 2px; height: 36px; }
.segt span { display: inline-flex; align-items: center; padding-inline: 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--a-text-2); }
.segt span.on { background: var(--a-surface); color: var(--a-fg); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14); }
.segt.inv span.on { background: var(--a-dark); color: #fff; box-shadow: none; }
.tcard { border: 1px solid var(--a-border-subtle); border-radius: 8px; overflow: hidden; flex: 1; min-height: 0; position: relative; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12px; padding: 0 10px; height: 38px; background: var(--a-muted-solid); border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--a-text-2); }
td { padding: 0 10px; height: 46px; border-bottom: 1px solid var(--a-border-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
td.num, th.num { text-align: right; }
td.c, th.c { padding: 0; text-align: center; }
tr.new td { background: hsla(183, 100%, 33%, 0.07); }
.stk { display: flex; flex-direction: column; line-height: 1.3; }
.stk small { font-size: 11.5px; color: var(--a-text-3); overflow: hidden; text-overflow: ellipsis; }
.cb { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--a-border); display: inline-block; vertical-align: middle; }
.kb { color: var(--a-icon-2); display: inline-grid; place-items: center; }
.chip { display: inline-flex; align-items: center; height: 22px; padding-inline: 8px; border-radius: 6px; border: 1px solid; font-size: 12px; font-weight: 500; white-space: nowrap; }
.c-success { background: hsla(162, 73%, 37%, 0.10); border-color: hsla(162, 73%, 37%, 0.30); color: var(--a-success-strong); }
.c-neutral { background: hsla(217, 55%, 16%, 0.08); border-color: var(--a-border); color: var(--a-text-2); }
.c-error { background: hsla(348, 81%, 48%, 0.08); border-color: hsla(348, 81%, 48%, 0.28); color: var(--a-error-strong); }
.c-info { background: hsla(212, 90%, 50%, 0.08); border-color: hsla(212, 90%, 50%, 0.28); color: hsl(212 80% 40%); }

/* Drawer primitive: floats 30px in from the edges over a dimmed backdrop */
.scrim { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.30); z-index: 5; animation: fade .2s ease; }
.drawer { position: absolute; top: 30px; right: 30px; bottom: 30px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; box-shadow: -12px 12px 40px rgba(15, 23, 42, 0.22); display: flex; flex-direction: column; z-index: 6; overflow: hidden; animation: slide .25s ease; }
.drawer.still, .scrim.still { animation: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.drawer .dh { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--a-border-subtle); }
.drawer .dt { display: flex; align-items: center; gap: 10px; }
.drawer .dt h3 { margin: 0; flex: 1; min-width: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
.drawer .dt .x, .drawer .dt .bk { color: var(--a-text-2); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; }
.drawer .dt .bk svg.lucide { width: 18px; height: 18px; }
.drawer .db { flex: 1; min-height: 0; padding: 20px; display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden; }
.drawer .db.end { justify-content: flex-end; }
.drawer .db > * { flex-shrink: 0; }
.drawer .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--a-border-subtle); background: hsla(217, 55%, 16%, 0.02); }
.fsec { display: flex; flex-direction: column; gap: 12px; }
.fsec > h4, .h4 { margin: 0; font-size: 14px; font-weight: 600; }
.fld { display: flex; flex-direction: column; gap: 4px; position: relative; }
.fld label { font-size: 12px; font-weight: 500; }
.fld label .req { color: var(--a-error); margin-left: 2px; }
.fld .desc { font-size: 12px; color: var(--a-text-2); }
.fld .in { height: 36px; border: 1px solid var(--a-border); border-radius: 6px; display: flex; align-items: center; gap: 6px; padding-inline: 10px; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--a-surface); }
.fld .in.ph { color: var(--a-text-3); }
.fld .in.r { justify-content: flex-end; }
.fld .in.open { border-color: var(--a-primary); box-shadow: 0 0 0 3px hsla(183, 100%, 33%, 0.15); }
.fld .in.dis { background: var(--a-muted-solid); color: var(--a-text-2); }
.fld .in .u { color: var(--a-text-3); }
.fld .in > svg.lucide { margin-left: auto; width: 14px; height: 14px; color: var(--a-icon-2); }
.fld .ta { height: 60px; border: 1px solid var(--a-border); border-radius: 6px; padding: 8px 10px; font-size: 13px; color: var(--a-text-3); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.dd { position: absolute; left: 0; right: 0; top: 62px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; box-shadow: 0 6px 22px rgba(15, 23, 42, 0.16); padding: 4px; z-index: 5; animation: pop .18s ease; }

/* Stepper primitive */

.stepper .s.done i { border-color: var(--a-primary); background: var(--a-primary); color: #fff; }

/* RadioGroup card variant */

/* package picker rows (toggle buttons) */
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--a-border); border-radius: 6px; }
.pick > svg.lucide { width: 18px; height: 18px; color: var(--a-text-3); }
.pick .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.pick .w { font-weight: 500; font-variant-numeric: tabular-nums; }
.pick.on { border-color: var(--a-primary); background: var(--a-primary-subtle); box-shadow: inset 0 0 0 1px var(--a-primary); }

/* Banner, finished good cards, summary box */
.banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid hsla(212, 90%, 50%, 0.28); background: hsla(212, 90%, 50%, 0.07); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.banner > svg.lucide { color: hsl(212 80% 45%); margin-top: 2px; }
.banner b { display: block; font-weight: 600; margin-bottom: 2px; }
.fgc { border: 1px solid var(--a-border); border-radius: 6px; overflow: hidden; }
.fgc .fh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--a-muted-solid); }
.fgc .fh .tg { font-size: 12px; font-weight: 600; color: var(--a-text-2); background: hsla(217, 55%, 16%, 0.08); border-radius: 4px; padding: 2px 8px; }
.fgc .fh .sm { font-size: 13px; color: var(--a-text-2); font-variant-numeric: tabular-nums; }
.fgc .fh .tr { margin-left: auto; color: var(--a-error); display: inline-grid; }
.fgc .fb { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.coll { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--a-text-2); }
.coll svg.lucide { width: 14px; height: 14px; }
.sumbox { border: 1px solid var(--a-border); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.sumbox .sh { display: flex; align-items: center; justify-content: space-between; }
.sumbox .sh > span:first-child { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--a-text-3); }
.sumbox .sr { display: flex; justify-content: space-between; font-size: 13px; }

.sumbox .sr span:last-child { font-weight: 500; font-variant-numeric: tabular-nums; }
.sumbox .sr.rule { border-top: 1px solid var(--a-border-subtle); padding-top: 8px; margin-top: 2px; }

/* buttons */
.rb { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding-inline: 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-border); background: var(--a-surface); color: var(--a-fg); cursor: default; white-space: nowrap; }

/* detail drawer (DetailSection / DetailField) */

.dsec h4 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }

.dgrid.c2 { grid-template-columns: 1fr 1fr; }
.dgrid.c3 { grid-template-columns: 1fr 1fr 1fr; }

.df2 { display: flex; flex-direction: column; min-width: 0; }

.df2 > span { margin-top: 4px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.fgl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--a-fg); color: #fff; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; box-shadow: 0 10px 24px rgba(18,35,62,.3); animation: pop2 .3s ease; z-index: 7; }

/* intro / outro */
.cover { position: absolute; inset: 0; background: rgba(248, 250, 252, 0.88); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 10; }
.cover .card { width: 700px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* freight lanes pages */

.trn { display: inline-flex; align-items: center; gap: 6px; }

.lst { border: 1px solid var(--a-border-subtle); border-radius: 6px; background: var(--a-muted-solid); }

<script>
(() => {
  const W = 1440, H = 820;
  const MARK = '<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M152.38 13.33C171.29 13.33 186.67 28.71 186.67 47.62V152.38C186.67 171.29 171.29 186.67 152.38 186.67H47.62C28.71 186.67 13.33 171.29 13.33 152.38V47.62C13.33 28.71 28.71 13.33 47.62 13.33H152.38ZM152.38 0H47.62C21.32 0 0 21.32 0 47.62V152.38C0 178.68 21.32 200 47.62 200H152.38C178.68 200 200 178.68 200 152.38V47.62C200 21.32 178.68 0 152.38 0Z" fill="#00C9D4"/><path d="M93.39 62.1C89.98 59.66 84.7 58.7 80.99 58.69L26.11 58.74L44.28 71.71H82.53C83.21 71.71 83.79 71.96 84.24 72.29C85.21 72.98 85.5 74.27 84.5 75.67L72.84 92.1L84.25 100.24L96.2 83.46C101.27 76.35 101.05 67.54 93.42 62.1L93.4 62.08Z" fill="currentColor"/><path d="M49.21 102.91C53.53 102.91 58.53 105.26 61.64 107.48L107.62 140.38H84.65L52.58 117.49C52.03 117.05 51.38 116.94 50.8 116.94C49.57 116.94 48.56 117.84 48.56 119.62L48.53 140.38H34.11V119.16C34.11 110.16 39.55 102.91 49.19 102.91Z" fill="currentColor"/><path d="M166.27 115.45V103.76C166.27 96.91 164.14 91.42 159.86 87.3C155.58 83.18 149.91 81.1 142.82 81.1H133.49C128.74 81.1 124.57 82.06 120.95 83.97C117.32 85.88 114.54 88.56 112.55 92.02C110.56 95.49 109.58 99.5 109.58 104.01V119.65C109.58 123.94 110.56 127.7 112.55 130.98C114.54 134.26 117.3 136.82 120.92 138.62C124.55 140.39 128.72 141.3 133.46 141.3H142.32C149.41 141.3 155.11 139.5 159.47 135.92C163.83 132.34 166.02 127.59 166.02 121.67H152.85C152.85 124.15 151.9 126.15 149.99 127.68C148.08 129.18 145.57 129.95 142.46 129.95H133.49C130.3 129.95 127.76 128.99 125.85 127.14C123.94 125.26 122.99 122.77 122.99 119.66V115.46H166.27ZM122.72 105.4V104.34C122.72 100.76 123.7 97.84 125.69 95.63C127.65 93.42 130.24 92.3 133.43 92.3H142.89C145.94 92.3 148.37 93.36 150.25 95.47C152.13 97.57 153.06 100.36 153.06 103.77V105.41H122.71Z" fill="currentColor"/></svg>';
  document.getElementById('brand').innerHTML = MARK + '<span>ReSpark</span>';

  const ic = (n, extra = '') => `<i data-lucide="${n}" ${extra}></i>`;


  // Sample data (illustrative, fictional yard, carriers and customers).
  // Leg rates follow formatLegRate (freightRouteCosts.ts): "$0.01/lbs · min $250.00 · FS 3%".
  const TR = { Truck: 'truck', Rail: 'train-front', Barge: 'anchor' };
  const M2 = v => '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const PU = (v, u = 'LBS') => M2(v) + '/' + u;
  const LANES = [
    { o: 'North Yard', d: 'Riverside Recycling — Main', c: 'Midstate Hauling', mt: 'Inbound', t: 'Truck', min: 275, um: 0.04, eff: '09/01/2026' },
    { o: 'North Yard', d: 'Lakeshore Steel — Plant 2', c: 'Northline Trucking', mt: 'Outbound', t: 'Truck', min: 425, um: 0.05, eff: '09/01/2026' },
    { o: 'North Yard', d: 'Chicago, IL', c: 'Lakeview Rail Co.', mt: 'Outbound', t: 'Rail', min: 1900, um: 31, eff: '06/01/2026', u: 'NT' },
    { o: 'North Yard', d: 'Cleveland, OH', c: 'Inland Barge Partners', mt: 'Outbound', t: 'Barge', min: 2400, um: 21.5, eff: '06/01/2026', u: 'NT' },
  ];
  // An existing trip, already on the list.
  const OLD = { name: 'North Yard → Fort Wayne via Lima', stops: ['North Yard', 'Lima, OH', 'Fort Wayne, IN'], tag: 'Multi-leg',
    legs: [{ c: 'Midstate Hauling', t: 'Truck', min: 200, um: 0.02 }, { c: 'Ridgeway Transport', t: 'Truck', min: 225, um: 0.03 }] };
  // The trip created in this walkthrough.
  const TRIP = 'North Yard → Chicago via Elkhart';
  const STOPS = ['North Yard', 'Elkhart, IN', 'Lakeshore Steel — Plant 2'];
  const LEGS = [
    { c: 'Northline Trucking', t: 'Truck', min: 250, um: 0.01, u: 'lbs', fs: 3, cost: 453.20 },
    { c: 'Lakeview Rail Co.', t: 'Rail', min: 500, um: 31, u: 'nt', fs: 4, cost: 709.28 },
  ];
  const TOTAL = 1162.48;
  const rate = l => `${PU(l.um, l.u)} · min ${M2(l.min)} · FS ${l.fs}%`;

  // ---------- steps ----------
  const FL = '/app/logistics/freight-lanes';
  const TRIPURL = FL + '/9b42e1';
  const OBT = '/app/sales/outbound-tickets/48231';
  const SO = '/app/contracts/sales-orders/2291/edit';
  const STEPS = [
    { view: 'fl', cover: 'intro', url: FL },
    { view: 'fl', t: '#btn-create', place: 'left', url: FL,
      tip: '<b>Freight Lanes</b> lists trips and single lanes together. A trip shows its <b>Segments</b> and a <b>Multi-leg</b> or <b>Multi-modal</b> tag, with its segments under it. To build one, click <b>Create Lane</b>.' },
    { view: 'fl', drawer: 'create', part: 'stops', t: '#itin', place: 'left', url: FL,
      tip: 'Set the <b>Origin</b> and <b>Destination</b>, then click <b>Add a stop</b> for the hub in between. A stop where the transportation type changes is marked <b>Mode change</b>.' },
    { view: 'fl', drawer: 'create', part: 'segs', t: '#segs', place: 'left', url: FL,

      tip: 'The trip opens on <b>Freight Info &amp; Prices</b>. <b>Carrier &amp; Location Info</b> lists every transportation type and carrier on the trip.' },
    { view: 'trip', t: '#cbp', place: 'bottom', url: TRIPURL,

    { view: 'trip', part: 'prices', t: '#seg-2', place: 'top', url: TRIPURL,

    { view: 'so', dd: true, t: '#attach', place: 'right', url: SO,

    { view: 'so', picked: true, t: '#route-sec', place: 'top', url: SO,

    { view: 'so', picked: true, cover: 'outro', url: SO },
  ];

  // ---------- chrome ----------
  function sidebar(active) {
    const row = (i, l, id = '') => `<div class="nrow${active === id && id ? ' active' : ''}">${ic(i)}<span>${l}</span>${ic('chevron-right', 'class="chev"')}</div>`;
    const sub = (id, l) => `<div class="nrow sub${active === id ? ' active' : ''}" id="nav-${id}"><span>${l}</span></div>`;
    const logi = active === 'fl'

  const trn = t => `<span class="trn">${ic(TR[t])}${t}</span>`;
  const stillFrom = key => { const p = STEPS[step - 1]; return p && p[key] && p.view === STEPS[step].view ? ' still' : ''; };

  // ---------- Freight Lanes list (UnifiedFreightLanesGrid) ----------
  function lanes(s) {
    const dir = mt => `<span class="tdir">${ic('arrow-right')}${mt}</span>`;
    const lane = l => `<tr><td class="c"><span class="cb"></span></td><td>${l.o}</td><td>${l.d}</td><td>1</td><td class="car">${l.c}</td><td>—</td>

    const trip = r => {
      const n = r.legs.length;
      const head = `<tr class="trip"><td class="c"><span class="cb"></span></td><td><div class="stk"><span>${r.name}</span><small>${r.stops[0]}</small></div></td><td>${r.stops[n]}</td><td>${n}</td>
        <td class="car">${r.legs[0].c} +${n - 1}</td><td><span class="badge ${r.tag === 'Multi-modal' ? 'b-accent' : 'b-neutral'}">${r.tag}</span></td><td>${dir('Outbound')}</td><td><span class="chipst">Active</span></td>
        <td>${trn(r.legs[0].t)}</td><td class="num">${M2(r.legs.reduce((a, l) => a + l.min, 0))}</td><td class="num">${PU(r.legs.reduce((a, l) => a + l.um, 0))}</td><td>lbs</td><td>10/01/2026</td></tr>`;

    return `<main class="main"><div class="lhead"><h1>Freight Lanes</h1></div>

  // CreateFreightLaneDrawer: Itinerary → Segments → Schedule → Trip (2+ segments).
  function createDrawer(s) {
    if (s.drawer !== 'create') return '';
    const still = stillFrom('drawer');
    const stop = (role, name, o = {}) => `<div class="stopr"><span class="mk"></span><div class="sc"><div class="rowc"><span class="sl">${role}${o.badge ? ` <span class="badge b-warn" style="margin-left:6px;letter-spacing:0;text-transform:none">${o.badge}</span>` : ''}</span>${o.del ? `<span class="kb">${ic('trash-2')}</span>` : ''}</div>
          ${fld('Location', box(o.loc ? name : 'Search yards and customers, or leave blank for a city', { ph: !o.loc, icon: 'chevron-down' }))}
          ${o.city ? `<div class="g3x">${fld('State', box(o.city[0], { icon: 'chevron-down' }), { req: true })}${fld('City', box(o.city[1], { icon: 'chevron-down', open: o.open }), { req: true })}${fld('ZIP', box('00000', { ph: true }))}</div>` : ''}</div></div>`;
    const itin = `<section class="fsec" id="itin"><div class="shd"><h4>Itinerary</h4><span class="badge nb">Outbound</span></div>
        ${ck('Applies in both directions', false)}
        ${stop('Origin', 'North Yard', { loc: true })}
        ${stop('Stop 1', '', { badge: 'Mode change', del: true, city: ['Indiana', 'Elkhart'], open: true })}
        ${stop('Destination', 'Lakeshore Steel — Plant 2', { loc: true })}
        <div class="rowc"><span class="rb">${ic('plus')}Add a stop</span><span class="rb" style="border-color:transparent;color:var(--a-text-3)">${ic('arrow-up-down')}Reverse</span></div></section>`;
    const segCard = (i, l) => `<div class="segc"><div class="sh2">${STOPS[i]} → ${STOPS[i + 1]}<small>segment ${i + 1} of 2</small></div>
        <div class="g2">${fld('Transportation Type', box(trn(l.t), { icon: 'chevron-down' }), { req: true })}${fld('Carrier', box(l.c, { icon: 'chevron-down' }), { req: true })}</div>
        <div class="g2">${fld('Min Price', box(l.min.toFixed(2), { r: true, pre: '$' }))}<div class="gpu">${fld('Price/UM', box(String(l.um.toFixed(2)), { r: true, pre: '$' }))}${fld('UM', box(l.u, { icon: 'chevron-down' }), { req: true })}</div></div>
        <div class="g2">${fld('Min Chargeback', same('Same as Min Price', l.min.toFixed(2)))}${fld('Fuel Surcharge', box(String(l.fs), { r: true, u: '%' }))}</div></div>`;
    const segs = `<section class="fsec" id="segs"><div class="shd"><h4>Segments</h4><small>one per gap between stops</small></div>${LEGS.map((l, i) => segCard(i, l)).join('')}</section>`;
    const sched = `<section class="fsec"><h4>Schedule</h4><div class="g2">
        ${fld('Effective Date', box('11/09/2026', { icon: 'calendar' }), { req: true })}${fld('Expiration Date', box('mm/dd/yyyy', { ph: true, icon: 'calendar' }))}</div></section>`;
    const trip = `<section class="fsec" id="trip-sec"><div class="shd"><h4>Trip</h4><small>required for multi-segment trips</small></div>
        ${fld('Trip name', box(TRIP, { open: true }), { req: true })}</section>`;
    const body = s.part === 'stops' ? itin : s.part === 'segs' ? segs : sched + trip;
    const title = s.part === 'stops' ? 'Create Freight Lane' : 'Create Freight Trip';
    return `<div class="scrim${still}"></div><div class="drawer${still}" style="width:600px"><div class="dh"><div class="dt"><h3>${title}</h3><span class="x">${ic('x')}</span></div></div>
      <div class="db">${body}</div><div class="df"><span class="rb md pri" id="btn-save">${title}</span></div></div>`;
  }

  // ---------- Trip detail (FreightTripDetailContainer) ----------
  function tripDetail(s) {
    const dfx = (label, v) => `<div class="dfx"><small>${label}</small>${v}</div>`;
    const head = `<div class="thead" style="border-bottom:0;padding-bottom:4px"><div class="ttl2"><h1>${TRIP}</h1><span class="pen">${ic('pencil')}</span><span class="pill2">Active</span>
        <span class="rb danger md">${ic('ban')}Disable</span></div></div>`;
    const tabs = `<div style="padding:0 24px"><div class="dtabs"><span class="on">Freight Info &amp; Prices</span><span>History</span></div></div>`;
    if (s.part === 'prices') {
      const grid = l => `<div class="tcard" style="flex:none"><table><thead><tr><th class="num">Min Price</th><th class="num">Price / UM</th><th style="width:70px">UM</th><th class="num">Min Chargeback</th><th class="num">Chargeback / UM</th><th class="num" style="width:90px">Fuel</th><th>Effective From</th><th>Expire On</th><th style="width:76px"></th></tr></thead>
          <tbody><tr><td class="num">${M2(l.min)}</td><td class="num">${PU(l.um, l.u)}</td><td>${l.u}</td><td class="num">${M2(l.min)}</td><td class="num">${PU(l.um, l.u)}</td><td class="num">${l.fs} %</td><td>11/09/2026</td><td></td>
          <td class="c"><span class="racts"><span>${ic('copy')}</span><span>${ic('trash-2')}</span></span></td></tr></tbody></table></div>`;
      const sec = (i, l) => `<div class="sgsec" id="seg-${i + 1}"><div class="sgh"><small>Segment ${i + 1} of 2</small><b>${STOPS[i]} → ${STOPS[i + 1]}</b><span>${l.t} · ${l.c}</span></div>
          <p class="dsh" style="margin:0">Freight Prices</p>${grid(l)}<div><span class="rb md">${ic('circle-plus')}Add Price</span></div></div>`;
      return `<main class="main">${head}${tabs}<div class="segs2"><h2>Freight Prices</h2>
        <p>Each segment is priced by the carrier that bills it, so each one keeps its own rates — edit and apply them a segment at a time.</p>
        ${LEGS.map((l, i) => sec(i, l)).join('')}</div></main>`;
    }
    const info = `<div class="cli" id="cli" style="padding-bottom:16px"><p class="dsh">Carrier &amp; Location Info</p><div class="grid4">
        ${dfx('Origin', `<span>${ic('route')}North Yard</span>`)}${dfx('Destination', `<span>${ic('route')}Lakeshore Steel — Plant 2</span>`)}
        ${dfx('Transportation Types', `<span>${ic('truck')}${ic('train-front')}Truck · Rail</span>`)}${dfx('Carriers', `<div class="stack"><span>Northline Trucking</span><span>Lakeview Rail Co.</span></div>`)}
        ${dfx('Direction', `<span>${ic('arrow-right')}One-way</span>`)}${dfx('Railcars', '<span>Any railcars</span>')}${dfx('Fuel surcharge applies to', '<span>Price &amp; Chargeback</span>')}</div></div>`;
    const path = `<div class="panel"><div class="ph2"><b>Path</b></div><div class="path">
        <div class="st"><span class="dot"></span><span>North Yard</span><small>Origin</small></div>
        <div class="st"><span class="dot mid"></span><span>Elkhart, IN</span><small>Mode change</small></div>
        <div class="st"><span class="dot"></span><span>Lakeshore Steel — Plant 2</span><small>Destination</small></div></div></div>`;
    const cb = `<div class="panel" id="cbp"><div class="ph2"><div><b>Freight Chargeback</b><small>Set the chargeback per leg or for the whole trip</small></div>
        <div class="tog"><span class="on">Per leg</span><span>Per lane</span></div></div>
        <div class="legbox">${LEGS.map((l, i) => `<div><b>Leg ${i + 1}</b><span>${PU(l.um, l.u)} · min ${M2(l.min)}</span></div>`).join('')}</div></div>`;
    return `<main class="main" style="position:relative">${head}${tabs}${info}<div class="sep" style="margin:0 24px 16px"></div><div class="two">${path}${cb}</div>
      ${s.toast ? `<div class="toast">${ic('circle-check')}Freight trip successfully created</div>` : ''}</main>`;
  }

  // ---------- Outbound ticket + Freight Cost blade ----------
  function ticket(s) {
    const still = stillFrom('blade');
    const legSec = (i, l) => `<section class="lsec"><h4>Route leg ${i + 1}</h4>
        <div class="g2">${fld('Carrier', box(l.c, { icon: 'chevron-down' }))}${fld('Transportation Type', box(trn(l.t), { icon: 'chevron-down' }))}</div>
        <h4 class="h6">Freight Cost</h4>
        <div class="rowc"><div style="flex:1">${fld(`Freight Cost (Route leg ${i + 1})`, box(l.cost.toFixed(2), { r: true, dis: true }))}</div><div style="flex:1;padding-top:18px">${ck('Automatically calculate freight cost', true)}</div></div></section>`;
    const blade = s.blade ? `<div class="scrim${still}"></div><div class="drawer edge${still}" style="width:640px"><div class="dh"><div class="dt"><h3>Freight Cost</h3><span class="x">${ic('x')}</span></div></div>
      <div class="db">
        <div class="rps" id="rps"><div class="rh">${ic('route')}Priced with route: ${TRIP}<span class="badge b-neutral">2 legs</span></div>
          ${LEGS.map((l, i) => `<div class="rl"><span><b>Leg ${i + 1}</b> · ${l.c} · ${l.t} · ${rate(l)}</span><span>${M2(l.cost)} / cb ${M2(l.cost)}</span></div>`).join('')}
          <div class="rt2"><b>Route total</b><span>${M2(TOTAL)} / cb ${M2(TOTAL)}</span></div></div>
        ${legSec(0, LEGS[0])}${legSec(1, LEGS[1])}
      </div><div class="df"><span class="rb md">${ic('plus')}Add Freight Cost</span><span class="rb md">Close</span></div></div>` : '';
    return `<main class="main"><div class="thead"><div class="crumbs">${ic('arrow-left')}<span>Outbound Tickets</span><span>/</span><span class="leaf">48231</span></div>
        <div class="trow"><h1>Outbound Ticket #48231</h1></div></div>
      <div class="tk"><div class="tbody">
        <div class="col"><h5>Consumer / Contract Info</h5><div class="sec">
          <div class="r2">${fld('Sales Order', box('SO-2291 · Lakeshore Steel', { icon: 'chevron-down' }))}${fld('Customer Order #', box('LS-77104'))}</div>
          ${fld('Consumer Name', box('Lakeshore Steel', { icon: 'chevron-down' }))}
          <div class="r2">${fld('Effective Date', box('11/09/2026, 09:40 AM', { icon: 'calendar' }))}${fld('Site Location', box('Plant 2', { icon: 'chevron-down' }))}</div>
        </div></div>
        <div class="col"><h5>Transportation Info</h5><div class="sec">
          <div class="r2">${fld('Carrier', box('Northline Trucking', { icon: 'chevron-down' }))}${fld('Driver Name', box(''))}</div>
          <div class="r2">${fld('FOB/INCO', box(''))}${fld('Truck #', box('T-114'))}${fld('Trailer #', box('TR-22'))}</div>
        </div></div>
      </div>
      <div class="tfoot"><div class="notes">Notes</div>
        <div class="fv" id="ft-freight"><small>Freight:</small><span class="fr">$${TOTAL.toFixed(2)}</span></div>
        <div class="fv"><small>Gross:</small><span>74,000 lb</span></div><div class="fv"><small>Tare:</small><span>30,000 lb</span></div><div class="fv"><small>Net:</small><span>44,000 lb</span></div>
      </div>${blade}</div></main>`;
  }

  // ---------- Sales order: Freight Destination + Freight Route ----------
  function salesOrder(s) {
    const legsTbl = `<div class="tcard" style="flex:none"><table class="legs"><thead><tr><th style="width:44px">Leg</th><th style="width:220px">Lane</th><th style="width:190px">Carrier</th><th>Price</th><th>Chargeback</th></tr></thead>
        <tbody>${LEGS.map((l, i) => `<tr><td>${i + 1}</td><td>${STOPS[i]} → ${STOPS[i + 1]}</td><td>${l.c} · ${l.t}</td><td>${rate(l)}</td><td>${rate(l)}</td></tr>`).join('')}</tbody></table></div>`;
    const dd = s.dd ? `<div class="dd" style="top:62px">
        <div class="o hv"><div class="tx"><b>${TRIP}</b><small>${STOPS.join(' → ')} · 2 legs</small></div></div>
        <div class="o"><div class="tx"><b>${OLD.name}</b><small>${OLD.stops.join(' → ')} · 2 legs</small></div></div></div>` : '';
    const attach = fld(s.picked ? 'Replace with an existing freight lane' : 'Attach an existing freight lane',
      box(s.dd ? 'Chicago' : 'Search freight by name', { ph: !s.dd, open: s.dd, icon: 'chevron-down' }), { id: 'attach', after: dd });
    const content = s.picked
      ? `<div class="picked"><div class="pt">${TRIP}<span class="gh">Undo</span></div><small>${STOPS.join(' → ')} · copied to this contract when it is saved</small></div>${legsTbl}`
      : `<p class="muted" style="margin:0">No freight route yet. Attach an existing freight lane, or build a route for this contract.</p>`;
    const route = `<section class="fsec" id="route-sec" style="gap:12px"><div class="frh">${ic('route')}Freight Route<span class="sw" aria-label="Enable freight route"></span></div>
        ${content}
        <div class="rowc" style="align-items:flex-end"><div style="width:440px">${attach}</div><span class="rb md">${ic(s.picked ? 'pencil' : 'plus')}${s.picked ? 'Edit this route' : 'Build a route'}</span></div></section>`;
    return `<main class="main"><div class="thead"><div class="crumbs">${ic('arrow-left')}<span>Back</span></div>
        <div class="trow"><h1>Sales Order #2291</h1><div class="acts"><span class="rb md pri">Save</span><span class="rb md">Cancel</span></div></div></div>
      <div class="so"><div class="ecard"><h4>Freight Destination</h4>
          <div class="g4">${fld('Customer Name', box('Lakeshore Steel', { icon: 'chevron-down' }))}${fld('Location Name', box('Plant 2', { icon: 'chevron-down' }))}${fld('City', box('Chicago'))}${fld('State', box('Illinois', { icon: 'chevron-down' }))}</div>
          <div class="sep" style="margin:4px 0 0"></div>${route}</div></div></main>`;
  }

  function cover(kind) {
    if (kind === 'intro') {
      return `<div class="cover"><div class="card">
        <div class="eyebrow">${ic('route')}ReSpark Logistics · Rolling out</div>
        <h2>Org Mode Freight</h2>
        <p>Price a shipment that moves in more than one hop, like truck to a rail hub and then rail to the customer. A trip chains freight lanes together, and each segment keeps its own carrier, transportation type and rate.</p>
        <div class="cta"><button class="go" type="button" data-go="next">Get started${ic('arrow-right')}</button></div>
      </div></div>`;
    }
    return `<div class="cover"><div class="card">
      <div class="eyebrow">${ic('circle-check')}Multi-leg freight, priced end to end</div>
      <h2>One trip, every carrier priced</h2>
      <p>Build a trip once, and tickets price each segment with its own carrier and rate. The freight total is the sum of the legs, and a freight bill is created for each segment’s carrier. A single lane that matches a ticket is used before a trip, and every segment needs a price that covers the ticket’s date.</p>
      <div class="cta"><a class="go" href="https://help.respark.com/articles/6722123884-Set-up-multi-leg-freight-trips-and-routes" target="_blank" rel="noopener">${ic('book-open')}Read the full guide</a><button class="go sec" type="button" data-go="restart">${ic('rotate-ccw')}Replay</button></div>
    </div></div>`;
  }

  function renderApp(s) {
    const view = s.view === 'trip' ? tripDetail(s) : s.view === 'obt' ? ticket(s) : s.view === 'so' ? salesOrder(s) : lanes(s);
    const nav = s.view === 'obt' ? 'sales' : s.view === 'so' ? 'contracts' : 'fl';
    return `<div class="app">${sidebar(nav)}${view}${s.cover ? cover(s.cover) : ''}</div>`;
  }
  function anchorMenus() {}

  // ---------- player ----------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const pips = document.getElementById('pips');
  const backBtn = document.getElementById('back');
  const nextBtn = document.getElementById('next');
  let step = 0;
  const guided = STEPS.map((s, i) => (s.tip ? i : null)).filter(i => i !== null);

  pips.innerHTML = STEPS.map((_, i) => `<button type="button" role="tab" aria-label="Step ${i + 1}" data-i="${i}"></button>`).join('');
  pips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  function scale() {
    const k = stage.clientWidth / W;
    canvas.style.transform = `scale(${k})`;
    document.body.classList.toggle('narrow', stage.clientWidth < 700);
    return k;
  }

  function place() {
    overlay.innerHTML = '';
    const s = STEPS[step];
    anchorMenus(s);
    if (!s.t) return;
    const el = canvas.querySelector(s.t);
    if (!el) return;
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    const n = guided.indexOf(step) + 1;
    const label = `<span class="n">Step ${n} of ${guided.length}</span>`;

    const ring = document.createElement('div');
    ring.className = 'ring';
    Object.assign(ring.style, { left: x - 3 + 'px', top: y - 3 + 'px', width: w + 6 + 'px', height: h + 6 + 'px' });
    const hot = document.createElement('button');
    hot.className = 'hot';
    hot.type = 'button';
    hot.setAttribute('aria-label', 'Continue to next step');
    hot.style.left = x + w / 2 + 'px';
    hot.style.top = y + h / 2 + 'px';
    hot.addEventListener('click', () => go(step + 1));
    overlay.append(ring, hot);

    caption.innerHTML = label + s.tip;
    if (document.body.classList.contains('narrow')) return;

    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = label + s.tip;
    overlay.append(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 18;
    const SW = stage.clientWidth, SH = stage.clientHeight;
    let tx, ty;
    const side = s.place || 'right';
    if (side === 'right') { tx = x + w + gap; ty = y + h / 2 - th / 2; }
    if (side === 'left') { tx = x - tw - gap; ty = y + h / 2 - th / 2; }
    if (side === 'bottom') { tx = x + w / 2 - tw / 2; ty = y + h + gap; }
    if (side === 'top') { tx = x + w / 2 - tw / 2; ty = y - th - gap; }
    if (side === 'right' && tx + tw > SW - 8) { tx = x - tw - gap; }
    if (side === 'left' && tx < 8) { tx = x + w + gap; }
    tx = Math.max(10, Math.min(SW - tw - 10, tx));
    ty = Math.max(10, Math.min(SH - th - 10, ty));
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  }

  function render() {
    const s = STEPS[step];
    canvas.innerHTML = renderApp(s);
    if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    document.getElementById('url').textContent = 'app.respark.com' + s.url;
    document.getElementById('progress').style.width = (step / (STEPS.length - 1)) * 100 + '%';
    [...pips.children].forEach((b, i) => { b.className = i === step ? 'on' : i < step ? 'done' : ''; b.setAttribute('aria-selected', i === step); });
    const n = guided.indexOf(step);
    document.getElementById('count').textContent = s.cover === 'intro' ? 'Intro' : s.cover === 'outro' ? 'Done' : `${n + 1} / ${guided.length}`;
    backBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
    if (s.cover) caption.innerHTML = s.cover === 'intro'
      ? '<span class="n">Intro</span>Org Mode Freight: chain freight lanes into a trip, price each segment, and see the legs on a ticket and a sales order.'
      : '<span class="n">Done</span>From a new trip to a priced ticket and a sales order. Replay any step with the bars above.';
    scale();
    // Measure only after entrance animations (panels sliding in, menus
    // popping, pins dropping) finish, or the ring lands where the element
    // was mid-animation instead of where it ends up.
    const token = ++renderToken;
    settle().then(() => { if (token === renderToken) place(); });
  }

  let renderToken = 0;
  function settle() {
    const finite = (canvas.getAnimations ? canvas.getAnimations({ subtree: true }) : [])
      .filter(a => a.effect && a.effect.getComputedTiming().iterations !== Infinity);
    const done = Promise.all(finite.map(a => a.finished.catch(() => {})));
    const timeout = new Promise(r => setTimeout(r, 1200));
    // If the timeline is throttled (background tab), snap leftovers to their
    // end state so the measurement still matches the final layout.
    return Promise.race([done, timeout]).then(() => {
      finite.forEach(a => { if (a.playState !== 'finished') try { a.finish(); } catch (e) {} });
      return new Promise(r => setTimeout(r, 30));
    });
  }

  // Self-check used before publishing: walks every step and reports any
  // highlight that doesn't sit on its target, targets that are missing or
  // clipped, and tooltips that cover the thing they point at.
  function checkStep() {
    const s = STEPS[step];
    if (!s.t) return { step, ok: true };
    const el = canvas.querySelector(s.t), ring = overlay.querySelector('.ring'), tip = overlay.querySelector('.tip');
    if (!el) return { step, ok: false, why: `target ${s.t} not found` };
    if (!ring) return { step, ok: false, why: 'highlight not drawn' };
    const a = el.getBoundingClientRect(), b = ring.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const off = Math.max(Math.abs(a.left - 3 - b.left), Math.abs(a.top - 3 - b.top), Math.abs(a.width + 6 - b.width), Math.abs(a.height + 6 - b.height));
    const issues = [];
    if (off > 2) issues.push(`highlight off by ${Math.round(off)}px`);
    if (a.width < 4 || a.height < 4) issues.push('target has no size');
    if (a.left < st.left - 1 || a.top < st.top - 1 || a.right > st.right + 1 || a.bottom > st.bottom + 1) issues.push('target clipped by frame');
    if (tip) {
      const t = tip.getBoundingClientRect();
      const ix = Math.max(0, Math.min(a.right, t.right) - Math.max(a.left, t.left)), iy = Math.max(0, Math.min(a.bottom, t.bottom) - Math.max(a.top, t.top));
      if (ix * iy > 0.25 * a.width * a.height) issues.push('tooltip covers target');
    }
    return { step, target: s.t, ok: issues.length === 0, issues };
  }
  window.walkthroughAudit = async () => {
    const results = [];
    for (let i = 0; i < STEPS.length; i++) {
      go(i);
      await settle();
      await new Promise(r => setTimeout(r, 60));
      results.push(checkStep());
    }
    go(0);
    return { ok: results.every(r => r.ok), problems: results.filter(r => !r.ok), steps: results.length };
  };

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
  }

  canvas.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { go(g.dataset.go === 'restart' ? 0 : step + 1); return; }
    const s = STEPS[step];
    if (s.t && e.target.closest(s.t)) go(step + 1);
  });
  backBtn.addEventListener('click', () => go(step - 1));
  nextBtn.addEventListener('click', () => go(step + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });
  new ResizeObserver(() => { scale(); settle().then(place); }).observe(stage);
  if (document.fonts) document.fonts.ready.then(place);

  if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
  render();
})();
</script>
